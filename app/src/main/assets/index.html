<script>
(()=>{
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), W = 360;
let H = 640;

const rnd = (a, b) => a + Math.random() * (b - a);

// ==========================================
// TUNING CONSTANTS (Scale, Speed, Physics)
// ==========================================
const SPEED_MULTIPLIER = 1.0;
const VERTICAL_RESPONSE = 1.0;
const SHOW_DEBUG = true;

const THRUST_RISE_TIME = 0.10;
const THRUST_FALL_TIME = 0.25;
const AIR_DRAG = 1.2;

const CAR_SCALE = 2.0;
const CAR_X = 140;
const CX = CAR_X;

const HITBOX_HALF_W = 26 * CAR_SCALE;
const HITBOX_TOP_OFFSET = 9 * CAR_SCALE;
const HITBOX_BOT_OFFSET = 11 * CAR_SCALE;
const CAR_HITBOX_H = HITBOX_TOP_OFFSET + HITBOX_BOT_OFFSET; // 40px

// Vertical Handling in canvas-height units (H = canvas height)
let LIFT_ACCEL = 0.45 * H * VERTICAL_RESPONSE;
let GRAVITY = 0.28 * H * VERTICAL_RESPONSE;
let MAX_UP_SPEED = 0.13 * H * VERTICAL_RESPONSE;
let MAX_DOWN_SPEED = 0.10 * H * VERTICAL_RESPONSE;

const ROAD_LANE_H = 36;
let ROAD_TOP = 400;
const CAR_DRAW_W = 142;
let CAR_DRAW_H = 48;
let CAR_REST_Y = ROAD_TOP + 3;
const START_ROAD_START = -100, START_ROAD_END = 370;
const LEVEL_LENGTH = 1100;
const TUNNEL_START_X = 740;
const TUNNEL_END_X = TUNNEL_START_X + LEVEL_LENGTH;
const FINISH_OPEN_GAP = 350;
const FINISH_ROAD_X = TUNNEL_END_X + FINISH_OPEN_GAP;
const FINISH_ROAD_LEN = 600;
const FINISH_ROAD_END = FINISH_ROAD_X + FINISH_ROAD_LEN;

const RETRY_FROM_LEVEL_START = true;

let topInset = 34; // Minimum 34px to clear phone status bar
let botInset = 0;

function updateSafeInsets() {
  try {
    const div = document.createElement('div');
    div.style.cssText = 'position:fixed;top:0;left:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden;pointer-events:none;';
    document.body.appendChild(div);
    const cs = window.getComputedStyle(div);
    const pt = parseFloat(cs.paddingTop) || 0;
    const pb = parseFloat(cs.paddingBottom) || 0;
    document.body.removeChild(div);

    const rect = cv.getBoundingClientRect();
    const scale = H / (rect.height || window.innerHeight || 1);
    topInset = Math.max(34, Math.round(pt * scale));
    botInset = Math.round(pb * scale);
  } catch (e) {
    topInset = 34;
    botInset = 0;
  }
}

let dpr = 1;
function resizeCanvas() {
  const winW = window.innerWidth || cv.clientWidth || 360;
  const winH = window.innerHeight || cv.clientHeight || 640;
  H = Math.max(560, Math.round(W * (winH / winW)));
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ROAD_TOP = H - 240;
  CAR_REST_Y = ROAD_TOP + 3;

  LIFT_ACCEL = 0.45 * H * VERTICAL_RESPONSE;
  GRAVITY = 0.28 * H * VERTICAL_RESPONSE;
  MAX_UP_SPEED = 0.13 * H * VERTICAL_RESPONSE;
  MAX_DOWN_SPEED = 0.10 * H * VERTICAL_RESPONSE;

  updateSafeInsets();
}
resizeCanvas();

// Deterministic PRNG
function hashInt(n) {
  n = ((n >> 16) ^ n) * 0x45d9f3b;
  n = ((n >> 16) ^ n) * 0x45d9f3b;
  n = (n >> 16) ^ n;
  return n >>> 0;
}

function mulberry32(a) {
  return function() {
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ==========================================
// LEVEL BACKGROUND & CAR PRELOADER
// ==========================================
const LEVEL_PICTURE_URLS = [
  'image_39e1ec82.png' // Level 1 custom bright picture
];
const CAR_IMAGE_URL = 'image_dc734168.png';

let carImgLoaded = false;
let carImgFailed = false;
let trimmedCarCanvas = null;
let carFadeAlpha = 0;

const preloadedPictures = [];
let loadedPicturesCount = 0;
let totalPicturesToLoad = LEVEL_PICTURE_URLS.length + 1; // backgrounds + car image
let assetsReady = false;

function onAssetLoaded() {
  loadedPicturesCount++;
  if (loadedPicturesCount >= totalPicturesToLoad) {
    assetsReady = true;
  }
}

function processCarImage(img) {
  try {
    const origW = img.naturalWidth || img.width;
    const origH = img.naturalHeight || img.height;

    const offCanv = document.createElement('canvas');
    offCanv.width = origW;
    offCanv.height = origH;
    const offCtx = offCanv.getContext('2d');
    offCtx.drawImage(img, 0, 0);

    const imgData = offCtx.getImageData(0, 0, origW, origH);
    const d = imgData.data;

    // Green Chroma Key with smooth edge blending & despill:
    // Do not remove any yellow pixels of the car body.
    // Only remove pixels where green is clearly higher than both red and blue.
    const threshLow = 30;
    const threshHigh = 65;

    for (let i = 0; i < d.length; i += 4) {
      const r = d[i];
      const g = d[i + 1];
      const b = d[i + 2];
      const maxRB = Math.max(r, b);
      const diff = g - maxRB;

      if (diff >= threshHigh) {
        // Pure green background -> fully transparent
        d[i + 3] = 0;
      } else if (diff > threshLow) {
        // Soft edge blending
        const factor = (diff - threshLow) / (threshHigh - threshLow);
        d[i + 3] = Math.round(255 * (1 - factor));
        // Despill green fringe at boundary
        d[i + 1] = maxRB;
      } else {
        // Never remove or alter yellow body pixels (where r is high).
        // Only despill dark/neutral edges if green is slightly above red & blue:
        if (diff > 12 && r < 120) {
          d[i + 1] = maxRB;
        }
      }
    }

    offCtx.putImageData(imgData, 0, 0);

    // Auto-trim empty transparent space so tires sit at exact bottom edge
    let minX = origW, maxX = 0, minY = origH, maxY = 0;
    for (let y = 0; y < origH; y++) {
      for (let x = 0; x < origW; x++) {
        const a = d[(y * origW + x) * 4 + 3];
        if (a > 20) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }

    if (minX <= maxX && minY <= maxY) {
      const trimW = maxX - minX + 1;
      const trimH = maxY - minY + 1;

      const tCanv = document.createElement('canvas');
      tCanv.width = trimW;
      tCanv.height = trimH;
      const tCtx = tCanv.getContext('2d');
      tCtx.drawImage(offCanv, minX, minY, trimW, trimH, 0, 0, trimW, trimH);

      trimmedCarCanvas = tCanv;
      CAR_DRAW_H = Math.round(CAR_DRAW_W * (trimH / trimW));
      CAR_REST_Y = ROAD_TOP + 3;
      if (st === 'ready') cy = CAR_REST_Y;
    }
    carImgLoaded = true;
  } catch (err) {
    console.warn('Failed to process car image:', err);
  }
}

function loadLevelPictures() {
  LEVEL_PICTURE_URLS.forEach((url, idx) => {
    const item = {
      index: idx + 1,
      url,
      img: new Image(),
      loaded: false,
      failed: false,
      seamlessCanvas: null,
      unitW: 0
    };

    item.img.onload = () => {
      try {
        item.loaded = true;
        updatePictureSeamlessCanvas(item);
      } catch (err) {
        console.warn('Error processing level image:', err);
      }
      onAssetLoaded();
    };

    item.img.onerror = () => {
      item.failed = true;
      onAssetLoaded();
    };

    item.img.src = url;
    preloadedPictures.push(item);
  });
}

// Load and process car image first before anything else
const carImg = new Image();
carImg.onload = () => {
  if (!trimmedCarCanvas) processCarImage(carImg);
  carImgLoaded = true;
  onAssetLoaded();
  loadLevelPictures();
};
carImg.onerror = (err) => {
  console.warn('Car image failed to load:', err);
  carImgFailed = true;
  onAssetLoaded();
  loadLevelPictures();
};
carImg.src = CAR_IMAGE_URL;
if (carImg.complete && carImg.naturalWidth > 0 && !trimmedCarCanvas) {
  processCarImage(carImg);
  carImgLoaded = true;
}

function updatePictureSeamlessCanvas(item) {
  if (!item.img || item.img.naturalWidth === 0) return;
  const aspect = item.img.naturalWidth / item.img.naturalHeight;
  const scaledW = Math.round(aspect * H);
  item.unitW = scaledW * 2;

  const sCanv = document.createElement('canvas');
  sCanv.width = item.unitW;
  sCanv.height = H;
  const sCtx = sCanv.getContext('2d');

  sCtx.drawImage(item.img, 0, 0, scaledW, H);
  sCtx.save();
  sCtx.translate(item.unitW, 0);
  sCtx.scale(-1, 1);
  sCtx.drawImage(item.img, 0, 0, scaledW, H);
  sCtx.restore();

  item.seamlessCanvas = sCanv;
}

function getLevelPicture(lvl) {
  if (!preloadedPictures.length) return null;
  const idx = (lvl - 1) % preloadedPictures.length;
  const item = preloadedPictures[idx];
  if (item && item.loaded && !item.failed && item.seamlessCanvas) {
    return item;
  }
  return null;
}

// ==========================================
// AUDIO SYSTEM (Real mute support & Web Audio)
// ==========================================
let audioCtx = null;
let masterGain = null;
let soundEnabled = true;
let vibrateEnabled = true;

try {
  soundEnabled = localStorage.getItem('skycarSound') !== 'false';
  vibrateEnabled = localStorage.getItem('skycarVibrate') !== 'false';
} catch(e) {}

function initAudio() {
  if (audioCtx) return;
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  if (!AudioContext) return;
  audioCtx = new AudioContext();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = soundEnabled ? 0.35 : 0;
  masterGain.connect(audioCtx.destination);
}

function setSound(enabled) {
  soundEnabled = enabled;
  try { localStorage.setItem('skycarSound', enabled ? 'true' : 'false'); } catch(e) {}
  if (masterGain && audioCtx) {
    masterGain.gain.setValueAtTime(soundEnabled ? 0.35 : 0, audioCtx.currentTime);
  }
}

function setVibrate(enabled) {
  vibrateEnabled = enabled;
  try { localStorage.setItem('skycarVibrate', enabled ? 'true' : 'false'); } catch(e) {}
}

function triggerVibrate(pattern) {
  if (!vibrateEnabled) return;
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch(e) {}
}

function playClickSound() {
  if (!soundEnabled) return;
  initAudio();
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const now = audioCtx.currentTime;
    osc.type = 'sine';
    osc.frequency.setValueAtTime(540, now);
    osc.frequency.exponentialRampToValueAtTime(880, now + 0.06);
    g.gain.setValueAtTime(0.25, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(now);
    osc.stop(now + 0.06);
  } catch(e) {}
}

function playCrashSound() {
  triggerVibrate([80, 40, 100]);
  if (!soundEnabled) return;
  initAudio();
  if (!audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(160, now);
    osc.frequency.exponentialRampToValueAtTime(30, now + 0.32);
    g.gain.setValueAtTime(0.45, now);
    g.gain.exponentialRampToValueAtTime(0.01, now + 0.32);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(now);
    osc.stop(now + 0.32);
  } catch(e) {}
}

function playWinSound() {
  triggerVibrate([40, 50, 40, 50, 90]);
  if (!soundEnabled) return;
  initAudio();
  if (!audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    const freqs = [523.25, 659.25, 783.99, 1046.5];
    freqs.forEach((f, i) => {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      const t = now + i * 0.09;
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.3, t);
      g.gain.exponentialRampToValueAtTime(0.01, t + 0.22);
      osc.connect(g);
      g.connect(masterGain);
      osc.start(t);
      osc.stop(t + 0.22);
    });
  } catch(e) {}
}

// ==========================================
// PROCEDURAL LEVEL CONFIG & FALLBACK SCENES
// ==========================================
const SCENE_NAMES = [
  'Sky Town',
  'Beach Town',
  'Candy Land',
  'Snow Village',
  'Desert Oasis',
  'Jungle Temple',
  'Space Station',
  'Underwater City'
];

const SHAPE_TYPES = [
  'cone', 'needle', 'fat stud', 'double-cone', 'faceted crystal',
  'curved thorn', 'fork', 'saw tooth', 'bullet', 'flame-shaped'
];
const RAIL_STYLES = ['rivets', 'bolts', 'small gears', 'chain links', 'dots'];

function getSceneType(level) {
  return (level - 1) % 8;
}

function generateLevelConfig(level, prev) {
  const sceneId = getSceneType(level);
  const seed = hashInt(level * 10007 + 773);
  const rng = mulberry32(seed);
  const pick = arr => arr[Math.floor(rng() * arr.length)];
  const range = (a, b) => a + rng() * (b - a);

  let H = Math.round((level * 137.508) % 360);
  const name = SCENE_NAMES[sceneId] + (level > 8 ? ` ${Math.floor((level - 1) / 8) + 1}` : '');

  let bgTop, bgBot, cloudColor;
  switch (sceneId) {
    case 0: // Sky Town
      bgTop = '#48cae4'; bgBot = '#caf0f8'; cloudColor = '#ffffff'; H = 195;
      break;
    case 1: // Beach Town
      bgTop = '#00b4d8'; bgBot = '#ffd166'; cloudColor = '#ffffff'; H = 45;
      break;
    case 2: // Candy Land
      bgTop = '#ff70a6'; bgBot = '#ffd670'; cloudColor = '#fff0f5'; H = 330;
      break;
    case 3: // Snow Village
      bgTop = '#7097c2'; bgBot = '#dceaf7'; cloudColor = '#ffffff'; H = 210;
      break;
    case 4: // Desert Oasis
      bgTop = '#f77f00'; bgBot = '#fcbf49'; cloudColor = '#fff5eb'; H = 35;
      break;
    case 5: // Jungle Temple
      bgTop = '#2ec4b6'; bgBot = '#cbf3f0'; cloudColor = '#f0fff4'; H = 150;
      break;
    case 6: // Space Station
      bgTop = '#240046'; bgBot = '#7b2cbf'; cloudColor = '#ff9e00'; H = 275;
      break;
    case 7: // Underwater City
      bgTop = '#023e8a'; bgBot = '#0096c7'; cloudColor = '#90e0ef'; H = 190;
      break;
  }

  if (level > 8) {
    const shift = Math.floor(rng() * 40) - 20;
    H = (H + shift + 360) % 360;
  }

  const shapeType = pick(SHAPE_TYPES);
  const width = Math.round(range(10, 15));
  const heightRatio = +(range(1.6, 2.8)).toFixed(2);
  const tipSharpness = pick(['sharp', 'medium', 'rounded']);
  const collarRing = rng() > 0.35;
  const bend = +(range(-0.3, 0.3)).toFixed(2);
  const railStyle = pick(RAIL_STYLES);

  const spikeSat = Math.round(range(75, 95));
  const spikeLit = Math.round(range(44, 56));
  const spikeColor = { h: H, s: spikeSat, l: spikeLit };
  const railColor = `hsl(${H}, 35%, 52%)`;

  return {
    level,
    sceneId,
    name,
    H,
    bgTop,
    bgBot,
    cloudColor,
    spikeColor,
    shapeType,
    width,
    heightRatio,
    tipSharpness,
    collarRing,
    bend,
    railStyle,
    railColor,
    accentColor: `hsl(${H}, 90%, 50%)`,
    glowColor: `hsl(${H}, 95%, 60%)`
  };
}

const levelConfigCache = new Map();
function getLevelConfig(level) {
  if (levelConfigCache.has(level)) return levelConfigCache.get(level);
  const prev = level > 1 ? getLevelConfig(level - 1) : null;
  const cfg = generateLevelConfig(level, prev);
  levelConfigCache.set(level, cfg);
  return cfg;
}

let curConfig = getLevelConfig(1);
let spikeCanvases = {};
let fallbackBgCanvas = null;
let fallbackParallaxCanvases = [];

function roundRect(c, x, y, w, h, r) {
  if (w < 2 * r) r = w / 2;
  if (h < 2 * r) r = h / 2;
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function renderSpikeToCanvas(canvas, isTop, h, cfg) {
  const sCtx = canvas.getContext('2d');
  sCtx.clearRect(0, 0, canvas.width, canvas.height);

  const cx = 18;
  const baseY = isTop ? 2 : 46;
  const dir = isTop ? 1 : -1;
  const tipY = baseY + dir * h;
  const w = Math.min(16, Math.max(9, cfg.width));
  const bendOffset = (cfg.bend || 0) * (h * 0.22);
  const tipX = cx + bendOffset;

  const H = cfg.spikeColor.h, S = cfg.spikeColor.s, L = cfg.spikeColor.l;
  const colBase = `hsl(${H}, ${S}%, ${L}%)`;
  const colLight = `hsl(${H}, ${Math.max(10, S - 15)}%, ${Math.min(95, L + 28)}%)`;
  const colDark = `hsl(${H}, ${Math.min(100, S + 10)}%, ${Math.max(14, L - 22)}%)`;
  const outlineColor = '#181e28';

  sCtx.save();

  // 3D Facets
  sCtx.fillStyle = colLight;
  sCtx.beginPath();
  sCtx.moveTo(cx - w / 2, baseY);
  sCtx.lineTo(tipX, tipY);
  sCtx.lineTo(cx, baseY);
  sCtx.closePath();
  sCtx.fill();

  sCtx.fillStyle = colDark;
  sCtx.beginPath();
  sCtx.moveTo(cx, baseY);
  sCtx.lineTo(tipX, tipY);
  sCtx.lineTo(cx + w / 2, baseY);
  sCtx.closePath();
  sCtx.fill();

  // Thin dark outline
  sCtx.strokeStyle = outlineColor;
  sCtx.lineWidth = 1.4;
  sCtx.lineJoin = 'round';
  sCtx.beginPath();
  sCtx.moveTo(cx - w / 2, baseY);
  sCtx.lineTo(tipX, tipY);
  sCtx.lineTo(cx + w / 2, baseY);
  sCtx.stroke();

  if (cfg.collarRing) {
    const crH = 3.5;
    const crY = isTop ? baseY : baseY - crH;
    sCtx.fillStyle = colBase;
    sCtx.fillRect(cx - (w + 4) / 2, crY, w + 4, crH);
    sCtx.fillStyle = 'rgba(255, 255, 255, 0.75)';
    sCtx.fillRect(cx - (w + 4) / 2, crY, w + 4, 1);
    sCtx.strokeStyle = outlineColor;
    sCtx.lineWidth = 1;
    sCtx.strokeRect(cx - (w + 4) / 2, crY, w + 4, crH);
  }

  sCtx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
  sCtx.lineWidth = 1.3;
  sCtx.beginPath();
  sCtx.moveTo(cx - w * 0.22, baseY + dir * 3);
  sCtx.lineTo(tipX - 1, tipY - dir * 2);
  sCtx.stroke();

  sCtx.fillStyle = '#ffffff';
  sCtx.beginPath();
  sCtx.arc(tipX, tipY - dir * 1.5, 1.3, 0, 6.28);
  sCtx.fill();

  sCtx.restore();
}

function drawFluffyClouds(pCtx, x, y, scale = 1, alpha = 0.85, tint = '#ffffff') {
  pCtx.save();
  pCtx.globalAlpha = alpha;
  pCtx.fillStyle = tint;
  const circles = [
    [0, 0, 26], [24, -8, 22], [48, 2, 24], [-22, 4, 18], [20, 8, 20]
  ];
  for (const [ox, oy, r] of circles) {
    pCtx.beginPath();
    pCtx.arc(x + ox * scale, y + oy * scale, r * scale, 0, Math.PI * 2);
    pCtx.fill();
  }
  pCtx.fillStyle = 'rgba(255, 255, 255, 0.6)';
  pCtx.beginPath();
  pCtx.ellipse(x + 12 * scale, y - 6 * scale, 34 * scale, 12 * scale, 0, 0, Math.PI * 2);
  pCtx.fill();
  pCtx.restore();
}

function prerenderSpikes(cfg) {
  const sizes = { small: 12, medium: 22, big: 36 };
  for (const sKey in sizes) {
    const h = sizes[sKey];
    for (const dir of ['top', 'bot']) {
      const key = `${sKey}_${dir}`;
      if (!spikeCanvases[key]) {
        spikeCanvases[key] = document.createElement('canvas');
        spikeCanvases[key].width = 36;
        spikeCanvases[key].height = 48;
      }
      renderSpikeToCanvas(spikeCanvases[key], dir === 'top', h, cfg);
    }
  }
}

function prerenderFallbackScene(cfg) {
  if (!fallbackBgCanvas) {
    fallbackBgCanvas = document.createElement('canvas');
    fallbackBgCanvas.width = W;
    fallbackBgCanvas.height = H;
  }
  const bgCtx = fallbackBgCanvas.getContext('2d');
  const grad = bgCtx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, cfg.bgTop);
  grad.addColorStop(1, cfg.bgBot);
  bgCtx.fillStyle = grad;
  bgCtx.fillRect(0, 0, W, H);

  // Soft sunlight highlight
  const sunGrad = bgCtx.createRadialGradient(W * 0.75, H * 0.15, 10, W * 0.75, H * 0.15, W * 0.6);
  sunGrad.addColorStop(0, 'rgba(255, 255, 255, 0.45)');
  sunGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
  bgCtx.fillStyle = sunGrad;
  bgCtx.fillRect(0, 0, W, H);
}

// ==========================================
// GLOSSY UI COMPONENTS (White text with dark outline)
// ==========================================
const BUTTON_THEMES = {
  green: { top: '#6ee7b7', mid: '#22c55e', bot: '#16a34a', lip: '#14532d', border: '#052e16' },
  blue: { top: '#93c5fd', mid: '#3b82f6', bot: '#2563eb', lip: '#1e3a8a', border: '#0f172a' },
  purple: { top: '#d8b4fe', mid: '#a855f7', bot: '#9333ea', lip: '#581c87', border: '#3b0764' },
  orange: { top: '#fed7aa', mid: '#f97316', bot: '#ea580c', lip: '#7c2d12', border: '#431407' },
  red: { top: '#fca5a5', mid: '#ef4444', bot: '#dc2626', lip: '#7f1d1d', border: '#450a0a' },
  gray: { top: '#e2e8f0', mid: '#94a3b8', bot: '#64748b', lip: '#334155', border: '#1e293b' }
};

function drawGlossyText(text, x, y, size, align = 'center', color = '#ffffff', strokeColor = '#0f172a', strokeWidth) {
  ctx.save();
  ctx.font = `800 ${size}px "Lilita One", "Baloo 2", cursive, system-ui, sans-serif`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';

  const sw = strokeWidth !== undefined ? strokeWidth : Math.max(3.5, Math.round(size * 0.18));
  ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
  ctx.shadowBlur = 4;
  ctx.shadowOffsetY = 2;

  ctx.strokeStyle = strokeColor;
  ctx.lineWidth = sw;
  ctx.lineJoin = 'round';
  ctx.miterLimit = 2;
  ctx.strokeText(text, x, y);

  ctx.shadowColor = 'transparent';
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawGlossyButton(x, y, w, h, theme, label, iconType, isPressed, radius = 18) {
  const py = isPressed ? y + 3 : y;
  const lipH = isPressed ? 2 : 5;

  ctx.save();
  ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
  ctx.shadowBlur = isPressed ? 4 : 8;
  ctx.shadowOffsetY = isPressed ? 2 : 5;

  ctx.fillStyle = theme.lip;
  roundRect(ctx, x, py + lipH, w, h, radius);
  ctx.fill();

  ctx.shadowColor = 'transparent';

  const grad = ctx.createLinearGradient(0, py, 0, py + h);
  grad.addColorStop(0, theme.top);
  grad.addColorStop(0.48, theme.mid);
  grad.addColorStop(1, theme.bot);
  ctx.fillStyle = grad;
  roundRect(ctx, x, py, w, h, radius);
  ctx.fill();

  // White gloss band on top half
  ctx.save();
  roundRect(ctx, x, py, w, h, radius);
  ctx.clip();
  const glossGrad = ctx.createLinearGradient(0, py, 0, py + h * 0.54);
  glossGrad.addColorStop(0, 'rgba(255, 255, 255, 0.65)');
  glossGrad.addColorStop(1, 'rgba(255, 255, 255, 0.05)');
  ctx.fillStyle = glossGrad;
  ctx.beginPath();
  ctx.ellipse(x + w / 2, py + 2, w * 0.6, h * 0.45, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Inner highlight outline
  ctx.save();
  roundRect(ctx, x + 1.5, py + 1.5, w - 3, h - 3, Math.max(2, radius - 1));
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
  ctx.lineWidth = 1.3;
  ctx.stroke();
  ctx.restore();

  // Dark outer outline
  ctx.strokeStyle = theme.border;
  ctx.lineWidth = 2.4;
  roundRect(ctx, x, py, w, h + (isPressed ? 1 : 2), radius);
  ctx.stroke();

  if (iconType) {
    drawButtonIcon(iconType, x + w / 2, py + h / 2, Math.min(w, h) * 0.48);
  }
  if (label) {
    const textY = py + h / 2 + 1;
    drawGlossyText(label, x + w / 2, textY, Math.min(22, Math.round(h * 0.42)), 'center', '#ffffff', theme.border, 4.2);
  }
  ctx.restore();
}

function drawRoundGlossyButton(cx, cy, r, theme, iconType, isPressed) {
  drawGlossyButton(cx - r, cy - r, r * 2, r * 2, theme, null, iconType, isPressed, r);
}

function drawButtonIcon(type, cx, cy, sz) {
  ctx.save();
  ctx.translate(cx, cy);

  if (type === 'gear') {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 2;
    for (let a = 0; a < 6; a++) {
      ctx.rotate(Math.PI / 3);
      ctx.fillRect(-sz * 0.16, -sz * 0.52, sz * 0.32, sz * 0.22);
      ctx.strokeRect(-sz * 0.16, -sz * 0.52, sz * 0.32, sz * 0.22);
    }
    ctx.beginPath(); ctx.arc(0, 0, sz * 0.38, 0, 6.28); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#2563eb';
    ctx.beginPath(); ctx.arc(0, 0, sz * 0.18, 0, 6.28); ctx.fill(); ctx.stroke();

  } else if (type === 'car') {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#3b0764';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-sz * 0.45, sz * 0.15);
    ctx.lineTo(-sz * 0.35, -sz * 0.1);
    ctx.lineTo(-sz * 0.1, -sz * 0.28);
    ctx.lineTo(sz * 0.2, -sz * 0.28);
    ctx.lineTo(sz * 0.4, -sz * 0.05);
    ctx.lineTo(sz * 0.45, sz * 0.15);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#0f172a';
    ctx.beginPath(); ctx.arc(-sz * 0.25, sz * 0.18, sz * 0.14, 0, 6.28); ctx.fill();
    ctx.beginPath(); ctx.arc(sz * 0.25, sz * 0.18, sz * 0.14, 0, 6.28); ctx.fill();

  } else if (type === 'close') {
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = sz * 0.22;
    ctx.lineCap = 'round';
    const s = sz * 0.32;
    ctx.beginPath();
    ctx.moveTo(-s, -s); ctx.lineTo(s, s);
    ctx.moveTo(s, -s); ctx.lineTo(-s, s);
    ctx.stroke();

  } else if (type === 'sound_on') {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#052e16';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-sz * 0.35, -sz * 0.15); ctx.lineTo(-sz * 0.15, -sz * 0.15); ctx.lineTo(sz * 0.1, -sz * 0.35);
    ctx.lineTo(sz * 0.1, sz * 0.35); ctx.lineTo(-sz * 0.15, sz * 0.15); ctx.lineTo(-sz * 0.35, sz * 0.15);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(sz * 0.05, 0, sz * 0.24, -0.6, 0.6); ctx.stroke();
    ctx.beginPath(); ctx.arc(sz * 0.05, 0, sz * 0.4, -0.7, 0.7); ctx.stroke();

  } else if (type === 'sound_off') {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-sz * 0.35, -sz * 0.15); ctx.lineTo(-sz * 0.15, -sz * 0.15); ctx.lineTo(sz * 0.1, -sz * 0.35);
    ctx.lineTo(sz * 0.1, sz * 0.35); ctx.lineTo(-sz * 0.15, sz * 0.15); ctx.lineTo(-sz * 0.35, sz * 0.15);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-sz * 0.35, -sz * 0.35); ctx.lineTo(sz * 0.35, sz * 0.35); ctx.stroke();

  } else if (type === 'vibrate_on') {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#052e16';
    ctx.lineWidth = 2;
    roundRect(ctx, -sz * 0.2, -sz * 0.35, sz * 0.4, sz * 0.7, 4);
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(-sz * 0.25, 0, sz * 0.25, Math.PI * 0.75, Math.PI * 1.25); ctx.stroke();
    ctx.beginPath(); ctx.arc(sz * 0.25, 0, sz * 0.25, -Math.PI * 0.25, Math.PI * 0.25); ctx.stroke();

  } else if (type === 'vibrate_off') {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 2;
    roundRect(ctx, -sz * 0.2, -sz * 0.35, sz * 0.4, sz * 0.7, 4);
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-sz * 0.35, -sz * 0.35); ctx.lineTo(sz * 0.35, sz * 0.35); ctx.stroke();
  }

  ctx.restore();
}

function drawGoldStar(cx, cy, r) {
  ctx.save();
  ctx.translate(cx, cy);

  ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
  ctx.shadowBlur = 4;
  ctx.shadowOffsetY = 2;

  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const ang = (i * Math.PI) / 5 - Math.PI / 2;
    const rad = i % 2 === 0 ? r : r * 0.48;
    const x = Math.cos(ang) * rad;
    const y = Math.sin(ang) * rad;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();

  const starGrad = ctx.createLinearGradient(0, -r, 0, r);
  starGrad.addColorStop(0, '#fef08a');
  starGrad.addColorStop(0.4, '#facc15');
  starGrad.addColorStop(1, '#ca8a04');
  ctx.fillStyle = starGrad;
  ctx.fill();

  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = '#713f12';
  ctx.lineWidth = 1.8;
  ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(-r * 0.2, -r * 0.25, r * 0.2, 0, 6.28);
  ctx.fill();

  ctx.restore();
}

function drawRibbonHeader(cx, cy, w, h, text, themeColor, starCount = 2) {
  ctx.save();
  const halfW = w / 2;
  const tailW = 24;

  ctx.fillStyle = themeColor.lip;
  ctx.beginPath();
  ctx.moveTo(cx - halfW, cy);
  ctx.lineTo(cx - halfW - tailW, cy + 10);
  ctx.lineTo(cx - halfW - tailW + 8, cy + h + 4);
  ctx.lineTo(cx - halfW, cy + h);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(cx + halfW, cy);
  ctx.lineTo(cx + halfW + tailW, cy + 10);
  ctx.lineTo(cx + halfW + tailW - 8, cy + h + 4);
  ctx.lineTo(cx + halfW, cy + h);
  ctx.closePath();
  ctx.fill();

  const rGrad = ctx.createLinearGradient(0, cy, 0, cy + h);
  rGrad.addColorStop(0, themeColor.top);
  rGrad.addColorStop(0.5, themeColor.mid);
  rGrad.addColorStop(1, themeColor.bot);
  ctx.fillStyle = rGrad;
  roundRect(ctx, cx - halfW, cy, w, h, 8);
  ctx.fill();

  ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
  ctx.fillRect(cx - halfW + 4, cy + 2, w - 8, h * 0.35);

  ctx.strokeStyle = themeColor.border;
  ctx.lineWidth = 2.4;
  roundRect(ctx, cx - halfW, cy, w, h, 8);
  ctx.stroke();

  drawGlossyText(text, cx, cy + h / 2 + 1, 22, 'center', '#ffffff', themeColor.border, 4.5);

  if (starCount >= 2) {
    drawGoldStar(cx - halfW + 18, cy + h / 2, 11);
    drawGoldStar(cx + halfW - 18, cy + h / 2, 11);
  }

  ctx.restore();
}

// Coin-Counter Pill with bold white text and dark outline
function drawCoinPill(x, y, w, h, val, isBest = false) {
  ctx.save();
  ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
  ctx.shadowBlur = 6;
  ctx.shadowOffsetY = 3;

  ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
  roundRect(ctx, x, y, w, h, h / 2);
  ctx.fill();

  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1.6;
  roundRect(ctx, x, y, w, h, h / 2);
  ctx.stroke();

  const coinR = h * 0.58;
  const coinX = x + h * 0.48;
  const coinY = y + h * 0.5;

  ctx.fillStyle = '#eab308';
  ctx.beginPath(); ctx.arc(coinX, coinY, coinR, 0, 6.28); ctx.fill();
  ctx.strokeStyle = '#713f12'; ctx.lineWidth = 1.5; ctx.stroke();
  drawGoldStar(coinX, coinY, coinR * 0.65);

  const label = isBest ? `BEST ${val}` : `${val}`;
  drawGlossyText(label, x + (w + coinR) / 2 + 2, y + h / 2 + 1, 15, 'center', '#ffffff', '#0f172a', 3.8);

  ctx.restore();
}

// ==========================================
// GAME STATE & ASSETS
// ==========================================
let st = 'loading';
let loadingTimer = 0, loadingFade = 0, loadingWheelRot = 0;
let visualLoadProgress = 0;
let loadDoneHoldTimer = 0;
let menuFadeTimer = 0;
let settingsOpen = false;
let toastMsg = null;
let toastTimer = 0;

let curLevel = 1;
let cam = 0, vy = 0, cy = CAR_REST_Y, hold = false, thrust = 0;
let segs = [], nextX = 0, lastC = H / 2, parts = [], deadAt = 0, last = 0;
let best = 0;
let wheelRot = 0;

let transitionTimer = 0;
let nextLevelTarget = 1;
const TITLE_CARD_DURATION = 1.75;

let stopping = false;
let stopTimer = 0;
let levelCompleteTimer = 0;
let confettis = [];
let activePress = null;

try { best = +localStorage.getItem('skycarBest') || 0; } catch(e) {}

function getDifficultyDistance() {
  const distInTunnel = Math.max(0, Math.min(LEVEL_LENGTH, (cam + CAR_X) - TUNNEL_START_X));
  return (curLevel - 1) * LEVEL_LENGTH + distInTunnel;
}

// Resolution-independent scroll speed relative to canvas width W (multiplied by SPEED_MULTIPLIER)
function scrollSpeed(difficultyDistance = getDifficultyDistance()) {
  const baseSpeed = W * Math.min(0.55, 0.30 + difficultyDistance / (W * 120));
  return baseSpeed * SPEED_MULTIPLIER;
}
const speed = scrollSpeed;

function getGapHeight(d) {
  const carH = CAR_HITBOX_H;
  const lvlProgress = Math.max(0, Math.min(1, d / (9 * LEVEL_LENGTH)));
  const factor = 3.8 - (3.8 - 2.6) * lvlProgress;
  return Math.max(2.6 * carH, factor * carH);
}

function showToast(msg) {
  toastMsg = msg;
  toastTimer = 1.6;
  playClickSound();
}

function pickClusterSize(d, levelRng) {
  const pBig = Math.min(0.45, 0.15 + d / 35000);
  const r = levelRng();
  if (r < pBig) return 'big';
  const pMed = 0.55;
  if (r < pBig + (1 - pBig) * pMed) return 'medium';
  return 'small';
}

function makeSpikes(len, d, top, bot, noSpikes = false, levelRng) {
  const count = Math.ceil(len / 12);
  const heights = { small: 12, medium: 22, big: 36 };
  function gen() {
    const list = [];
    let i = 0;
    while (i < count) {
      const cLen = Math.min(count - i, Math.floor(2 + levelRng() * 4));
      const size = pickClusterSize(d, levelRng);
      const h = noSpikes ? 0 : heights[size];
      for (let k = 0; k < cLen; k++) list.push({ h, size });
      i += cLen;
    }
    return list;
  }
  const topSpikes = gen();
  const botSpikes = gen();
  const maxSpikeSum = Math.max(0, (bot - top) - (CAR_HITBOX_H + 20));
  for (let i = 0; i < count; i++) {
    if (topSpikes[i].h + botSpikes[i].h > maxSpikeSum) {
      if (topSpikes[i].h >= botSpikes[i].h) {
        if (22 + botSpikes[i].h <= maxSpikeSum) { topSpikes[i].h = 22; topSpikes[i].size = 'medium'; }
        else { topSpikes[i].h = 12; topSpikes[i].size = 'small'; }
      } else {
        if (topSpikes[i].h + 22 <= maxSpikeSum) { botSpikes[i].h = 22; botSpikes[i].size = 'medium'; }
        else { botSpikes[i].h = 12; botSpikes[i].size = 'small'; }
      }
    }
  }
  return { topSpikes, botSpikes };
}

let levelPRNG = mulberry32(1);
let tunnelSegCount = 0;

function addSeg(isOpen = false, forceLen) {
  const segDistInTunnel = Math.max(0, Math.min(LEVEL_LENGTH, nextX - TUNNEL_START_X));
  const d = (curLevel - 1) * LEVEL_LENGTH + segDistInTunnel;

  const isTunnel = !isOpen && nextX >= TUNNEL_START_X && nextX < TUNNEL_END_X;
  const isExtraEasy = isTunnel && (tunnelSegCount < 3);
  if (isTunnel) tunnelSegCount++;

  const currentScrollSpeed = scrollSpeed(d);
  const normalGap = getGapHeight(d);
  const gap = isOpen ? 380 : (isExtraEasy ? 5 * CAR_HITBOX_H : normalGap);
  const normalLen = forceLen || Math.max(240, 320 - d / 120);
  let len = isExtraEasy ? Math.round(normalLen * 1.5) : normalLen;
  if (!isOpen && nextX + len > TUNNEL_END_X) {
    len = Math.max(60, TUNNEL_END_X - nextX);
  }

  // Vertical step between two neighboring segments never exceeds
  // 0.6 * MAX_UP_SPEED * (segmentLength / currentScrollSpeed) using final speeds
  const normalMaxShift = Math.min(0.5 * gap, 0.6 * MAX_UP_SPEED * (len / currentScrollSpeed));
  // First 3 tunnel segments vertical step at most 25% of normal step
  const maxShift = isOpen ? 15 : (isExtraEasy ? 0.25 * normalMaxShift : normalMaxShift);

  let c = isOpen ? (ROAD_TOP - 20) : (lastC + (levelPRNG() * 2 - 1) * maxShift);
  c = Math.max(gap / 2 + 50, Math.min(H - gap / 2 - 50, c));
  lastC = c;
  const top = isOpen ? -300 : (c - gap / 2);
  const bot = isOpen ? (H + 300) : (c + gap / 2);

  const noSpikes = isOpen;
  const { topSpikes, botSpikes } = makeSpikes(len, d, top, bot, noSpikes, levelPRNG);
  segs.push({ x: nextX, w: len, top, bot, topSpikes, botSpikes, isOpen });
  nextX += len;
}

function startLevel(lvl) {
  curLevel = lvl;
  cam = 0;
  vy = 0;
  thrust = 0;
  cy = CAR_REST_Y;
  lastC = ROAD_TOP - 20;
  parts = [];
  stopping = false;
  stopTimer = 0;
  levelCompleteTimer = 0;
  confettis = [];
  tunnelSegCount = 0;
  camSamples = [];
  realSpeedWPerSec = 0;
  realSpeedPxPerSec = 0;

  const cfg = getLevelConfig(lvl);
  prerenderSpikes(cfg);
  prerenderFallbackScene(cfg);

  levelPRNG = mulberry32(hashInt(lvl * 55555 + 12345));

  const initW = TUNNEL_START_X - START_ROAD_START;
  const { topSpikes, botSpikes } = makeSpikes(initW, (curLevel - 1) * LEVEL_LENGTH, -300, H + 300, true, levelPRNG);
  segs = [{ x: START_ROAD_START, w: initW, top: -300, bot: H + 300, topSpikes, botSpikes, isOpen: true }];
  nextX = TUNNEL_START_X;

  while (nextX < TUNNEL_END_X) {
    addSeg(false);
  }

  const postW = (FINISH_ROAD_END + 500) - TUNNEL_END_X;
  const endSpikes = makeSpikes(postW, curLevel * LEVEL_LENGTH, -300, H + 300, true, levelPRNG);
  segs.push({ x: TUNNEL_END_X, w: postW, top: -300, bot: H + 300, topSpikes: endSpikes.topSpikes, botSpikes: endSpikes.botSpikes, isOpen: true });
  nextX = TUNNEL_END_X + postW;
}

function resetGame() {
  curLevel = 1;
  cam = 0;
  startLevel(1);
}

function initConfetti() {
  confettis = [];
  const colors = ['#22c55e', '#facc15', '#38bdf8', '#f43f5e', '#a855f7', '#fb923c'];
  for (let i = 0; i < 75; i++) {
    confettis.push({
      x: rnd(10, W - 10),
      y: rnd(-80, H * 0.45),
      vx: rnd(-35, 35),
      vy: rnd(65, 160),
      size: rnd(4, 7),
      w: rnd(5, 9),
      rot: rnd(0, 6.28),
      vRot: rnd(-4, 4),
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }
}

function updateConfetti(dt) {
  for (const c of confettis) {
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    c.rot += c.vRot * dt;
    if (c.y > H + 20) {
      c.y = rnd(-20, -5);
      c.x = rnd(10, W - 10);
      c.vy = rnd(65, 160);
    }
  }
}

function drawConfetti() {
  for (const c of confettis) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.w / 2, -c.size / 2, c.w * Math.abs(Math.cos(c.rot)), c.size);
    ctx.restore();
  }
}

function die() {
  st = 'dead';
  deadAt = performance.now();
  hold = false;
  thrust = 0;
  playCrashSound();
  const tunnelDist = Math.max(0, Math.min(LEVEL_LENGTH, (cam + CAR_X) - TUNNEL_START_X));
  const progress = tunnelDist / LEVEL_LENGTH;
  const curScore = Math.floor(progress * 100);
  const currentTotal = 100 * (curLevel - 1) + curScore;
  if (currentTotal > best) {
    best = currentTotal;
    try { localStorage.setItem('skycarBest', best); } catch (e) {}
  }
}

// 3-layer cartoon road platform with red deck edge and soft shadow
function drawRoadPlatform(startX, endX, roadTop, isFinish = false) {
  const w = endX - startX;
  if (w <= 0) return;
  const x = startX - cam;
  if (x + w < -60 || x > W + 60) return;

  const bandH = 36; // 36 px tall asphalt band
  const roadCenterY = roadTop + bandH / 2; // middle: roadTop + 18
  const roadBottom = roadTop + bandH; // roadTop + 36
  const trussBottom = roadBottom + 20;

  ctx.save();
  // Soft drop shadow under platform
  ctx.shadowColor = 'rgba(15, 23, 42, 0.45)';
  ctx.shadowBlur = 10;
  ctx.shadowOffsetY = 4;

  ctx.beginPath();
  ctx.moveTo(x - 20, roadTop - 4);
  ctx.lineTo(x + w, roadTop - 4);
  ctx.lineTo(x + w - 12, trussBottom + 2);
  ctx.lineTo(x - 20, trussBottom + 2);
  ctx.closePath();
  ctx.clip();

  // 1. Asphalt Road Surface (frames car in the middle of the road, 36px tall band)
  ctx.fillStyle = '#26282c';
  ctx.fillRect(x, roadTop, w, bandH);

  // 2. Upper Red Deck Edge / Barrier (symmetrical border)
  ctx.fillStyle = '#dc2626';
  ctx.fillRect(x, roadTop - 2, w, 3);
  ctx.fillStyle = '#f87171';
  ctx.fillRect(x, roadTop - 2, w, 1);

  // 3. Yellow Dashed Center Lane Markings (runs right through middle of road at wheel-hub height)
  ctx.fillStyle = '#fde047';
  const startDash = Math.floor(startX / 48) * 48;
  for (let wx = startDash; wx < endX + 48; wx += 48) {
    const dx = wx - cam;
    ctx.fillRect(dx, roadCenterY - 1.5, 22, 3);
  }

  // 4. Lower Red Deck Edge (front edge of the road, below tires at roadBottom - 2 = roadTop + 34)
  ctx.fillStyle = '#dc2626';
  ctx.fillRect(x, roadBottom - 2, w, 4);
  ctx.fillStyle = '#f87171';
  ctx.fillRect(x, roadBottom - 2, w, 1.2);

  // 5. Steel Truss structure underneath (below tires)
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(x, roadBottom + 2, w, 18);

  ctx.strokeStyle = '#475569';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  const startTruss = Math.floor(startX / 40) * 40;
  for (let wx = startTruss; wx < endX + 40; wx += 40) {
    const p1 = wx - cam, p2 = wx + 40 - cam;
    ctx.moveTo(p1, roadBottom + 3); ctx.lineTo(p2, roadBottom + 19);
    ctx.moveTo(p2, roadBottom + 3); ctx.lineTo(p1, roadBottom + 19);
  }
  ctx.stroke();

  ctx.restore();

  if (isFinish) {
    ctx.save();
    const cfg = curConfig;
    const postPositions = [startX + 80, startX + 220, startX + 360, startX + 460];
    for (const wx of postPositions) {
      if (wx >= startX && wx <= endX) {
        const px = wx - cam;
        if (px > -30 && px < W + 30) {
          ctx.fillStyle = '#64748b';
          ctx.fillRect(px - 2, roadTop - 42, 4, 42);

          ctx.fillStyle = '#facc15';
          ctx.shadowColor = '#facc15';
          ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.arc(px, roadTop - 42, 4.5, 0, 6.28);
          ctx.fill();
          ctx.shadowBlur = 0;

          ctx.fillStyle = cfg.accentColor;
          ctx.beginPath();
          ctx.moveTo(px + 2, roadTop - 38);
          ctx.lineTo(px + 24, roadTop - 30);
          ctx.lineTo(px + 2, roadTop - 22);
          ctx.closePath();
          ctx.fill();
        }
      }
    }
    ctx.restore();
  }
}

function drawRailSegment(x, y, w, isCeiling, cfg) {
  ctx.save();
  // Soft shadow so rails stand out clearly against bright sky picture
  ctx.shadowColor = 'rgba(15, 23, 42, 0.45)';
  ctx.shadowBlur = 6;
  ctx.shadowOffsetY = isCeiling ? -2 : 3;

  const railGrad = ctx.createLinearGradient(0, y, 0, y + 10);
  railGrad.addColorStop(0, '#ffffff');
  railGrad.addColorStop(0.25, cfg.railColor || '#64748b');
  railGrad.addColorStop(0.8, cfg.railColor || '#64748b');
  railGrad.addColorStop(1, '#0f172a');
  ctx.fillStyle = railGrad;
  ctx.fillRect(x, y, w, 10);

  ctx.shadowColor = 'transparent';

  // Highlight and dark outlines
  ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
  ctx.fillRect(x, y, w, 1.5);
  ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
  ctx.fillRect(x, y + 8.5, w, 1.5);

  ctx.fillStyle = '#0f172a';
  ctx.fillRect(x - 1, y - 1, 3, 12);
  ctx.fillRect(x + w - 2, y - 1, 3, 12);

  const centerY = y + 5;
  const startRivet = Math.floor(x / 16) * 16;
  for (let rx = startRivet; rx <= x + w + 16; rx += 16) {
    if (rx < x + 3 || rx > x + w - 3) continue;
    ctx.fillStyle = '#0f172a';
    ctx.beginPath(); ctx.arc(rx, centerY, 2.2, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(rx - 0.6, centerY - 0.6, 1, 0, 6.28); ctx.fill();
  }
  ctx.restore();
}

function drawVerticalRailConnector(x, y1, y2, cfg) {
  const minY = Math.min(y1, y2);
  const maxY = Math.max(y1, y2) + 10;
  const h = maxY - minY;
  if (h <= 10) return;

  ctx.save();
  ctx.shadowColor = 'rgba(15, 23, 42, 0.45)';
  ctx.shadowBlur = 6;
  ctx.shadowOffsetX = 1;
  ctx.shadowOffsetY = 1;

  const railGrad = ctx.createLinearGradient(x - 5, 0, x + 5, 0);
  railGrad.addColorStop(0, '#ffffff');
  railGrad.addColorStop(0.25, cfg.railColor || '#64748b');
  railGrad.addColorStop(0.8, cfg.railColor || '#64748b');
  railGrad.addColorStop(1, '#0f172a');
  ctx.fillStyle = railGrad;
  ctx.fillRect(x - 5, minY, 10, h);

  ctx.shadowColor = 'transparent';

  // Highlight and dark outlines
  ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
  ctx.fillRect(x - 5, minY, 1.5, h);
  ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
  ctx.fillRect(x + 3.5, minY, 1.5, h);

  // End caps
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(x - 6, minY - 1, 12, 3);
  ctx.fillRect(x - 6, maxY - 2, 12, 3);

  // Rivets spaced every 16px along the vertical connector
  const centerX = x;
  const startRivetY = Math.floor(minY / 16) * 16;
  for (let ry = startRivetY; ry <= maxY + 16; ry += 16) {
    if (ry < minY + 4 || ry > maxY - 4) continue;
    ctx.fillStyle = '#0f172a';
    ctx.beginPath(); ctx.arc(centerX, ry, 2.2, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(centerX - 0.6, ry - 0.6, 1, 0, 6.28); ctx.fill();
  }
  ctx.restore();
}

function drawSpike(x, baseY, isTop, sp) {
  if (!sp || !sp.h || sp.h <= 0) return;
  const key = `${sp.size}_${isTop ? 'top' : 'bot'}`;

    if (isTop) {
      ctx.drawImage(spr, x + 6 - 18, baseY - 2);
    } else {
      ctx.drawImage(spr, x + 6 - 18, baseY - 46);
    }
    ctx.restore();
  }
}

// High-performance sports car wheel with realistic rubber tyre, stationary brake caliper & rotating chrome twin-spoke alloy rim
function drawSportsWheel(cx, cy, r, angle) {
  ctx.save();
  ctx.translate(cx, cy);

  // 1. Solid Tyre (Deep matte black rubber with realistic sidewall contour)
  ctx.fillStyle = '#0f1115';
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  // Tyre outer edge definition
  ctx.strokeStyle = '#090a0d';
  ctx.lineWidth = Math.max(1, r * 0.05);
  ctx.beginPath();
  ctx.arc(0, 0, r - ctx.lineWidth / 2, 0, Math.PI * 2);
  ctx.stroke();

  // Subtle tyre sidewall highlight band
  ctx.strokeStyle = '#262a33';
  ctx.lineWidth = Math.max(1, r * 0.08);
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.88, 0, Math.PI * 2);
  ctx.stroke();

  // Inner tyre bead line
  ctx.strokeStyle = '#090a0d';
  ctx.lineWidth = Math.max(0.8, r * 0.04);
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.77, 0, Math.PI * 2);
  ctx.stroke();

  // 2. Wheel Cavity / Rim Barrel (Dark interior background behind spokes)
  ctx.fillStyle = '#14161a';
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.73, 0, Math.PI * 2);
  ctx.fill();

  // 3. Stationary Brake Assembly (Realistic: Caliper and Rotor do NOT spin with wheel)
  // Brake disc rotor (brushed steel)
  ctx.fillStyle = '#64748b';
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.56, 0, Math.PI * 2);
  ctx.fill();

  // Brake rotor groove ring
  ctx.strokeStyle = '#475569';
  ctx.lineWidth = Math.max(0.6, r * 0.035);
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.44, 0, Math.PI * 2);
  ctx.stroke();

  // High-performance Red Sports Brake Caliper (stationary at top quadrant)
  ctx.save();
  ctx.rotate(-0.58);
  ctx.fillStyle = '#dc2626';
  ctx.beginPath();
  const calW = r * 0.22;
  const calH = r * 0.38;
  const calX = r * 0.36;
  const calY = -calH / 2;
  if (ctx.roundRect) {
    ctx.roundRect(calX, calY, calW, calH, r * 0.05);
  } else {
    ctx.rect(calX, calY, calW, calH);
  }
  ctx.fill();
  // Caliper highlight bolt
  ctx.fillStyle = '#f8fafc';
  ctx.beginPath();
  ctx.arc(calX + calW / 2, 0, Math.max(0.8, r * 0.035), 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 4. Rotating Alloy Rim Lip & Spokes
  ctx.save();
  ctx.rotate(angle);

  // Outer chrome rim lip
  ctx.strokeStyle = '#f1f5f9';
  ctx.lineWidth = Math.max(1.2, r * 0.065);
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.71, 0, Math.PI * 2);
  ctx.stroke();

  // Inner chrome bevel
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = Math.max(0.8, r * 0.03);
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.67, 0, Math.PI * 2);
  ctx.stroke();

  // 5 Twin-Spoke High Performance Alloy Wheels (10 blades)
  const numPairs = 5;
  const innerR = r * 0.19;
  const outerR = r * 0.67;
  const spokeWidth = Math.max(1.2, r * 0.055);
  const splitOffset = 0.13;

  ctx.lineWidth = spokeWidth;
  ctx.lineCap = 'round';

  for (let i = 0; i < numPairs; i++) {
    const baseAng = (i * Math.PI * 2) / numPairs;

    for (const sign of [-1, 1]) {
      const spkAng = baseAng + sign * splitOffset;
      const cosA = Math.cos(spkAng);
      const sinA = Math.sin(spkAng);

      // Shaded metallic side
      ctx.strokeStyle = '#64748b';
      ctx.beginPath();
      ctx.moveTo(cosA * innerR + sign * 0.4, sinA * innerR);
      ctx.lineTo(cosA * outerR + sign * 0.4, sinA * outerR);
      ctx.stroke();

      // Bright polished chrome face
      ctx.strokeStyle = '#f8fafc';
      ctx.beginPath();
      ctx.moveTo(cosA * innerR, sinA * innerR);
      ctx.lineTo(cosA * outerR, sinA * outerR);
      ctx.stroke();
    }
  }

  // 5. Central Wheel Hub & Lug Nuts
  // Chrome outer hub
  ctx.fillStyle = '#cbd5e1';
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.22, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#475569';
  ctx.lineWidth = Math.max(0.6, r * 0.03);
  ctx.stroke();

  // Center cap badge
  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.13, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#f8fafc';
  ctx.beginPath();
  ctx.arc(0, 0, Math.max(0.7, r * 0.04), 0, Math.PI * 2);
  ctx.fill();

  // 5 Chrome Lug Nuts
  ctx.fillStyle = '#f8fafc';
  for (let l = 0; l < 5; l++) {
    const lugAng = (l * Math.PI * 2) / 5 + 0.31;
    const lx = Math.cos(lugAng) * (r * 0.175);
    const ly = Math.sin(lugAng) * (r * 0.175);
    ctx.beginPath();
    ctx.arc(lx, ly, Math.max(0.6, r * 0.026), 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore(); // Restore wheel rotation
  ctx.restore(); // Restore wheel translation
}

function car(drawX = CAR_X) {
  const drawW = CAR_DRAW_W;
  const drawH = CAR_DRAW_H;

  // Soft dark ground shadow under the car tires
  ctx.save();
  ctx.fillStyle = 'rgba(15, 23, 42, 0.28)';
  ctx.beginPath();
  ctx.ellipse(drawX, cy + drawH / 2 - 2, drawW * 0.42, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Draw car with slight tilt with vertical speed
  ctx.save();
  ctx.translate(drawX, cy);
  const tilt = Math.max(-0.14, Math.min(0.14, vy / 400));
  ctx.rotate(tilt);

  if (trimmedCarCanvas) {
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;
    ctx.drawImage(trimmedCarCanvas, -drawW / 2, -drawH / 2, drawW, drawH);

    // Dynamic rotating sports wheels (perfectly aligned with sports car wheel arches)
    const rearX = -drawW / 2 + drawW * 0.1843;
    const frontX = -drawW / 2 + drawW * 0.8190;
    const wheelY = -drawH / 2 + drawH * 0.7026;
    const wheelR = drawH * 0.2908;

    drawSportsWheel(rearX, wheelY, wheelR, wheelRot);
    drawSportsWheel(frontX, wheelY, wheelR, wheelRot);
  } else {
    // Fallback to drawn car if image fails to load
    ctx.scale(CAR_SCALE, CAR_SCALE);
    renderCarBody(wheelRot);
  }
  ctx.restore();
}

// Background drawing: uses attached bright picture, seamless mirrored tiling, 15% parallax scroll
function drawBackground() {
  const pic = getLevelPicture(curLevel);

  if (pic && pic.seamlessCanvas) {
    // 1. Picture is bright and fully visible, with no dark overlay on top of it.
    // 2. Scaled to full canvas height (640), keeping aspect ratio.
    // 3. Scroll slowly from right to left behind the game at 15% of world scroll speed.
    // 4. Mirrored (flipped) copy next to it avoids visible seam when it loops.
    const unitW = pic.unitW;
    const scrollX = cam * 0.15;
    const relX = -((scrollX % unitW + unitW) % unitW);

    ctx.drawImage(pic.seamlessCanvas, relX, 0);
    if (relX + unitW < W) {
      ctx.drawImage(pic.seamlessCanvas, relX + unitW, 0);
    }
    if (relX > 0) {
      ctx.drawImage(pic.seamlessCanvas, relX - unitW, 0);
    }
  } else {
    // Graceful fallback to procedural scene if picture fails to load
    if (fallbackBgCanvas) {
      ctx.drawImage(fallbackBgCanvas, 0, 0);
    } else {
      ctx.fillStyle = '#48cae4';
      ctx.fillRect(0, 0, W, H);
    }
  }
}

// ==========================================
// GAME LOOP (STEP & DRAW)
// ==========================================
function step(dt) {
  const sp = speed();
  if (toastTimer > 0) {
    toastTimer -= dt;
    if (toastTimer <= 0) toastMsg = null;
  }

  if (st === 'loading') {
    loadingTimer += dt;
    loadingWheelRot += dt * 14;

    const MIN_LOAD_TIME = 2.5;
    const HARD_TIMEOUT = 6.0;

    // Smooth ease-out progress curve from 0 to 100% over at least 2.5s
    const animT = Math.min(1, loadingTimer / MIN_LOAD_TIME);
    const easeOutProgress = 1 - Math.pow(1 - animT, 2.4);

    const isAssetsLoaded = assetsReady || (loadingTimer >= HARD_TIMEOUT);

    if (isAssetsLoaded) {
      visualLoadProgress = Math.max(visualLoadProgress, easeOutProgress);
    } else {
      // If assets take longer than 2.5s, keep waiting while capping at 99%
      visualLoadProgress = Math.min(0.99, Math.max(visualLoadProgress, easeOutProgress));
    }

    // When progress reaches 100% and assets are ready (or hard timeout)
    if (visualLoadProgress >= 1 && isAssetsLoaded) {
      visualLoadProgress = 1;
      loadDoneHoldTimer += dt;
      // Show "100%" for 0.3 seconds, then fade out in 0.4 seconds
      if (loadDoneHoldTimer >= 0.3) {
        loadingFade += dt / 0.4;
        if (loadingFade >= 1) {
          st = 'ready';
          menuFadeTimer = 0;
        }
      }
    }
    return;
  }

  if (st === 'ready') {
    cy = CAR_REST_Y;
    vy = 0;
    thrust = 0;
    cam = 0;
    menuFadeTimer += dt;
  } else if (st === 'transition') {
    transitionTimer += dt;
    if (transitionTimer >= 0.25 && curLevel !== nextLevelTarget) {
      startLevel(nextLevelTarget);
      hold = false;
      thrust = 0;
    }
    if (transitionTimer >= 0.25) {
      cam += sp * dt;
      cy = CAR_REST_Y;
      vy = 0;
      thrust = 0;
      wheelRot += sp * dt * (0.16 / CAR_SCALE);
    }
    if (transitionTimer >= TITLE_CARD_DURATION) {
      st = 'play';
      hold = false;
    }
  } else if (st === 'play') {
    const wx = cam + CAR_X;

    if (wx >= FINISH_ROAD_X + 40 && !stopping) {
      stopping = true;
      stopTimer = 0;
      playWinSound();
    }

    let ease = 1;
    if (stopping) {
      stopTimer += dt;
      ease = Math.max(0, 1 - stopTimer / 1.5);
      if (stopTimer >= 1.5) {
        st = 'level_complete';
        stopping = false;
        hold = false;
        vy = 0;
        cy = CAR_REST_Y;
        levelCompleteTimer = 0;
        initConfetti();
      }
    }

    const effectiveSp = sp * ease;
    cam += effectiveSp * dt;

    if (SHOW_DEBUG) {
      updateRealSpeedMeasurement(performance.now() / 1000);
    }

    if (hold) {
      thrust = Math.min(1, thrust + dt / THRUST_RISE_TIME);
    } else {
      thrust = Math.max(0, thrust - dt / THRUST_FALL_TIME);
    }

    const vertAccel = -LIFT_ACCEL * thrust + GRAVITY * (1 - thrust);
    vy += vertAccel * dt;
    vy *= Math.exp(-AIR_DRAG * dt);
    vy = Math.max(-MAX_UP_SPEED, Math.min(MAX_DOWN_SPEED, vy));
    cy += vy * dt;

    const onStartPlatform = (wx >= START_ROAD_START && wx <= START_ROAD_END);
    const onFinishPlatform = (wx >= FINISH_ROAD_X && wx <= FINISH_ROAD_END);
    const onRoadPlatform = onStartPlatform || onFinishPlatform;

    if (onRoadPlatform) {
      if (!hold && cy >= CAR_REST_Y) {
        cy = CAR_REST_Y;
        vy = 0;
        thrust = 0;
      } else if (cy > CAR_REST_Y) {
        cy = CAR_REST_Y;
        if (vy > 0) vy = 0;
      }
    }

    if (cy < 16) { cy = 16; vy = 0; }
    if (cy > H - 16) { cy = H - 16; vy = 0; }

    if (effectiveSp > 0) {
      wheelRot += effectiveSp * dt * (0.16 / CAR_SCALE);
    }

    if ((hold || thrust > 0.05) && st === 'play') {
      const drawW = CAR_DRAW_W;
      const drawH = CAR_DRAW_H;
      const rearWheelOx = -drawW / 2 + drawW * 0.1843;
      const frontWheelOx = -drawW / 2 + drawW * 0.8190;
      const smokeY = cy + drawH / 2;

      for (const ox of [rearWheelOx, frontWheelOx]) {
        parts.push({
          x: CAR_X + ox,
          y: smokeY,
          vx: rnd(-3, 3) - effectiveSp * 0.15,
          vy: rnd(140, 230),
          l: 0,
          m: rnd(0.3, 0.45),
          size: rnd(4, 7) * (CAR_SCALE * 0.6)
        });
      }
    }

    if (nextX < cam + W + 400) addSeg(true, 400);
    while (segs.length && segs[0].x + segs[0].w < cam - 100) segs.shift();

    for (const s of segs) {
      if (wx + HITBOX_HALF_W > s.x && wx - HITBOX_HALF_W < s.x + s.w && !s.isOpen) {
        if (cy - HITBOX_TOP_OFFSET < s.top - 18 || cy + HITBOX_BOT_OFFSET > s.bot + 18) { die(); break; }
        let hit = false;
        const count = s.topSpikes.length;
        for (let i = 0; i < count; i++) {
          const spX = s.x + i * 12;
          if (wx + HITBOX_HALF_W > spX && wx - HITBOX_HALF_W < spX + 12) {
            const topTip = (s.top - 18) + s.topSpikes[i].h;
            const botTip = (s.bot + 18) - s.botSpikes[i].h;
            if ((cy - HITBOX_TOP_OFFSET) < topTip - 6 || (cy + HITBOX_BOT_OFFSET) > botTip + 6) {
              hit = true;
              break;
            }
          }
        }
        if (hit) { die(); break; }
      }
    }
  } else if (st === 'level_complete') {
    levelCompleteTimer += dt;
    cy = CAR_REST_Y;
    vy = 0;
    updateConfetti(dt);
  }

  for (const p of parts) { p.l += dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  parts = parts.filter(p => p.l < p.m);
}

function drawLoadingScreen() {
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#38bdf8');
  bgGrad.addColorStop(1, '#0284c7');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  drawFluffyClouds(ctx, 180, 160, 1.4, 0.85);

  const carCenterX = W / 2;
  const bounceY = Math.sin(loadingTimer * 4.5) * 5.5;
  const carCenterY = H * 0.38 + bounceY;

  // Car centered at about 60 percent of screen width
  const loadW = Math.round(W * 0.60);
  const loadH = trimmedCarCanvas
    ? Math.round(loadW * (trimmedCarCanvas.height / trimmedCarCanvas.width))
    : Math.round(loadW * 0.42);
  const carScale = (W * 0.60) / 72;

  const carReady = (trimmedCarCanvas != null);
  const useFallback = !carReady && (carImgFailed || loadingTimer >= 1.5);

  if (carReady || useFallback) {
    ctx.save();
    ctx.globalAlpha = 1;

    // Soft dark-blue shadow under the car
    ctx.save();
    const shadowW = loadW * 0.44;
    const shadowH = 7.5;
    const shadowY = carCenterY + loadH * 0.45;
    const shadowGrad = ctx.createRadialGradient(carCenterX, shadowY, 2, carCenterX, shadowY, shadowW);
    shadowGrad.addColorStop(0, 'rgba(15, 23, 62, 0.45)');
    shadowGrad.addColorStop(0.55, 'rgba(15, 23, 62, 0.2)');
    shadowGrad.addColorStop(1, 'rgba(15, 23, 62, 0)');
    ctx.fillStyle = shadowGrad;
    ctx.beginPath();
    ctx.ellipse(carCenterX, shadowY, shadowW, shadowH, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.translate(carCenterX, carCenterY);

    // Very soft warm yellow glow behind the car
    ctx.save();
    const glowR = loadW * 0.54;
    const glowGrad = ctx.createRadialGradient(0, 0, 5, 0, 0, glowR);
    glowGrad.addColorStop(0, 'rgba(253, 224, 71, 0.38)');
    glowGrad.addColorStop(0.5, 'rgba(250, 204, 21, 0.16)');
    glowGrad.addColorStop(1, 'rgba(250, 204, 21, 0)');
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.arc(0, 0, glowR, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Thin animated speed lines behind the car
    ctx.save();
    ctx.lineWidth = 1.6;
    ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      const lineY = -loadH * 0.22 + i * (loadH * 0.16);
      const phase = (loadingTimer * 3.2 + i * 1.6) % 1;
      const startX = -loadW * 0.42 - phase * 55;
      const len = 22 + (i % 3) * 14;
      const lineAlpha = (0.25 + 0.4 * Math.sin(phase * Math.PI)).toFixed(2);
      const lineGrad = ctx.createLinearGradient(startX - len, 0, startX, 0);
      lineGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
      lineGrad.addColorStop(1, `rgba(255, 255, 255, ${lineAlpha})`);
      ctx.strokeStyle = lineGrad;
      ctx.beginPath();
      ctx.moveTo(startX - len, lineY);
      ctx.lineTo(startX, lineY);
      ctx.stroke();
    }
    ctx.restore();

    // Yellow sports car image
    if (trimmedCarCanvas) {
      ctx.shadowColor = 'rgba(15, 23, 62, 0.35)';
      ctx.shadowBlur = 8;
      ctx.shadowOffsetY = 2;
      ctx.drawImage(trimmedCarCanvas, -loadW / 2, -loadH / 2, loadW, loadH);

      // Rotating sports wheels on loading screen
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;

      const loadRearX = -loadW / 2 + loadW * 0.1843;
      const loadFrontX = -loadW / 2 + loadW * 0.8190;
      const loadWheelY = -loadH / 2 + loadH * 0.7026;
      const loadWheelR = loadH * 0.2908;

      drawSportsWheel(loadRearX, loadWheelY, loadWheelR, loadingWheelRot);
      drawSportsWheel(loadFrontX, loadWheelY, loadWheelR, loadingWheelRot);
    } else {
      ctx.scale(carScale, carScale);
      renderCarBody(loadingWheelRot);
    }

    ctx.restore();
  }

  // Game name under the car
  const titleY = carCenterY + loadH / 2 + 50;
  drawGlossyText('THORN RUSH', W / 2, titleY, 44, 'center', '#ffffff', '#0f172a', 7);

  // Loading bar and "Loading..." at the bottom
  const barW = W * 0.70;
  const barH = 18;
  const barX = W / 2 - barW / 2;
  const barY = H * 0.74;

  const pct = Math.min(100, Math.floor(visualLoadProgress * 100));
  drawGlossyText(`Loading... ${pct}%`, W / 2, barY - 14, 16, 'center', '#ffffff', '#0f172a', 4);

  // Background track
  ctx.fillStyle = 'rgba(15, 23, 42, 0.55)';
  roundRect(ctx, barX, barY, barW, barH, barH / 2);
  ctx.fill();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  roundRect(ctx, barX, barY, barW, barH, barH / 2);
  ctx.stroke();

  // Progress follows real loading progress with car matching yellow-to-orange gradient
  const fillW = Math.max(barH, barW * visualLoadProgress);
  const fillGrad = ctx.createLinearGradient(0, barY, 0, barY + barH);
  fillGrad.addColorStop(0, '#fef08a');
  fillGrad.addColorStop(0.45, '#facc15');
  fillGrad.addColorStop(1, '#ea580c');
  ctx.fillStyle = fillGrad;
  roundRect(ctx, barX, barY, fillW, barH, barH / 2);
  ctx.fill();

  // Glossy highlight on loading bar
  ctx.save();
  ctx.beginPath();
  roundRect(ctx, barX, barY, fillW, barH, barH / 2);
  ctx.clip();
  const glossGrad = ctx.createLinearGradient(0, barY, 0, barY + barH * 0.55);
  glossGrad.addColorStop(0, 'rgba(255, 255, 255, 0.75)');
  glossGrad.addColorStop(1, 'rgba(255, 255, 255, 0.12)');
  ctx.fillStyle = glossGrad;
  ctx.fillRect(barX, barY, fillW, barH * 0.5);
  ctx.restore();
}

// ==========================================
// REAL CAMERA SPEED MEASUREMENT & DEBUG OVERLAY
// ==========================================
let camSamples = [];
let realSpeedWPerSec = 0;
let realSpeedPxPerSec = 0;

function updateRealSpeedMeasurement(nowSec) {
  camSamples.push({ t: nowSec, cam: cam });
  while (camSamples.length > 2 && camSamples[0].t < nowSec - 1.0) {
    camSamples.shift();
  }
  if (camSamples.length >= 2) {
    const oldest = camSamples[0];
    const newest = camSamples[camSamples.length - 1];
    const dtWindow = newest.t - oldest.t;
    if (dtWindow >= 0.08) {
      const dCam = newest.cam - oldest.cam;
      realSpeedPxPerSec = Math.max(0, dCam / dtWindow);
      realSpeedWPerSec = realSpeedPxPerSec / W;
    }
  }
}

function drawDebugOverlay() {
  if (!SHOW_DEBUG || st !== 'play') return;
  ctx.save();

  const maxUpStr = `MAX_UP_SPEED: ${Math.round(MAX_UP_SPEED)} px/s`;

}

function drawGameContent() {
  const cfg = curConfig;

  // 1. Picture background (or fallback procedural)
  drawBackground();

  // 2. Starting Road Platform
  drawRoadPlatform(START_ROAD_START, START_ROAD_END, ROAD_TOP);

  // 3. Finish Road Platform
  drawRoadPlatform(FINISH_ROAD_X, FINISH_ROAD_END, ROAD_TOP, true);

  // 4. Spikes & Studded Rails with continuous connected rail pieces
  for (let i = 0; i < segs.length; i++) {
    const s = segs[i];
    const x = s.x - cam;
    if (!s.isOpen) drawWall(s, x);

    // Connected Rails between neighboring segments (visual only, no collision)
    if (i < segs.length - 1) {
      const sNext = segs[i + 1];
      if (!s.isOpen && !sNext.isOpen) {
        const seamX = (s.x + s.w) - cam;
        if (Math.abs(s.top - sNext.top) > 1) {
          drawVerticalRailConnector(seamX, s.top - 28, sNext.top - 28, cfg);
        }
        if (Math.abs(s.bot - sNext.bot) > 1) {
          drawVerticalRailConnector(seamX, s.bot + 18, sNext.bot + 18, cfg);
        }
      }
    }

    if (s.topSpikes) {
      const count = s.topSpikes.length;
      for (let j = 0; j < count; j++) {
        drawSpike(x + j * 12, s.top - 18, true, s.topSpikes[j]);
      }
    }
    if (s.botSpikes) {
      const count = s.botSpikes.length;
      for (let j = 0; j < count; j++) {
        drawSpike(x + j * 12, s.bot + 18, false, s.botSpikes[j]);
      }
    }
  }

  // 5. Sky Car (thin dark outline + soft shadow)
  if (st === 'ready') {
    const menuAlpha = Math.min(1, menuFadeTimer / 0.3);
    ctx.save();
    ctx.globalAlpha = menuAlpha;
    car(CAR_X);
    ctx.restore();
  } else {
    car(CAR_X);
  }

  // 6. Wheel thruster smoke
  for (const p of parts) {
    const k = 1 - p.l / p.m;
    ctx.globalAlpha = 0.7 * k;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (1 + 0.3 * (1 - k)), 0, 6.28);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 7. UI and Screens (all HUD text in white with dark outline)
  if (st === 'play') {
    drawHUD();
    if (SHOW_DEBUG) {
      drawDebugOverlay();
    }

  } else if (st === 'transition') {
    drawHUD();
    let cardAlpha = 1;
    if (transitionTimer < 0.4) cardAlpha = transitionTimer / 0.4;
    else if (transitionTimer > 1.4) cardAlpha = Math.max(0, 1 - (transitionTimer - 1.4) / 0.35);

    ctx.save();
    ctx.globalAlpha = cardAlpha;
    drawRibbonHeader(W / 2, 210 + topInset * 0.5, 270, 48, `LEVEL ${curLevel}: ${cfg.name.toUpperCase()}`, BUTTON_THEMES.blue, 2);
    ctx.restore();

  } else if (st === 'ready') {
    const menuAlpha = Math.min(1, menuFadeTimer / 0.3);
    ctx.save();
    ctx.globalAlpha = menuAlpha;

    // Top Right: Coin-counter pill with gold star coin and best score (moved down by topInset)
    drawCoinPill(W - 120, 24 + topInset, 106, 34, best, true);

    // Title Logo
    drawGlossyText('THORN RUSH', W / 2, 120 + topInset * 0.6, 46, 'center', '#ffffff', '#0f172a', 8);
    drawGlossyText(`${cfg.name.toUpperCase()}`, W / 2, 165 + topInset * 0.6, 18, 'center', '#ffffff', '#0f172a', 4.5);

    // Bottom Row: moved up by botInset
    const btnY = H - 70 - botInset;
    const playY = H - 98 - botInset;

    const isSetPressed = (activePress === 'open_settings');
    drawRoundGlossyButton(52, btnY, 26, BUTTON_THEMES.blue, 'gear', isSetPressed);

    const isLevelPressed = (activePress === 'start_level');
    drawGlossyButton(96, playY, 168, 56, BUTTON_THEMES.green, `LEVEL ${curLevel}`, null, isLevelPressed, 28);

    const isCarPressed = (activePress === 'car_garage');
    drawRoundGlossyButton(308, btnY, 26, BUTTON_THEMES.purple, 'car', isCarPressed);

    ctx.restore();

  } else if (st === 'level_complete') {
    drawLevelCompletePopup();

  } else if (st === 'dead') {

  if (settingsOpen) {

  }

  if (toastMsg && toastTimer > 0) {
    ctx.save();
    const tw = 180, th = 38;
    ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 4;
    ctx.fillStyle = '#1e1b4b';
    roundRect(ctx, W / 2 - tw / 2, 230, tw, th, 19);
    ctx.fill();
    ctx.strokeStyle = '#c084fc';
    ctx.lineWidth = 2;
    roundRect(ctx, W / 2 - tw / 2, 230, tw, th, 19);
    ctx.stroke();
    drawGlossyText(toastMsg, W / 2, 249, 16, 'center', '#ffffff', '#3b0764', 3.8);
    ctx.restore();
  }
}

function draw() {
  ctx.save();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  if (st === 'loading') {
    const loadingAlpha = Math.max(0, 1 - loadingFade);
    if (loadingAlpha > 0) {
      ctx.save();
      ctx.globalAlpha = loadingAlpha;
      drawLoadingScreen();
      ctx.restore();
    }
    ctx.restore();
    return;
  }

  drawGameContent();
  ctx.restore();
}

function loop(t) {
  if (!last) last = t;
  const rawDt = (t - last) / 1000;
  last = t;
  const dt = Math.max(0.001, Math.min(0.1, rawDt || 0.016));
  step(dt);
  draw();
  requestAnimationFrame(loop);
}

// ==========================================
// TOUCH & POINTER CONTROLS
// ==========================================
function getCanvasCoords(e) {
  const rect = cv.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY
  };
}

function inBox(px, py, x, y, w, h) {
  return px >= x && px <= x + w && py >= y && py <= y + h;
}

function inCircle(px, py, cx, cy, r) {
  const dx = px - cx, dy = py - cy;
  return dx * dx + dy * dy <= r * r;
}

function handlePointerDown(e) {
  initAudio();
  const { x, y } = getCanvasCoords(e);

  if (st === 'loading') return;

  if (settingsOpen) {
    const cw = 290, ch = 280;
    const cx = W / 2 - cw / 2, cy = H / 2 - ch / 2 - 10;

    if (inCircle(x, y, cx + cw - 12, cy + 12, 24)) {
      activePress = 'close_settings';
      return;
    }
    const soundBtnX = cx + 28, soundBtnY = cy + 65, btnSz = 105;
    if (inBox(x, y, soundBtnX, soundBtnY, btnSz, btnSz)) {
      activePress = 'toggle_sound';
      return;
    }
    const vibBtnX = cx + cw - 28 - btnSz, vibBtnY = cy + 65;
    if (inBox(x, y, vibBtnX, vibBtnY, btnSz, btnSz)) {
      activePress = 'toggle_vibrate';
      return;
    }
    if (!inBox(x, y, cx, cy, cw, ch)) {
      settingsOpen = false;
      playClickSound();
    }
    return;
  }

  if (st === 'ready') {
    const btnY = H - 70 - botInset;
    if (inCircle(x, y, 52, btnY, 32)) {
      activePress = 'open_settings';
      return;
    }
    if (inCircle(x, y, 308, btnY, 32)) {
      activePress = 'car_garage';
      return;
    }
    st = 'play';
    hold = true;
    activePress = 'start_level';
    playClickSound();
    return;
  }

  if (st === 'level_complete') {
    const cw = 290, ch = 270;
    const cx = W / 2 - cw / 2, cy = H / 2 - ch / 2 - 20;

    if (inCircle(x, y, cx + cw - 12, cy + 12, 24)) {
      activePress = 'close_complete';
      return;
    }
    const btnW = 210, btnH = 54;
    if (inBox(x, y, W / 2 - btnW / 2, cy + ch - 72, btnW, btnH)) {
      activePress = 'next_level';
      return;
    }
    if (levelCompleteTimer >= 0.8) {
      activePress = 'next_level';
    }
    return;
  }

  if (st === 'dead') {
    const cw = 290, ch = 270;
    const cx = W / 2 - cw / 2, cy = H / 2 - ch / 2 - 20;

    if (inCircle(x, y, cx + cw - 12, cy + 12, 24)) {
      activePress = 'close_dead';
      return;
    }
    const btnW = 210, btnH = 54;
    if (inBox(x, y, W / 2 - btnW / 2, cy + ch - 72, btnW, btnH)) {
      activePress = 'try_again';
      return;
    }
    if (performance.now() - deadAt >= 350) {
      activePress = 'try_again';
    }
    return;
  }

  if (st === 'play') {
    hold = true;
  }
}

function handlePointerUp(e) {
  hold = false;

  if (activePress) {
    playClickSound();

    if (activePress === 'close_settings') {
      settingsOpen = false;
    } else if (activePress === 'toggle_sound') {
      setSound(!soundEnabled);
      triggerVibrate(30);
    } else if (activePress === 'toggle_vibrate') {
      setVibrate(!vibrateEnabled);
      if (vibrateEnabled) triggerVibrate(40);
    } else if (activePress === 'open_settings') {
      settingsOpen = true;
    } else if (activePress === 'start_level') {
      // Game already started on pointerdown
    } else if (activePress === 'car_garage') {
      showToast('Coming soon');
    } else if (activePress === 'next_level') {
      nextLevelTarget = curLevel + 1;
      st = 'transition';
      transitionTimer = 0;
      hold = false;
    } else if (activePress === 'close_complete') {
      st = 'ready';
      hold = false;
    } else if (activePress === 'try_again') {
      if (RETRY_FROM_LEVEL_START) startLevel(curLevel);
      else startLevel(1);
      st = 'ready';
      hold = false;
    } else if (activePress === 'close_dead') {
      st = 'ready';
      hold = false;
    }

    activePress = null;
  }
}

cv.addEventListener('pointerdown', e => { e.preventDefault(); handlePointerDown(e); });
window.addEventListener('pointerup', e => { e.preventDefault(); handlePointerUp(e); });
window.addEventListener('pointercancel', () => { hold = false; activePress = null; });
window.addEventListener('blur', () => { hold = false; activePress = null; });
document.addEventListener('visibilitychange', () => { hold = false; activePress = null; });

window.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (!e.repeat) {
      if (st === 'ready') { st = 'play'; hold = true; }
      else if (st === 'play') { hold = true; }
      else if (st === 'dead' && performance.now() - deadAt > 350) { startLevel(curLevel); st = 'ready'; }
      else if (st === 'level_complete' && levelCompleteTimer >= 0.8) {
        nextLevelTarget = curLevel + 1; st = 'transition'; transitionTimer = 0;
      }
    }
  }
});
window.addEventListener('keyup', e => {
  if (e.code === 'Space') { hold = false; }
});
window.addEventListener('resize', () => {
  resizeCanvas();
  if (curConfig) {
    prerenderSpikes(curConfig);
    prerenderFallbackScene(curConfig);
    preloadedPictures.forEach(pic => {
      if (pic.loaded) updatePictureSeamlessCanvas(pic);
    });
  }
});

resetGame();
step(0);
draw();
requestAnimationFrame(loop);
})();
</script>
</body>
