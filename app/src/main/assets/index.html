function updateSafeInsets() {
  try {
    const div = document.createElement('div');
    div.style.cssText = 'position:fixed;top:0;left:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden;pointer-events:none;';
    document.body.appendChild(div);
    const cs = window.getComputedStyle(div);
    const pt = parseFloat(cs.paddingTop) || 0;
    const pb = parseFloat(cs.paddingBottom) || 0;
    document.body.removeChild(div);

    const rect = cv.getBoundingClientRect();
    const scale = H / (rect.height || window.innerHeight || 1);
    topInset = Math.max(34, Math.round(pt * scale));
    botInset = Math.round(pb * scale);
  } catch (e) {
    topInset = 34;
    botInset = 0;
  }
}

// Deterministic PRNG
function hashInt(n) {
  n = ((n >> 16) ^ n) * 0x45d9f3b;
  n = ((n >> 16) ^ n) * 0x45d9f3b;
  n = (n >> 16) ^ n;
  return n >>> 0;
}

function mulberry32(a) {
  return function() {
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function loadImageWithTimeout(url, timeoutMs = 4500) {
  return new Promise((resolve, reject) => {
    try {
      const img = new Image();
      let settled = false;

      const timer = setTimeout(() => {
        if (!settled) {
          settled = true;
          reject(new Error(`Timeout loading ${url}`));
        }
      }, timeoutMs);

      img.onload = () => {
        if (!settled) {
          settled = true;
          clearTimeout(timer);
          resolve(img);
        }
      };

      img.onerror = (err) => {
        if (!settled) {
          settled = true;
          clearTimeout(timer);
          reject(err || new Error(`Failed to load ${url}`));
        }
      };

      img.src = url;

      if (img.complete && img.naturalWidth > 0 && !settled) {
        settled = true;
        clearTimeout(timer);
        resolve(img);
      }
    } catch (err) {
      reject(err);
    }
  });
}

function processCarImage(img) {
  try {
    const origW = img.naturalWidth || img.width;
    const origH = img.naturalHeight || img.height;

    const offCanv = document.createElement('canvas');
    offCanv.width = origW;
    offCanv.height = origH;
    const offCtx = offCanv.getContext('2d');
    offCtx.drawImage(img, 0, 0);

    const imgData = offCtx.getImageData(0, 0, origW, origH);
    const d = imgData.data;

    // Green Chroma Key with smooth edge blending & despill:
    // Do not remove any yellow pixels of the car body.
    // Only remove pixels where green is clearly higher than both red and blue.
    const threshLow = 30;
    const threshHigh = 65;

    for (let i = 0; i < d.length; i += 4) {
      const r = d[i];
      const g = d[i + 1];
      const b = d[i + 2];
      const maxRB = Math.max(r, b);
      const diff = g - maxRB;

      if (diff >= threshHigh) {
        // Pure green background -> fully transparent
        d[i + 3] = 0;
      } else if (diff > threshLow) {
        // Soft edge blending
        const factor = (diff - threshLow) / (threshHigh - threshLow);
        d[i + 3] = Math.round(255 * (1 - factor));
        // Despill green fringe at boundary
        d[i + 1] = maxRB;
      } else {
        // Never remove or alter yellow body pixels (where r is high).
        // Only despill dark/neutral edges if green is slightly above red & blue:
        if (diff > 12 && r < 120) {
          d[i + 1] = maxRB;
        }
      }
    }

    offCtx.putImageData(imgData, 0, 0);

    // Auto-trim empty transparent space so tires sit at exact bottom edge
    let minX = origW, maxX = 0, minY = origH, maxY = 0;
    for (let y = 0; y < origH; y++) {
      for (let x = 0; x < origW; x++) {
        const a = d[(y * origW + x) * 4 + 3];
        if (a > 20) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }

    if (minX <= maxX && minY <= maxY) {
      const trimW = maxX - minX + 1;
      const trimH = maxY - minY + 1;

      const tCanv = document.createElement('canvas');
      tCanv.width = trimW;
      tCanv.height = trimH;
      const tCtx = tCanv.getContext('2d');
      tCtx.drawImage(offCanv, minX, minY, trimW, trimH, 0, 0, trimW, trimH);

      CAR_DRAW_H = Math.round(CAR_DRAW_W * (trimH / trimW));

  } catch (err) {
    console.warn('Failed to process car image:', err);
    if (!loadingErrorMsg) loadingErrorMsg = 'ChromaKey: ' + (err.message || String(err));
  }
}

function createCustomAlloyRim(size = 256, styleKey = currentRimStyle) {
  const cfg = RIM_STYLE_CONFIGS[styleKey] || RIM_STYLE_CONFIGS.silver_sport;
  const canv = document.createElement('canvas');
  canv.width = size;
  canv.height = size;
  const c = canv.getContext('2d');
  if (!c) return null;

  const cx = size / 2;
  const cy = size / 2;
  const R = size * 0.48;

  c.clearRect(0, 0, size, size);

  c.save();
  c.beginPath();
  c.arc(cx, cy, R, 0, Math.PI * 2);
  c.clip();

  // Dark Wheel Barrel
  c.fillStyle = cfg.barrel;
  c.fillRect(0, 0, size, size);

  // Vented Brake Rotor background disc
  const rotorR = R * 0.88;
  const rotorGrad = c.createRadialGradient(cx, cy, R * 0.15, cx, cy, rotorR);
  rotorGrad.addColorStop(0, '#2b3442');
  rotorGrad.addColorStop(0.7, '#1f2733');
  rotorGrad.addColorStop(1, '#151b24');
  c.fillStyle = rotorGrad;
  c.beginPath();
  c.arc(cx, cy, rotorR, 0, Math.PI * 2);
  c.fill();

  // Rotor surface concentric machining grooves
  c.strokeStyle = 'rgba(255, 255, 255, 0.06)';
  c.lineWidth = 1.2;
  for (let rG = R * 0.35; rG <= rotorR - 4; rG += 7) {
    c.beginPath();
    c.arc(cx, cy, rG, 0, Math.PI * 2);
    c.stroke();
  }

  // Cross-drilled rotor holes (sporty brake vent holes)
  c.fillStyle = '#0b0f17';
  for (let a = 0; a < Math.PI * 2; a += Math.PI / 8) {
    for (let rD = R * 0.42; rD <= rotorR - 8; rD += 12) {
      const hx = cx + Math.cos(a + rD * 0.015) * rD;
      const hy = cy + Math.sin(a + rD * 0.015) * rD;
      c.beginPath();
      c.arc(hx, hy, 1.8, 0, Math.PI * 2);
      c.fill();
    }
  }

  // 5-Spoke Twin-Beam High Performance Forged Alloy
  const spokes = 5;
  const spokeStep = (Math.PI * 2) / spokes;
  const hubR = R * 0.28;
  const rimInnerR = R * 0.86;

  for (let i = 0; i < spokes; i++) {
    const angle = i * spokeStep;

    c.save();
    c.translate(cx, cy);
    c.rotate(angle);

    // Drop shadow under each spoke onto rotor
    c.fillStyle = 'rgba(0, 0, 0, 0.45)';
    c.beginPath();
    c.moveTo(-R * 0.14, hubR * 0.8 + 2);
    c.lineTo(-R * 0.18, rimInnerR + 2);
    c.lineTo(R * 0.18, rimInnerR + 2);
    c.lineTo(R * 0.14, hubR * 0.8 + 2);
    c.closePath();
    c.fill();

    // Twin-Spoke Left Beam
    c.fillStyle = cfg.spokeDark;
    c.beginPath();
    c.moveTo(-R * 0.15, hubR);
    c.lineTo(-R * 0.20, rimInnerR);
    c.lineTo(-R * 0.12, rimInnerR);
    c.lineTo(-R * 0.07, hubR);
    c.closePath();
    c.fill();

    c.fillStyle = cfg.spokeFace;
    c.beginPath();
    c.moveTo(-R * 0.13, hubR + 1);
    c.lineTo(-R * 0.18, rimInnerR - 1);
    c.lineTo(-R * 0.11, rimInnerR - 1);
    c.lineTo(-R * 0.06, hubR + 1);
    c.closePath();
    c.fill();

    c.strokeStyle = cfg.spokeLight;
    c.lineWidth = 1.6;
    c.beginPath();
    c.moveTo(-R * 0.18, rimInnerR - 1);
    c.lineTo(-R * 0.13, hubR + 1);
    c.stroke();

    // Twin-Spoke Right Beam
    c.fillStyle = cfg.spokeDark;
    c.beginPath();
    c.moveTo(R * 0.07, hubR);
    c.lineTo(R * 0.12, rimInnerR);
    c.lineTo(R * 0.20, rimInnerR);
    c.lineTo(R * 0.15, hubR);
    c.closePath();
    c.fill();

    c.fillStyle = cfg.spokeFace;
    c.beginPath();
    c.moveTo(R * 0.06, hubR + 1);
    c.lineTo(R * 0.11, rimInnerR - 1);
    c.lineTo(R * 0.18, rimInnerR - 1);
    c.lineTo(R * 0.13, hubR + 1);
    c.closePath();
    c.fill();

    c.strokeStyle = cfg.spokeLight;
    c.lineWidth = 1.6;
    c.beginPath();
    c.moveTo(R * 0.11, rimInnerR - 1);
    c.lineTo(R * 0.06, hubR + 1);
    c.stroke();

    // Spoke-to-rim mounting joint
    c.fillStyle = cfg.spokeFace;
    c.beginPath();
    c.arc(0, rimInnerR, R * 0.18, Math.PI * 0.85, Math.PI * 0.15, true);
    c.fill();

    c.restore();
  }

  // Polished Chrome Outer Lip & Rim Flange
  c.strokeStyle = 'rgba(0, 0, 0, 0.4)';
  c.lineWidth = 3;
  c.beginPath();
  c.arc(cx, cy, rimInnerR, 0, Math.PI * 2);
  c.stroke();

  const lipGrad = c.createLinearGradient(0, cy - R, size, cy + R);
  lipGrad.addColorStop(0.0, cfg.lipOuter);
  lipGrad.addColorStop(0.25, cfg.lipInner);
  lipGrad.addColorStop(0.5, cfg.lipOuter);
  lipGrad.addColorStop(0.75, cfg.lipInner);
  lipGrad.addColorStop(1.0, cfg.lipOuter);

  c.strokeStyle = lipGrad;
  c.lineWidth = R * 0.11;
  c.beginPath();
  c.arc(cx, cy, R * 0.94, 0, Math.PI * 2);
  c.stroke();

  c.strokeStyle = cfg.spokeLight;
  c.lineWidth = 1.5;
  c.beginPath();
  c.arc(cx, cy, R - 1, 0, Math.PI * 2);
  c.stroke();

  c.strokeStyle = cfg.spokeDark;
  c.lineWidth = 1.5;
  c.beginPath();
  c.arc(cx, cy, R * 0.88, 0, Math.PI * 2);
  c.stroke();

  // Center Hub Plate & Chrome Lug Nuts
  const hubGrad = c.createRadialGradient(cx, cy, 2, cx, cy, hubR);
  hubGrad.addColorStop(0, cfg.spokeFace);
  hubGrad.addColorStop(0.6, cfg.spokeDark);
  hubGrad.addColorStop(1, '#0f172a');
  c.fillStyle = hubGrad;
  c.beginPath();
  c.arc(cx, cy, hubR, 0, Math.PI * 2);
  c.fill();

  c.strokeStyle = cfg.hubRing;
  c.lineWidth = 2.2;
  c.beginPath();
  c.arc(cx, cy, hubR, 0, Math.PI * 2);
  c.stroke();

  // 5 Chrome Lug Nuts arranged in star pattern
  const nutR = hubR * 0.65;
  for (let i = 0; i < spokes; i++) {
    const nAngle = i * spokeStep + (spokeStep / 2);
    const nx = cx + Math.cos(nAngle) * nutR;
    const ny = cy + Math.sin(nAngle) * nutR;

    c.fillStyle = '#05070a';
    c.beginPath();
    c.arc(nx + 0.8, ny + 0.8, 4.2, 0, Math.PI * 2);
    c.fill();

    c.fillStyle = cfg.nutColor;
    c.beginPath();
    c.arc(nx, ny, 3.8, 0, Math.PI * 2);
    c.fill();

    c.fillStyle = '#0f172a';
    c.beginPath();
    c.arc(nx, ny, 1.6, 0, Math.PI * 2);
    c.fill();
  }

  // Center Emblem Cap
  const capR = hubR * 0.44;
  c.fillStyle = cfg.hubCenter;
  c.beginPath();
  c.arc(cx, cy, capR, 0, Math.PI * 2);
  c.fill();

  c.strokeStyle = cfg.spokeLight;
  c.lineWidth = 1.8;
  c.beginPath();
  c.arc(cx, cy, capR, 0, Math.PI * 2);
  c.stroke();

  c.fillStyle = cfg.hubAccent;
  c.beginPath();
  c.arc(cx, cy, capR * 0.45, 0, Math.PI * 2);
  c.fill();

  c.restore();
  return canv;
}

function buildWheelSprites() {
  try {

function initAssetPreloading() {
  try {
    // 1. Preload Level Pictures concurrently
    LEVEL_PICTURE_URLS.forEach((url, idx) => {
      const item = {
        index: idx + 1,
        url,
        img: null,
        loaded: false,
        failed: false,
        seamlessCanvas: null,
        unitW: 0
      };
      preloadedPictures.push(item);

      loadImageWithTimeout(url)
        .then((img) => {
          try {
            item.img = img;
            item.loaded = true;
            updatePictureSeamlessCanvas(item);
          } catch (e) {
            console.warn('Error creating seamless canvas:', e);
            if (!loadingErrorMsg) loadingErrorMsg = 'BG: ' + (e.message || String(e));
          }
        })
        .catch((err) => {
          console.warn('Level image load failed:', err);
          item.failed = true;
          if (!loadingErrorMsg) loadingErrorMsg = 'BG failed: ' + (err.message || String(err));
        })
        .finally(() => {
          markAssetFinished();
        });
    });

    // 2. Preload and process Car Image concurrently
    loadImageWithTimeout(CAR_IMAGE_URL)
      .then((img) => {
        try {
          processCarImage(img);
          carImgLoaded = true;
        } catch (e) {
          console.warn('processCarImage error:', e);
          if (!loadingErrorMsg) loadingErrorMsg = 'Car: ' + (e.message || String(e));
          carImgFailed = true;
        }
      })
      .catch((err) => {
        console.warn('Car image load failed:', err);
        carImgFailed = true;
        if (!loadingErrorMsg) loadingErrorMsg = 'Car load failed: ' + (err.message || String(err));
      })
      .finally(() => {
        markAssetFinished();
      });

  } catch (err) {
    console.error('initAssetPreloading error:', err);
    loadingErrorMsg = 'Preload: ' + (err.message || String(err));
    assetsFinished = true;
  }
}

initAssetPreloading();

function updatePictureSeamlessCanvas(item) {
  if (!item.img || item.img.naturalWidth === 0) return;
  const aspect = item.img.naturalWidth / item.img.naturalHeight;
  const scaledW = Math.round(aspect * H);
  item.unitW = scaledW * 2;

  const sCanv = document.createElement('canvas');
  sCanv.width = item.unitW;
  sCanv.height = H;
  const sCtx = sCanv.getContext('2d');

  sCtx.drawImage(item.img, 0, 0, scaledW, H);
  sCtx.save();
  sCtx.translate(item.unitW, 0);
  sCtx.scale(-1, 1);
  sCtx.drawImage(item.img, 0, 0, scaledW, H);
  sCtx.restore();

  item.seamlessCanvas = sCanv;
}

function getLevelPicture(lvl) {
  if (!preloadedPictures.length) return null;
  const idx = (lvl - 1) % preloadedPictures.length;
  const item = preloadedPictures[idx];
  if (item && item.loaded && !item.failed && item.seamlessCanvas) {
    return item;
  }
  return null;
}

let audioCtx = null;
let masterGain = null;
let soundEnabled = true;
let vibrateEnabled = true;

try {
  soundEnabled = localStorage.getItem('skycarSound') !== 'false';
  vibrateEnabled = localStorage.getItem('skycarVibrate') !== 'false';
} catch(e) {}

function initAudio() {
  if (audioCtx) return;
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    audioCtx = new AudioContext();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = soundEnabled ? 0.35 : 0;
    masterGain.connect(audioCtx.destination);
    decodeGasPuffAudio();
  } catch(e) {}
}

function ensureAudioContext() {
  try {
    if (!audioCtx) {
      initAudio();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
    if (audioCtx && !gasPuffAudioBuffer && !isPuffDecoding) {
      decodeGasPuffAudio();
    }
  } catch(e) {}
}

let gasPuffAudioBuffer = null;
let isPuffDecoding = false;
let wasThrustActive = false;
let puffHoldTimer = 0;

function decodeGasPuffAudio() {
  if (gasPuffAudioBuffer || isPuffDecoding) return;
  if (!audioCtx) return;
  try {
    isPuffDecoding = true;
    const base64Str = GAS_PUFF_BASE64.split(',')[1];
    const binary = atob(base64Str);
    const len = binary.length;
    const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) {
      bytes[i] = binary.charCodeAt(i);
    }
    const onSuccess = (buf) => {
      gasPuffAudioBuffer = buf;
      isPuffDecoding = false;
    };
    const onError = (err) => {
      console.warn('gas_puff decode failed, fallback will be used', err);
      gasPuffAudioBuffer = null;
      isPuffDecoding = false;
    };
    const res = audioCtx.decodeAudioData(bytes.buffer.slice(0), onSuccess, onError);
    if (res && typeof res.then === 'function') {
      res.then(onSuccess).catch(onError);
    }
  } catch (err) {
    gasPuffAudioBuffer = null;
    isPuffDecoding = false;
  }
}

function playSynthesizedPuff(targetVol, targetRate) {
  if (!audioCtx) return;
  try {
    const sampleRate = audioCtx.sampleRate || 44100;
    const dur = 0.18;
    const frameCount = Math.floor(sampleRate * dur);
    const noiseBuffer = audioCtx.createBuffer(1, frameCount, sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < frameCount; i++) {
      data[i] = Math.random() * 2 - 1;
    }

    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuffer;
    src.playbackRate.value = targetRate || 1.0;

    // High-pass filter at 2500 Hz
    const hp = audioCtx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 2500;

    // Band-pass filter at 5000 Hz (Q 0.7)
    const bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 5000;
    bp.Q.value = 0.7;

    // Volume envelope: rises to 0.8 in 30 ms, falls to 0.45 by 120 ms, cuts to 0 at 180 ms
    const scale = (targetVol !== undefined) ? (targetVol / 0.8) : 1.0;
    const g = audioCtx.createGain();
    const now = audioCtx.currentTime;
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.8 * scale, now + 0.030);
    g.gain.linearRampToValueAtTime(0.45 * scale, now + 0.120);
    g.gain.linearRampToValueAtTime(0.0001, now + 0.180);

    src.connect(hp);
    hp.connect(bp);
    bp.connect(g);
    g.connect(masterGain || audioCtx.destination);

    src.start(now);
    src.stop(now + 0.180);
  } catch (err) {
    console.warn('Fallback synthesized puff error:', err);
  }
}

function playSinglePuff(isInitial = false) {
  if (!soundEnabled) return;
  ensureAudioContext();
  if (!audioCtx) return;

  const rate = 0.92 + Math.random() * (1.08 - 0.92);
  const vol = isInitial ? SFX_VOLUME : (SFX_VOLUME * (0.7 + Math.random() * 0.3));

  if (gasPuffAudioBuffer) {
    try {
      const src = audioCtx.createBufferSource();
      src.buffer = gasPuffAudioBuffer;
      src.playbackRate.value = rate;

      const g = audioCtx.createGain();
      g.gain.value = vol;

      src.connect(g);
      g.connect(masterGain || audioCtx.destination);

      src.start();
    } catch (err) {
      playSynthesizedPuff(vol, rate);
    }
  } else {
    playSynthesizedPuff(vol, rate);
  }
}

function updateThrustAudio(dt) {
  const isThrustActive = (st === 'play' && hold && !autoLanding && !stopping && !settingsOpen);

  if (!soundEnabled || !isThrustActive) {
    wasThrustActive = false;
    puffHoldTimer = 0;
    return;
  }

  // Pressed: every time the thrust button is pressed, play immediately
  if (!wasThrustActive) {
    wasThrustActive = true;
    puffHoldTimer = 0;
    playSinglePuff(true);
    return;
  }

  // While held: play a new puff every PUFF_INTERVAL = 0.2s
  puffHoldTimer += dt;
  if (puffHoldTimer >= PUFF_INTERVAL) {
    puffHoldTimer -= PUFF_INTERVAL;
    playSinglePuff(false);
  }
}

function setSound(enabled) {
  soundEnabled = enabled;
  try { localStorage.setItem('skycarSound', enabled ? 'true' : 'false'); } catch(e) {}
  if (masterGain && audioCtx) {
    masterGain.gain.setValueAtTime(soundEnabled ? 0.35 : 0, audioCtx.currentTime);
  }
}

function setVibrate(enabled) {
  vibrateEnabled = enabled;
  try { localStorage.setItem('skycarVibrate', enabled ? 'true' : 'false'); } catch(e) {}
}

function triggerVibrate(pattern) {
  if (!vibrateEnabled) return;
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch(e) {}
}

function playClickSound() {
  if (!soundEnabled) return;
  initAudio();
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const now = audioCtx.currentTime;
    osc.type = 'sine';
    osc.frequency.setValueAtTime(540, now);
    osc.frequency.exponentialRampToValueAtTime(880, now + 0.06);
    g.gain.setValueAtTime(0.25, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(now);
    osc.stop(now + 0.06);
  } catch(e) {}
}

function playLaunchSpinSound() {
  if (!soundEnabled) return;
  initAudio();
  if (!audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(320, now);
    osc.frequency.exponentialRampToValueAtTime(960, now + 0.32);
    osc.frequency.exponentialRampToValueAtTime(420, now + 0.65);
    g.gain.setValueAtTime(0.01, now);
    g.gain.linearRampToValueAtTime(0.24, now + 0.18);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(now);
    osc.stop(now + 0.65);
  } catch(e) {}
}

function playCrashSound() {
  triggerVibrate([80, 40, 100]);

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(160, now);
    osc.frequency.exponentialRampToValueAtTime(30, now + 0.32);
    g.gain.setValueAtTime(0.45, now);
    g.gain.exponentialRampToValueAtTime(0.01, now + 0.32);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(now);
    osc.stop(now + 0.32);
  } catch(e) {}
}

function playWinSound() {
  triggerVibrate([40, 50, 40, 50, 90]);
  if (!soundEnabled) return;
  initAudio();
  if (!audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    const freqs = [523.25, 659.25, 783.99, 1046.5];
    freqs.forEach((f, i) => {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      const t = now + i * 0.09;
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.3, t);
      g.gain.exponentialRampToValueAtTime(0.01, t + 0.22);
      osc.connect(g);
      g.connect(masterGain);
      osc.start(t);
      osc.stop(t + 0.22);
    });
  } catch(e) {}
}

// ==========================================
// PROCEDURAL LEVEL CONFIG & FALLBACK SCENES
// ==========================================
const SCENE_NAMES = [
  'Sky Town',
  'Beach Town',
  'Candy Land',
  'Snow Village',
  'Desert Oasis',
  'Jungle Temple',
  'Space Station',
  'Underwater City'
];

const SHAPE_TYPES = [
  'cone', 'needle', 'fat stud', 'double-cone', 'faceted crystal',
  'curved thorn', 'fork', 'saw tooth', 'bullet', 'flame-shaped'
];
const RAIL_STYLES = ['rivets', 'bolts', 'small gears', 'chain links', 'dots'];

function getSceneType(level) {
  return (level - 1) % 8;
}

function generateLevelConfig(level, prev) {
  const sceneId = getSceneType(level);
  const seed = hashInt(level * 10007 + 773);
  const rng = mulberry32(seed);
  const pick = arr => arr[Math.floor(rng() * arr.length)];
  const range = (a, b) => a + rng() * (b - a);

  let H = Math.round((level * 137.508) % 360);
  const name = SCENE_NAMES[sceneId] + (level > 8 ? ` ${Math.floor((level - 1) / 8) + 1}` : '');

  let bgTop, bgBot, cloudColor;
  switch (sceneId) {
    case 0: // Sky Town
      bgTop = '#48cae4'; bgBot = '#caf0f8'; cloudColor = '#ffffff'; H = 195;
      break;
    case 1: // Beach Town
      bgTop = '#00b4d8'; bgBot = '#ffd166'; cloudColor = '#ffffff'; H = 45;
      break;
    case 2: // Candy Land
      bgTop = '#ff70a6'; bgBot = '#ffd670'; cloudColor = '#fff0f5'; H = 330;
      break;
    case 3: // Snow Village
      bgTop = '#7097c2'; bgBot = '#dceaf7'; cloudColor = '#ffffff'; H = 210;
      break;
    case 4: // Desert Oasis
      bgTop = '#f77f00'; bgBot = '#fcbf49'; cloudColor = '#fff5eb'; H = 35;
      break;
    case 5: // Jungle Temple
      bgTop = '#2ec4b6'; bgBot = '#cbf3f0'; cloudColor = '#f0fff4'; H = 150;
      break;
    case 6: // Space Station
      bgTop = '#240046'; bgBot = '#7b2cbf'; cloudColor = '#ff9e00'; H = 275;
      break;
    case 7: // Underwater City
      bgTop = '#023e8a'; bgBot = '#0096c7'; cloudColor = '#90e0ef'; H = 190;
      break;
  }

  if (level > 8) {
    const shift = Math.floor(rng() * 40) - 20;
    H = (H + shift + 360) % 360;
  }

  const shapeType = pick(SHAPE_TYPES);
  const width = Math.round(range(10, 15));
  const heightRatio = +(range(1.6, 2.8)).toFixed(2);
  const tipSharpness = pick(['sharp', 'medium', 'rounded']);
  const collarRing = rng() > 0.35;
  const bend = +(range(-0.3, 0.3)).toFixed(2);
  const railStyle = pick(RAIL_STYLES);

  const spikeSat = Math.round(range(75, 95));
  const spikeLit = Math.round(range(44, 56));
  const spikeColor = { h: H, s: spikeSat, l: spikeLit };
  const railColor = `hsl(${H}, 35%, 52%)`;

  return {
    level,
    sceneId,
    name,
    H,
    bgTop,
    bgBot,
    cloudColor,
    spikeColor,
    shapeType,
    width,
    heightRatio,
    tipSharpness,
    collarRing,
    bend,
    railStyle,
    railColor,
    accentColor: `hsl(${H}, 90%, 50%)`,
    glowColor: `hsl(${H}, 95%, 60%)`
  };
}

const levelConfigCache = new Map();
function getLevelConfig(level) {
  if (levelConfigCache.has(level)) return levelConfigCache.get(level);
  const prev = level > 1 ? getLevelConfig(level - 1) : null;
  const cfg = generateLevelConfig(level, prev);
  levelConfigCache.set(level, cfg);
  return cfg;
}

function hasRealScenePicture(level, cfg) {
  // Only Level 1 has an authentic dedicated background picture asset (Sky Town image_39e1ec82.png)
  return level === 1 && !!cfg && (cfg.name === 'Sky Town' || cfg.name.startsWith('Sky Town'));
}

function getLevelDisplayText(level, cfg) {
  if (hasRealScenePicture(level, cfg)) {
    return `LEVEL ${level}: ${cfg.name.toUpperCase()}`;
  }
  return `LEVEL ${level}`;
}

let fallbackBgCanvas = null;
let fallbackParallaxCanvases = [];

function roundRect(c, x, y, w, h, r) {
  if (w < 2 * r) r = w / 2;
  if (h < 2 * r) r = h / 2;
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function renderSpikeToCanvas(canvas, isTop, h, cfg) {
  const sCtx = canvas.getContext('2d');
  sCtx.clearRect(0, 0, canvas.width, canvas.height);

  const cx = 18;
  const baseY = isTop ? 2 : 46;
  const dir = isTop ? 1 : -1;
  const tipY = baseY + dir * h;
  const w = Math.min(16, Math.max(9, cfg.width));
  const bendOffset = (cfg.bend || 0) * (h * 0.22);
  const tipX = cx + bendOffset;

  const H = cfg.spikeColor.h, S = cfg.spikeColor.s, L = cfg.spikeColor.l;
  const colBase = `hsl(${H}, ${S}%, ${L}%)`;
  const colLight = `hsl(${H}, ${Math.max(10, S - 15)}%, ${Math.min(95, L + 28)}%)`;
  const colDark = `hsl(${H}, ${Math.min(100, S + 10)}%, ${Math.max(14, L - 22)}%)`;
  const outlineColor = '#181e28';

  sCtx.save();

  // 3D Facets
  sCtx.fillStyle = colLight;
  sCtx.beginPath();
  sCtx.moveTo(cx - w / 2, baseY);
  sCtx.lineTo(tipX, tipY);
  sCtx.lineTo(cx, baseY);
  sCtx.closePath();
  sCtx.fill();

  sCtx.fillStyle = colDark;
  sCtx.beginPath();
  sCtx.moveTo(cx, baseY);
  sCtx.lineTo(tipX, tipY);
  sCtx.lineTo(cx + w / 2, baseY);
  sCtx.closePath();
  sCtx.fill();

  // Thin dark outline
  sCtx.strokeStyle = outlineColor;
  sCtx.lineWidth = 1.4;
  sCtx.lineJoin = 'round';
  sCtx.beginPath();
  sCtx.moveTo(cx - w / 2, baseY);
  sCtx.lineTo(tipX, tipY);
  sCtx.lineTo(cx + w / 2, baseY);
  sCtx.stroke();

  if (cfg.collarRing) {
    const crH = 3.5;
    const crY = isTop ? baseY : baseY - crH;
    sCtx.fillStyle = colBase;
    sCtx.fillRect(cx - (w + 4) / 2, crY, w + 4, crH);
    sCtx.fillStyle = 'rgba(255, 255, 255, 0.75)';
    sCtx.fillRect(cx - (w + 4) / 2, crY, w + 4, 1);
    sCtx.strokeStyle = outlineColor;
    sCtx.lineWidth = 1;
    sCtx.strokeRect(cx - (w + 4) / 2, crY, w + 4, crH);
  }

  sCtx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
  sCtx.lineWidth = 1.3;
  sCtx.beginPath();
  sCtx.moveTo(cx - w * 0.22, baseY + dir * 3);
  sCtx.lineTo(tipX - 1, tipY - dir * 2);
  sCtx.stroke();

  sCtx.fillStyle = '#ffffff';
  sCtx.beginPath();
  sCtx.arc(tipX, tipY - dir * 1.5, 1.3, 0, 6.28);
  sCtx.fill();

  sCtx.restore();
}

function drawFluffyClouds(pCtx, x, y, scale = 1, alpha = 0.85, tint = '#ffffff') {
  pCtx.save();
  pCtx.globalAlpha = alpha;
  pCtx.fillStyle = tint;
  const circles = [
    [0, 0, 26], [24, -8, 22], [48, 2, 24], [-22, 4, 18], [20, 8, 20]
  ];
  for (const [ox, oy, r] of circles) {
    pCtx.beginPath();
    pCtx.arc(x + ox * scale, y + oy * scale, r * scale, 0, Math.PI * 2);
    pCtx.fill();
  }
  pCtx.fillStyle = 'rgba(255, 255, 255, 0.6)';
  pCtx.beginPath();
  pCtx.ellipse(x + 12 * scale, y - 6 * scale, 34 * scale, 12 * scale, 0, 0, Math.PI * 2);
  pCtx.fill();
  pCtx.restore();
}

function prerenderSpikes(cfg) {
  const sizes = { small: 12, medium: 22, big: 36 };
  for (const sKey in sizes) {
    const h = sizes[sKey];
    for (const dir of ['top', 'bot']) {
      const key = `${sKey}_${dir}`;
      if (!spikeCanvases[key]) {
        spikeCanvases[key] = document.createElement('canvas');
        spikeCanvases[key].width = 36;
        spikeCanvases[key].height = 48;
      }
      renderSpikeToCanvas(spikeCanvases[key], dir === 'top', h, cfg);
    }
  }
}

function prerenderFallbackScene(cfg) {
  if (!fallbackBgCanvas) {
    fallbackBgCanvas = document.createElement('canvas');
    fallbackBgCanvas.width = W;
    fallbackBgCanvas.height = H;
  }
  const bgCtx = fallbackBgCanvas.getContext('2d');
  const grad = bgCtx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, cfg.bgTop);
  grad.addColorStop(1, cfg.bgBot);
  bgCtx.fillStyle = grad;
  bgCtx.fillRect(0, 0, W, H);

  // Soft sunlight highlight
  const sunGrad = bgCtx.createRadialGradient(W * 0.75, H * 0.15, 10, W * 0.75, H * 0.15, W * 0.6);
  sunGrad.addColorStop(0, 'rgba(255, 255, 255, 0.45)');
  sunGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
  bgCtx.fillStyle = sunGrad;
  bgCtx.fillRect(0, 0, W, H);
}

  green: { top: '#6ee7b7', mid: '#22c55e', bot: '#16a34a', lip: '#14532d', border: '#052e16' },
  blue: { top: '#93c5fd', mid: '#3b82f6', bot: '#2563eb', lip: '#1e3a8a', border: '#0f172a' },
  purple: { top: '#d8b4fe', mid: '#a855f7', bot: '#9333ea', lip: '#581c87', border: '#3b0764' },
  orange: { top: '#fed7aa', mid: '#f97316', bot: '#ea580c', lip: '#7c2d12', border: '#431407' },
  red: { top: '#fca5a5', mid: '#ef4444', bot: '#dc2626', lip: '#7f1d1d', border: '#450a0a' },
  gray: { top: '#e2e8f0', mid: '#94a3b8', bot: '#64748b', lip: '#334155', border: '#1e293b' }

function drawGlossyText(text, x, y, size, align = 'center', color = '#ffffff', strokeColor = '#0f172a', strokeWidth) {
  ctx.save();
  ctx.font = `800 ${size}px "Lilita One", "Baloo 2", cursive, system-ui, sans-serif`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';

  const sw = strokeWidth !== undefined ? strokeWidth : Math.max(3.5, Math.round(size * 0.18));
  ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
  ctx.shadowBlur = 4;
  ctx.shadowOffsetY = 2;

  ctx.strokeStyle = strokeColor;
  ctx.lineWidth = sw;
  ctx.lineJoin = 'round';
  ctx.miterLimit = 2;
  ctx.strokeText(text, x, y);

  ctx.shadowColor = 'transparent';
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawGlossyButton(x, y, w, h, theme, label, iconType, isPressed, radius = 18) {
  const py = isPressed ? y + 3 : y;
  const lipH = isPressed ? 2 : 5;

  ctx.save();
  ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
  ctx.shadowBlur = isPressed ? 4 : 8;
  ctx.shadowOffsetY = isPressed ? 2 : 5;

  ctx.fillStyle = theme.lip;
  roundRect(ctx, x, py + lipH, w, h, radius);
  ctx.fill();

  ctx.shadowColor = 'transparent';

  const grad = ctx.createLinearGradient(0, py, 0, py + h);
  grad.addColorStop(0, theme.top);
  grad.addColorStop(0.48, theme.mid);
  grad.addColorStop(1, theme.bot);
  ctx.fillStyle = grad;
  roundRect(ctx, x, py, w, h, radius);
  ctx.fill();

  // White gloss band on top half
  ctx.save();
  roundRect(ctx, x, py, w, h, radius);
  ctx.clip();
  const glossGrad = ctx.createLinearGradient(0, py, 0, py + h * 0.54);
  glossGrad.addColorStop(0, 'rgba(255, 255, 255, 0.65)');
  glossGrad.addColorStop(1, 'rgba(255, 255, 255, 0.05)');
  ctx.fillStyle = glossGrad;
  ctx.beginPath();
  ctx.ellipse(x + w / 2, py + 2, w * 0.6, h * 0.45, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Inner highlight outline
  ctx.save();
  roundRect(ctx, x + 1.5, py + 1.5, w - 3, h - 3, Math.max(2, radius - 1));
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
  ctx.lineWidth = 1.3;
  ctx.stroke();
  ctx.restore();

  // Dark outer outline
  ctx.strokeStyle = theme.border;
  ctx.lineWidth = 2.4;
  roundRect(ctx, x, py, w, h + (isPressed ? 1 : 2), radius);
  ctx.stroke();

  if (iconType) {
    drawButtonIcon(iconType, x + w / 2, py + h / 2, Math.min(w, h) * 0.48);
  }
  if (label) {
    const textY = py + h / 2 + 1;
    drawGlossyText(label, x + w / 2, textY, Math.min(22, Math.round(h * 0.42)), 'center', '#ffffff', theme.border, 4.2);
  }
  ctx.restore();
}

function drawRoundGlossyButton(cx, cy, r, theme, iconType, isPressed) {
  drawGlossyButton(cx - r, cy - r, r * 2, r * 2, theme, null, iconType, isPressed, r);
}

function drawButtonIcon(type, cx, cy, sz) {
  ctx.save();
  ctx.translate(cx, cy);

  if (type === 'gear') {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 2;
    for (let a = 0; a < 6; a++) {
      ctx.rotate(Math.PI / 3);
      ctx.fillRect(-sz * 0.16, -sz * 0.52, sz * 0.32, sz * 0.22);
      ctx.strokeRect(-sz * 0.16, -sz * 0.52, sz * 0.32, sz * 0.22);
    }
    ctx.beginPath(); ctx.arc(0, 0, sz * 0.38, 0, 6.28); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#2563eb';
    ctx.beginPath(); ctx.arc(0, 0, sz * 0.18, 0, 6.28); ctx.fill(); ctx.stroke();

  } else if (type === 'car') {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#3b0764';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-sz * 0.45, sz * 0.15);
    ctx.lineTo(-sz * 0.35, -sz * 0.1);
    ctx.lineTo(-sz * 0.1, -sz * 0.28);
    ctx.lineTo(sz * 0.2, -sz * 0.28);
    ctx.lineTo(sz * 0.4, -sz * 0.05);
    ctx.lineTo(sz * 0.45, sz * 0.15);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#0f172a';
    ctx.beginPath(); ctx.arc(-sz * 0.25, sz * 0.18, sz * 0.14, 0, 6.28); ctx.fill();
  } else if (type === 'wheel') {
    ctx.fillStyle = '#f8fafc';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.arc(0, 0, sz * 0.44, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    // Inner dark rotor
    ctx.fillStyle = '#334155';
    ctx.beginPath();
    ctx.arc(0, 0, sz * 0.36, 0, Math.PI * 2);
    ctx.fill();
    // 5 Spokes
    ctx.strokeStyle = '#f8fafc';
    ctx.lineWidth = 2.2;
    for (let a = 0; a < 5; a++) {
      const ang = a * (Math.PI * 2 / 5);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(ang) * sz * 0.36, Math.sin(ang) * sz * 0.36);
      ctx.stroke();
    }
    // Red sport center cap
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(0, 0, sz * 0.12, 0, Math.PI * 2);
    ctx.fill();

  } else if (type === 'close') {
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = sz * 0.22;
    ctx.lineCap = 'round';
    const s = sz * 0.32;
    ctx.beginPath();
    ctx.moveTo(-s, -s); ctx.lineTo(s, s);
    ctx.moveTo(s, -s); ctx.lineTo(-s, s);
    ctx.stroke();

  } else if (type === 'sound_on') {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#052e16';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-sz * 0.35, -sz * 0.15); ctx.lineTo(-sz * 0.15, -sz * 0.15); ctx.lineTo(sz * 0.1, -sz * 0.35);
    ctx.lineTo(sz * 0.1, sz * 0.35); ctx.lineTo(-sz * 0.15, sz * 0.15); ctx.lineTo(-sz * 0.35, sz * 0.15);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(sz * 0.05, 0, sz * 0.24, -0.6, 0.6); ctx.stroke();
    ctx.beginPath(); ctx.arc(sz * 0.05, 0, sz * 0.4, -0.7, 0.7); ctx.stroke();

  } else if (type === 'sound_off') {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-sz * 0.35, -sz * 0.15); ctx.lineTo(-sz * 0.15, -sz * 0.15); ctx.lineTo(sz * 0.1, -sz * 0.35);
    ctx.lineTo(sz * 0.1, sz * 0.35); ctx.lineTo(-sz * 0.15, sz * 0.15); ctx.lineTo(-sz * 0.35, sz * 0.15);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-sz * 0.35, -sz * 0.35); ctx.lineTo(sz * 0.35, sz * 0.35); ctx.stroke();

  } else if (type === 'vibrate_on') {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#052e16';
    ctx.lineWidth = 2;
    roundRect(ctx, -sz * 0.2, -sz * 0.35, sz * 0.4, sz * 0.7, 4);
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(-sz * 0.25, 0, sz * 0.25, Math.PI * 0.75, Math.PI * 1.25); ctx.stroke();
    ctx.beginPath(); ctx.arc(sz * 0.25, 0, sz * 0.25, -Math.PI * 0.25, Math.PI * 0.25); ctx.stroke();

  } else if (type === 'vibrate_off') {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 2;
    roundRect(ctx, -sz * 0.2, -sz * 0.35, sz * 0.4, sz * 0.7, 4);
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-sz * 0.35, -sz * 0.35); ctx.lineTo(sz * 0.35, sz * 0.35); ctx.stroke();
  }

  ctx.restore();
}

function drawGoldStar(cx, cy, r) {
  ctx.save();
  ctx.translate(cx, cy);

  ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
  ctx.shadowBlur = 4;
  ctx.shadowOffsetY = 2;

  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const ang = (i * Math.PI) / 5 - Math.PI / 2;
    const rad = i % 2 === 0 ? r : r * 0.48;
    const x = Math.cos(ang) * rad;
    const y = Math.sin(ang) * rad;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();

  const starGrad = ctx.createLinearGradient(0, -r, 0, r);
  starGrad.addColorStop(0, '#fef08a');
  starGrad.addColorStop(0.4, '#facc15');
  starGrad.addColorStop(1, '#ca8a04');
  ctx.fillStyle = starGrad;
  ctx.fill();

  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = '#713f12';
  ctx.lineWidth = 1.8;
  ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(-r * 0.2, -r * 0.25, r * 0.2, 0, 6.28);
  ctx.fill();

  ctx.restore();
}

function drawRibbonHeader(cx, cy, w, h, text, themeColor, starCount = 2) {
  ctx.save();
  const halfW = w / 2;
  const tailW = 24;

  ctx.fillStyle = themeColor.lip;
  ctx.beginPath();
  ctx.moveTo(cx - halfW, cy);
  ctx.lineTo(cx - halfW - tailW, cy + 10);
  ctx.lineTo(cx - halfW - tailW + 8, cy + h + 4);
  ctx.lineTo(cx - halfW, cy + h);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(cx + halfW, cy);
  ctx.lineTo(cx + halfW + tailW, cy + 10);
  ctx.lineTo(cx + halfW + tailW - 8, cy + h + 4);
  ctx.lineTo(cx + halfW, cy + h);
  ctx.closePath();
  ctx.fill();

  const rGrad = ctx.createLinearGradient(0, cy, 0, cy + h);
  rGrad.addColorStop(0, themeColor.top);
  rGrad.addColorStop(0.5, themeColor.mid);
  rGrad.addColorStop(1, themeColor.bot);
  ctx.fillStyle = rGrad;
  roundRect(ctx, cx - halfW, cy, w, h, 8);
  ctx.fill();

  ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
  ctx.fillRect(cx - halfW + 4, cy + 2, w - 8, h * 0.35);

  ctx.strokeStyle = themeColor.border;
  ctx.lineWidth = 2.4;
  roundRect(ctx, cx - halfW, cy, w, h, 8);
  ctx.stroke();

  drawGlossyText(text, cx, cy + h / 2 + 1, 22, 'center', '#ffffff', themeColor.border, 4.5);

  if (starCount >= 2) {
    drawGoldStar(cx - halfW + 18, cy + h / 2, 11);
    drawGoldStar(cx + halfW - 18, cy + h / 2, 11);
  }

  ctx.restore();
}

// Coin-Counter Pill with bold white text and dark outline
function drawCoinPill(x, y, w, h, val, isBest = false) {
  ctx.save();
  ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
  ctx.shadowBlur = 6;
  ctx.shadowOffsetY = 3;

  ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
  roundRect(ctx, x, y, w, h, h / 2);
  ctx.fill();

  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1.6;
  roundRect(ctx, x, y, w, h, h / 2);
  ctx.stroke();

  const coinR = h * 0.58;
  const coinX = x + h * 0.48;
  const coinY = y + h * 0.5;

  ctx.fillStyle = '#eab308';
  ctx.beginPath(); ctx.arc(coinX, coinY, coinR, 0, 6.28); ctx.fill();
  ctx.strokeStyle = '#713f12'; ctx.lineWidth = 1.5; ctx.stroke();
  drawGoldStar(coinX, coinY, coinR * 0.65);

  const label = isBest ? `BEST ${val}` : `${val}`;
  drawGlossyText(label, x + (w + coinR) / 2 + 2, y + h / 2 + 1, 15, 'center', '#ffffff', '#0f172a', 3.8);

  ctx.restore();
}

const PROGRESS_STORAGE_KEY = 'thornRushProgress';
let highestLevel = 1;

function loadProgress() {
  try {
    const raw = localStorage.getItem(PROGRESS_STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (data && typeof data === 'object') {
        if (Number.isFinite(data.currentLevel) && data.currentLevel >= 1) {
          curLevel = Math.floor(data.currentLevel);
        }
        if (Number.isFinite(data.highestLevel) && data.highestLevel >= 1) {
          highestLevel = Math.max(curLevel, Math.floor(data.highestLevel));
        } else {
          highestLevel = curLevel;
        }
        if (Number.isFinite(data.bestScore) && data.bestScore >= 0) {
          best = Math.floor(data.bestScore);
        }
      }
    }
  } catch (e) {
    console.warn('Failed to load progress from localStorage:', e);
  }
  try {
    const legacyBest = +localStorage.getItem('skycarBest') || 0;
    if (legacyBest > best) best = legacyBest;
  } catch (e) {}
}

function saveProgress(cLvl, hLvl, bScore) {
  try {
    if (cLvl !== undefined && cLvl !== null) {
      curLevel = Math.max(1, Math.floor(cLvl));
    }
    if (hLvl !== undefined && hLvl !== null) {
      highestLevel = Math.max(curLevel, Math.floor(hLvl));
    } else {
      highestLevel = Math.max(highestLevel, curLevel);
    }
    if (bScore !== undefined && bScore !== null) {
      best = Math.max(best, Math.floor(bScore));
    }
    const payload = JSON.stringify({
      currentLevel: curLevel,
      highestLevel: highestLevel,
      bestScore: best
    });
    localStorage.setItem(PROGRESS_STORAGE_KEY, payload);
    localStorage.setItem('skycarBest', best);
  } catch (e) {
    console.warn('Failed to save progress to localStorage:', e);
  }
}

loadProgress();

// Synchronized progress calculation: exactly 100% when finish road reaches car
function getLevelProgress() {
  const dist = Math.max(0, cam);
  return Math.max(0, Math.min(1, dist / LEVEL_LENGTH));
}

function getDifficultyDistance() {
  const distInLevel = Math.max(0, Math.min(LEVEL_LENGTH, cam));
  return (curLevel - 1) * LEVEL_LENGTH + distInLevel;
}

// 1. Difficulty Growth:
// Let L be the level number and f = 1 - exp(-(L - 1) / 10) (0 at level 1, about 0.6 at level 11, 0.86 at level 21)
// 2. Intra-level: rises by ~15% from start to end; first 15% starts easier
function getLevelDifficulty(lvl, p = 0) {
  const L = lvl || curLevel;
  const fBase = 1 - Math.exp(-(L - 1) / LEVEL_GROWTH_TAU);

  let intra = 1.0;
  if (p < INTRA_LEVEL_EASY_FRACTION) {
    const ramp = p / INTRA_LEVEL_EASY_FRACTION;
    intra = (1.0 - INTRA_LEVEL_GROWTH) + (INTRA_LEVEL_GROWTH * ramp);
  } else {
    const normP = (p - INTRA_LEVEL_EASY_FRACTION) / (1.0 - INTRA_LEVEL_EASY_FRACTION);
    intra = 1.0 + INTRA_LEVEL_GROWTH * normP;
  }

  const f = Math.max(0, Math.min(1.0, fBase * intra));
  return { f, fBase, intra };
}

// Scroll speed multiplier = 1 + 0.45 * f
function scrollSpeed(difficultyDistance = getDifficultyDistance()) {
  const p = getLevelProgress();
  const { f } = getLevelDifficulty(curLevel, p);
  const baseSpeed = W * BASE_SCROLL_SPEED_RATIO;
  const multiplier = 1 + SCROLL_SPEED_GROWTH * f;
  return baseSpeed * multiplier * SPEED_MULTIPLIER;
}
const speed = scrollSpeed;

// Gap height = lerp(4.2, 2.4, f) * carH (never below 2.4 * carH)
function getGapHeight(lvl, p = 0) {
  const { f } = getLevelDifficulty(lvl, p);
  const gapRatio = lerp(GAP_LEVEL_1_RATIO, GAP_MAX_DIFFICULTY_RATIO, f);
  return Math.max(GAP_MAX_DIFFICULTY_RATIO * CAR_HITBOX_H, gapRatio * CAR_HITBOX_H);
}

function showToast(msg) {
  toastMsg = msg;
  toastTimer = 1.6;
  playClickSound();
}

// 3. SPIKE SIZES:
// - levels 1 and 2: only small spikes
// - levels 3 and 4: add medium spikes
// - from level 5: big spikes appear occasionally (about 10% of clusters)
// - share of big spikes grows slowly to about 35% by level 20
function pickClusterSize(lvl, levelRng) {
  const L = lvl || curLevel;
  if (L < SPIKE_MEDIUM_LEVEL) { // levels 1 and 2
    return 'small';
  }
  if (L < SPIKE_BIG_LEVEL) { // levels 3 and 4
    return (levelRng() < 0.5) ? 'medium' : 'small';
  }
  // From level 5: big spikes appear occasionally (10%), growing slowly to 35% by level 20
  const progressTo20 = Math.max(0, Math.min(1.0, (L - SPIKE_BIG_LEVEL) / (SPIKE_BIG_MAX_LEVEL - SPIKE_BIG_LEVEL)));
  const pBig = lerp(SPIKE_BIG_START_CHANCE, SPIKE_BIG_MAX_CHANCE, progressTo20);
  const pMed = 0.35;
  const r = levelRng();
  if (r < pBig) return 'big';
  if (r < pBig + pMed) return 'medium';
  return 'small';
}

// 4. SPIKE GENERATION: level 4+ mixes spike heights inside one rail
function makeSpikes(len, lvl, top, bot, noSpikes = false, levelRng) {
  const count = Math.ceil(len / 12);
  const heights = { small: 12, medium: 22, big: 36 };
  const L = lvl || curLevel;
  const allowMixed = (L >= TWIST_MIXED_SPIKES_LEVEL);

  // Sweet spot hazard density: clean rhythmic clusters so the player can weave between hazards
  const density = lerp(0.72, 0.95, Math.min(1.0, (L - 1) / 30));

  function gen(isTop) {
    const list = [];
    let i = 0;
    while (i < count) {
      const cLen = Math.min(count - i, Math.floor(2 + levelRng() * 4));
      const baseSize = pickClusterSize(L, levelRng);
      const isMixed = allowMixed && (levelRng() < 0.35);
      const hasSpike = !noSpikes && (levelRng() < density);

      for (let k = 0; k < cLen; k++) {
        let size = baseSize;
        if (isMixed && k % 2 === 1) {
          size = (baseSize === 'big') ? 'medium' : 'small';
        }
        const h = (!hasSpike || noSpikes) ? 0 : heights[size];
        list.push({ h, size });
      }
      i += cLen;
    }
    return list;
  }
  const topSpikes = gen(true);
  const botSpikes = gen(false);
  const maxSpikeSum = Math.max(0, (bot - top) - (CAR_HITBOX_H + 18));
  for (let i = 0; i < count; i++) {
    if (topSpikes[i].h + botSpikes[i].h > maxSpikeSum) {
      if (topSpikes[i].h >= botSpikes[i].h) {
        if (22 + botSpikes[i].h <= maxSpikeSum) { topSpikes[i].h = 22; topSpikes[i].size = 'medium'; }
        else { topSpikes[i].h = 12; topSpikes[i].size = 'small'; }
      } else {
        if (topSpikes[i].h + 22 <= maxSpikeSum) { botSpikes[i].h = 22; botSpikes[i].size = 'medium'; }
        else { botSpikes[i].h = 12; botSpikes[i].size = 'small'; }
      }
    }
  }
  return { topSpikes, botSpikes };
}

let levelPRNG = mulberry32(1);
let tunnelSegCount = 0;
let levelSeedTwist = 'smooth_corridor';
let gameTime = 0;
let lastGap = 380;

function addSeg(isOpen = false, forceLen) {
  const isTunnel = !isOpen && nextX >= TUNNEL_START_X && nextX < TUNNEL_END_X;
  const segIndex = isTunnel ? tunnelSegCount++ : 0;

  const segDistInLevel = isTunnel ? Math.max(0, Math.min(LEVEL_LENGTH, nextX - CAR_X)) : 0;
  const p = isTunnel ? (segDistInLevel / LEVEL_LENGTH) : 0;
  const { f } = getLevelDifficulty(curLevel, p);

  const currentScrollSpeed = scrollSpeed();

  // 1. Segment Length = lerp(1.3, 0.85, f) * BASE_SEGMENT_LEN
  const baseLen = lerp(SEG_LEN_LEVEL_1_RATIO, SEG_LEN_MAX_RATIO, f) * BASE_SEGMENT_LEN;
  let len = forceLen || Math.max(Math.round(BASE_SEGMENT_LEN * SEG_LEN_MAX_RATIO), Math.round(baseLen));

  if (!isOpen && nextX + len > TUNNEL_END_X) {
    len = Math.max(60, TUNNEL_END_X - nextX);
  }

  // 2. Base Gap Height = lerp(4.2, 2.4, f) * carH (never below 2.4 * carH)
  let gap = isOpen ? 380 : getGapHeight(curLevel, p);

  // 3. Squeeze sections (gap about 2.8 * carH):
  // Level 6 adds short squeeze section; level 12 adds two squeeze sections in a row
  let isSqueeze = false;
  if (!isOpen && curLevel >= TWIST_SQUEEZE_1_LEVEL) {
    if (curLevel >= TWIST_SQUEEZE_2_LEVEL) {
      if (segIndex === 3 || segIndex === 4) isSqueeze = true;
    } else {
      if (segIndex === 3) isSqueeze = true;
    }
  }
  if (isSqueeze) {
    gap = Math.max(GAP_MAX_DIFFICULTY_RATIO * CAR_HITBOX_H, SQUEEZE_GAP_RATIO * CAR_HITBOX_H);
    len = Math.max(Math.round(BASE_SEGMENT_LEN * 0.75), Math.round(len * 0.85));
  }

  // Seed twists for this level:
  if (!isOpen) {
    if (levelSeedTwist === 'tight_corridor' && (segIndex === 1 || segIndex === 2)) {
      gap = Math.max(GAP_MAX_DIFFICULTY_RATIO * CAR_HITBOX_H, gap * 0.92);
    }
  }

  // 4. Moving rails:
  // Level 9 adds slowly moving rails (up and down by 20 to 40 px, slow and smooth)
  // Level 15 adds faster moving rails
  let moving = false;
  let moveAmp = 0;
  let moveSpeed = 0;
  let movePhase = 0;

  if (!isOpen && curLevel >= TWIST_SLOW_MOVING_RAILS_LEVEL) {
    const isMovingSeg = (curLevel >= TWIST_FAST_MOVING_RAILS_LEVEL)
      ? (segIndex === 2 || segIndex === 5)
      : (segIndex === 2);
    if (isMovingSeg) {
      moving = true;
      moveAmp = MOVE_RAIL_AMP_MIN + levelPRNG() * (MOVE_RAIL_AMP_MAX - MOVE_RAIL_AMP_MIN);
      moveSpeed = (curLevel >= TWIST_FAST_MOVING_RAILS_LEVEL) ? MOVE_RAIL_SPEED_FAST : MOVE_RAIL_SPEED_SLOW;
      movePhase = levelPRNG() * Math.PI * 2;
    }
  }

  // 5. FAIR STEPS (Requirement 1 & 5):
  // Vertical step between segments = lerp(0.15, 0.6, f) * the maximum fair step
  // Vertical step between neighboring segments never exceeds 0.6 * MAX_UP_SPEED * segmentLength / scrollSpeed
  const fairStep = 0.6 * MAX_UP_SPEED * (len / currentScrollSpeed);
  const overlapStepLimit = Math.max(8, (lastGap + gap) / 2 - 1.2 * CAR_HITBOX_H);
  const maxFairStep = Math.min(fairStep, overlapStepLimit);

  const stepRatio = lerp(STEP_MIN_RATIO, STEP_MAX_RATIO, f);
  let maxShift = isOpen ? 15 : (stepRatio * maxFairStep);

  // Dynamic wave motion ("اوپر نیچے رہیں"): creates exciting rollercoaster ups and downs
  const waveCycle = 0.85;
  const waveSin = Math.sin((segIndex * waveCycle) + (curLevel * 1.57));
  let shiftDir = 0.75 * waveSin + 0.25 * (levelPRNG() * 2 - 1);

  if (!isOpen) {
    if (levelSeedTwist === 'quicker_stairs' || levelSeedTwist === 'quick_stairs') {
      shiftDir = (segIndex % 2 === 0) ? 0.95 : -0.95;
    } else if (levelSeedTwist === 'smooth_corridor' && segIndex >= 1 && segIndex <= 3) {
      maxShift *= 0.35;
    }
    if (isSqueeze) {
      maxShift *= 0.45;
    }
  }

  // Strict fairness clamp: never exceed maxFairStep
  maxShift = Math.min(maxShift, maxFairStep);

  // Vertical band constraints for the tunnel:
  // - Gap center must stay between TUNNEL_CENTER_MIN * H and TUNNEL_CENTER_MAX * H.
  // - Gap edges must stay at least 0.12 * H away from the top HUD area: c - gap/2 >= 0.12 * H
  // - Gap edges must stay at least 0.20 * H above the bottom of the screen: c + gap/2 <= 0.80 * H
  const bandMinC = Math.max(TUNNEL_CENTER_MIN * H, gap / 2 + 0.12 * H);
  const bandMaxC = Math.min(TUNNEL_CENTER_MAX * H, H * 0.80 - gap / 2);
  const safeMinC = Math.min(bandMinC, bandMaxC);
  const safeMaxC = Math.max(bandMinC, bandMaxC);

  let c;
  if (isOpen) {
    c = ROAD_TOP - 20;
    lastC = c;
  } else if (segIndex === 0) {
    // First segment enters the tunnel directly from road height smoothly into safe band
    c = Math.max(safeMinC, Math.min(safeMaxC, ROAD_TOP - 40));
    lastC = c;
  } else {
    // Dynamic wave motion ("اوپر نیچے رہیں"): wave rhythm ensures continuous climbs and dips
    if (shiftDir < 0 && (lastC - maxShift < safeMinC)) {
      shiftDir = Math.abs(shiftDir);
    } else if (shiftDir > 0 && (lastC + maxShift > safeMaxC)) {
      shiftDir = -Math.abs(shiftDir);
    }

    c = lastC + shiftDir * maxShift;
    c = Math.max(safeMinC, Math.min(safeMaxC, c));

    // Keep all fairness rules: vertical step never exceeds maxFairStep
    if (Math.abs(c - lastC) > maxFairStep) {
      c = lastC + Math.sign(c - lastC) * maxFairStep;
    }
    lastC = c;
  }

  const top = isOpen ? -300 : (c - gap / 2);
  const bot = isOpen ? (H + 300) : (c + gap / 2);

  const segProg = (nextX - CAR_X) / LEVEL_LENGTH;
  const noSpikes = isOpen || (segProg >= 0.95) || (nextX >= TUNNEL_END_X);
  const { topSpikes, botSpikes } = makeSpikes(len, curLevel, top, bot, noSpikes, levelPRNG);

  segs.push({
    x: nextX,
    w: len,
    top,
    bot,
    curTop: top,
    curBot: bot,
    topSpikes,
    botSpikes,
    isOpen,
    moving,
    moveAmp,
    moveSpeed,
    movePhase
  });

  lastGap = gap;
  nextX += len;
}

// 4. SANITIZE LEVEL SEGMENTS (Requirement 4):
// Check every neighboring pair with the rules and fix if needed, so a level never has an impossible spot.
function sanitizeLevelSegments(segmentList) {
  const currentScrollSpeed = scrollSpeed();
  const carH = CAR_HITBOX_H;

  for (let i = 1; i < segmentList.length; i++) {
    const prev = segmentList[i - 1];
    const curr = segmentList[i];
    if (prev.isOpen || curr.isOpen) continue;

    const gapA = prev.bot - prev.top;
    const gapB = curr.bot - curr.top;
    const lenB = curr.w;

    // 1. Step limit = min(0.5 * gapB, 0.6 * MAX_UP_SPEED * lenB / currentScrollSpeed)
    const fairStep = Math.min(0.5 * gapB, 0.6 * MAX_UP_SPEED * (lenB / currentScrollSpeed));

    // 2. Window overlap: ensure headroom for car
    const overlapStepLimit = Math.max(8, (gapA + gapB) / 2 - 1.2 * carH);
    const maxAllowedStep = Math.min(fairStep, overlapStepLimit);

    const cA = (prev.top + prev.bot) / 2;
    let cB = (curr.top + curr.bot) / 2;

    const diff = cB - cA;
    if (Math.abs(diff) > maxAllowedStep) {
      cB = cA + Math.sign(diff) * maxAllowedStep;
    }

    // Band clamp
    const bandMinC = Math.max(TUNNEL_CENTER_MIN * H, gapB / 2 + 0.12 * H);
    const bandMaxC = Math.min(TUNNEL_CENTER_MAX * H, H * 0.80 - gapB / 2);
    const safeMinC = Math.min(bandMinC, bandMaxC);
    const safeMaxC = Math.max(bandMinC, bandMaxC);
    cB = Math.max(safeMinC, Math.min(safeMaxC, cB));

    // Ensure overlap >= 1.4 * carH
    const curOverlap = Math.min(prev.bot, cB + gapB / 2) - Math.max(prev.top, cB - gapB / 2);
    if (curOverlap < 1.4 * carH) {
      cB = (cB > cA) ? (prev.bot + gapB / 2 - 1.4 * carH) : (prev.top - gapB / 2 + 1.4 * carH);
      cB = Math.max(safeMinC, Math.min(safeMaxC, cB));
    }

    curr.top = cB - gapB / 2;
    curr.bot = cB + gapB / 2;
    curr.curTop = curr.top;
    curr.curBot = curr.bot;

    // Spikes clearance check
    if (curr.topSpikes && curr.botSpikes) {
      const maxSpikeSum = Math.max(0, (curr.bot - curr.top) - (carH + 20));
      for (let k = 0; k < curr.topSpikes.length; k++) {
        if (curr.topSpikes[k].h + curr.botSpikes[k].h > maxSpikeSum) {
          const excess = (curr.topSpikes[k].h + curr.botSpikes[k].h) - maxSpikeSum;
          if (curr.topSpikes[k].h >= curr.botSpikes[k].h) {
            curr.topSpikes[k].h = Math.max(10, curr.topSpikes[k].h - excess);
          } else {
            curr.botSpikes[k].h = Math.max(10, curr.botSpikes[k].h - excess);
          }
        }
      }
    }
  }
}

function startLevel(lvl) {
  curLevel = lvl;
  cam = 0;
  vy = 0;
  thrust = 0;
  cy = CAR_REST_Y;
  isLevelIntro = true;
  levelIntroTimer = 0;
  carRollAngle = 0;
  playLaunchSpinSound();
  lastC = ROAD_TOP - 20;
  lastGap = 380;
  parts = [];
  stopping = false;
  stopTimer = 0;
  autoLanding = false;
  landingStartY = CAR_REST_Y;
  hasTouchedDown = false;
  winCelebrated = false;
  levelCompleteTimer = 0;
  levelJustCleared = 0;
  confettis = [];
  tunnelSegCount = 0;
  camSamples = [];
  realSpeedWPerSec = 0;
  realSpeedPxPerSec = 0;

  const fProg = 1 - Math.exp(-(lvl - 1) / LEVEL_GROWTH_TAU);
  TUNNEL_LENGTH = Math.round(4800 + 1200 * fProg);
  TUNNEL_END_X = TUNNEL_START_X + TUNNEL_LENGTH;
  FINISH_ROAD_X = TUNNEL_END_X + CALM_OPEN_GAP;
  FINISH_ROAD_END = FINISH_ROAD_X + FINISH_ROAD_LENGTH;
  FINISH_LINE_X = FINISH_ROAD_X + FINISH_ROAD_LENGTH * FINISH_LINE_AT;
  LEVEL_LENGTH = FINISH_LINE_X - CAR_X;

  const cfg = getLevelConfig(lvl);
  curConfig = cfg;
  prerenderSpikes(cfg);
  prerenderFallbackScene(cfg);

  levelPRNG = mulberry32(hashInt(lvl * 55555 + 12345));

  const twists = ['tight_corridor', 'quicker_stairs', 'smooth_corridor'];
  levelSeedTwist = twists[Math.floor(levelPRNG() * twists.length)];
  gameTime = 0;

  const initW = TUNNEL_START_X - START_ROAD_START;
  const { topSpikes, botSpikes } = makeSpikes(initW, curLevel, -300, H + 300, true, levelPRNG);
  segs = [{ x: START_ROAD_START, w: initW, top: -300, bot: H + 300, curTop: -300, curBot: H + 300, topSpikes, botSpikes, isOpen: true, moving: false }];
  nextX = TUNNEL_START_X;

  while (nextX < TUNNEL_END_X) {
    addSeg(false);
  }

  // Requirement 4: Sanitize all neighboring segment pairs
  sanitizeLevelSegments(segs);

  const postW = (FINISH_ROAD_END + 500) - TUNNEL_END_X;
  const endSpikes = makeSpikes(postW, curLevel, -300, H + 300, true, levelPRNG);
  segs.push({ x: TUNNEL_END_X, w: postW, top: -300, bot: H + 300, curTop: -300, curBot: H + 300, topSpikes: endSpikes.topSpikes, botSpikes: endSpikes.botSpikes, isOpen: true, moving: false });
  nextX = TUNNEL_END_X + postW;
}

function advanceToNextLevel() {
  const nextLvl = (levelJustCleared ? levelJustCleared + 1 : curLevel + 1);
  curLevel = nextLvl;
  saveProgress(curLevel, Math.max(highestLevel, curLevel), best);
  startLevel(curLevel);
  st = 'transition';
  transitionTimer = 0;
  hold = false;
  thrust = 0;
}

function resetGame() {
  curLevel = 1;
  cam = 0;
  startLevel(1);
}

function initConfetti() {
  confettis = [];
  const colors = ['#22c55e', '#facc15', '#38bdf8', '#f43f5e', '#a855f7', '#fb923c'];
  for (let i = 0; i < 75; i++) {
    confettis.push({
      x: rnd(10, W - 10),
      y: rnd(-80, H * 0.45),
      vx: rnd(-35, 35),
      vy: rnd(65, 160),
      size: rnd(4, 7),
      w: rnd(5, 9),
      rot: rnd(0, 6.28),
      vRot: rnd(-4, 4),
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }
}

function updateConfetti(dt) {
  for (const c of confettis) {
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    c.rot += c.vRot * dt;
    if (c.y > H + 20) {
      c.y = rnd(-20, -5);
      c.x = rnd(10, W - 10);
      c.vy = rnd(65, 160);
    }
  }
}

function drawConfetti() {
  for (const c of confettis) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.w / 2, -c.size / 2, c.w * Math.abs(Math.cos(c.rot)), c.size);
    ctx.restore();
  }
}

function die() {
  st = 'dead';
  isLevelIntro = false;
  carRollAngle = 0;
  deadAt = performance.now();
  hold = false;
  thrust = 0;
  playCrashSound();
  const progress = getLevelProgress();
  const curScore = Math.floor(progress * 100);
  const currentTotal = 100 * (curLevel - 1) + curScore;
  if (currentTotal > best) {
    best = currentTotal;
    saveProgress(curLevel, highestLevel, best);
  }
}

// 3-layer cartoon road platform with red deck edge and soft shadow
function drawRoadPlatform(startX, endX, roadTop, isFinish = false) {
  const w = endX - startX;
  if (w <= 0) return;
  const x = startX - cam;
  if (x + w < -60 || x > W + 60) return;

  const bandH = 36; // 36 px tall asphalt band
  const roadCenterY = roadTop + bandH / 2; // middle: roadTop + 18
  const roadBottom = roadTop + bandH; // roadTop + 36
  const trussBottom = roadBottom + 20;

  ctx.save();
  // Soft drop shadow under platform
  ctx.shadowColor = 'rgba(15, 23, 42, 0.45)';
  ctx.shadowBlur = 10;
  ctx.shadowOffsetY = 4;

  ctx.beginPath();
  ctx.moveTo(x - 20, roadTop - 4);
  ctx.lineTo(x + w, roadTop - 4);
  ctx.lineTo(x + w - 12, trussBottom + 2);
  ctx.lineTo(x - 20, trussBottom + 2);
  ctx.closePath();
  ctx.clip();

  // 1. Asphalt Road Surface (frames car in the middle of the road, 36px tall band)
  ctx.fillStyle = '#26282c';
  ctx.fillRect(x, roadTop, w, bandH);

  // 2. Upper Red Deck Edge / Barrier (symmetrical border)
  ctx.fillStyle = '#dc2626';
  ctx.fillRect(x, roadTop - 2, w, 3);
  ctx.fillStyle = '#f87171';
  ctx.fillRect(x, roadTop - 2, w, 1);

  // 3. Yellow Dashed Center Lane Markings (runs right through middle of road at wheel-hub height)
  ctx.fillStyle = '#fde047';
  const startDash = Math.floor(startX / 48) * 48;
  for (let wx = startDash; wx < endX + 48; wx += 48) {
    const dx = wx - cam;
    ctx.fillRect(dx, roadCenterY - 1.5, 22, 3);
  }

  // 4. Lower Red Deck Edge (front edge of the road, below tires at roadBottom - 2 = roadTop + 34)
  ctx.fillStyle = '#dc2626';
  ctx.fillRect(x, roadBottom - 2, w, 4);
  ctx.fillStyle = '#f87171';
  ctx.fillRect(x, roadBottom - 2, w, 1.2);

  // 5. Steel Truss structure underneath (below tires)
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(x, roadBottom + 2, w, 18);

  ctx.strokeStyle = '#475569';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  const startTruss = Math.floor(startX / 40) * 40;
  for (let wx = startTruss; wx < endX + 40; wx += 40) {
    const p1 = wx - cam, p2 = wx + 40 - cam;
    ctx.moveTo(p1, roadBottom + 3); ctx.lineTo(p2, roadBottom + 19);
    ctx.moveTo(p2, roadBottom + 3); ctx.lineTo(p1, roadBottom + 19);
  }
  ctx.stroke();

  ctx.restore();

  if (isFinish) {
    ctx.save();
    const cfg = curConfig;
    const finishLineWx = startX + (endX - startX) * FINISH_LINE_AT;
    const flX = finishLineWx - cam;

    // 1. Checkered Finish Line Strip across the asphalt road
    if (flX > -40 && flX < W + 40) {
      const stripW = 16;
      const cols = 2;
      const rows = 4;
      const cellW = stripW / cols;
      const cellH = bandH / rows;

      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
      ctx.shadowBlur = 4;
      for (let c = 0; c < cols; c++) {
        for (let r = 0; r < rows; r++) {
          ctx.fillStyle = ((c + r) % 2 === 0) ? '#ffffff' : '#0f172a';
          ctx.fillRect(flX - stripW / 2 + c * cellW, roadTop + r * cellH, cellW, cellH);
        }
      }
      ctx.fillStyle = '#facc15';
      ctx.fillRect(flX - stripW / 2 - 1.5, roadTop, 1.5, bandH);
      ctx.fillRect(flX + stripW / 2, roadTop, 1.5, bandH);
      ctx.restore();

      // 2. Two Finish Flags placed at about 85% of the road length
      for (const side of [-1, 1]) {
        const poleX = flX + side * 15;
        const poleBaseY = roadTop + 2;
        const poleTopY = roadTop - 50;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
        ctx.beginPath();
        ctx.ellipse(poleX + 1, poleBaseY, 5, 2, 0, 0, 6.28);
        ctx.fill();

        // Silver pole
        ctx.fillStyle = '#cbd5e1';
        ctx.fillRect(poleX - 1.5, poleTopY, 3, poleBaseY - poleTopY);

        // Gold finial sphere
        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.arc(poleX, poleTopY, 4, 0, 6.28);
        ctx.fill();

        // Waving checkered flag
        const flagW = 22 * side;
        const flagTop = poleTopY + 2;
        const flagH = 22;
        const fRows = 3, fCols = 3;
        const fSqW = flagW / fCols;
        const fSqH = flagH / fRows;
        for (let fc = 0; fc < fCols; fc++) {
          for (let fr = 0; fr < fRows; fr++) {
            const wave = Math.sin(fc * 0.8 + gameTime * 6) * 2;
            ctx.fillStyle = ((fc + fr) % 2 === 0) ? '#ffffff' : '#0f172a';
            ctx.fillRect(poleX + fc * fSqW, flagTop + fr * fSqH + wave, fSqW, fSqH);
          }
        }
      }
    }

    // 3. Safety rail at the end of the road
    const railScreenX = endX - cam;
    if (railScreenX > -40 && railScreenX < W + 40) {
      const rx = railScreenX - 8;
      // Heavy steel posts
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(rx - 3, roadTop - 26, 6, bandH + 26);
      ctx.fillRect(rx + 4, roadTop - 26, 6, bandH + 26);

      // Crash barrier body
      const barrierW = 16;
      ctx.fillStyle = '#475569';
      ctx.fillRect(rx - 4, roadTop - 22, barrierW, 14);

      // Red and white hazard warning stripes
      ctx.save();
      ctx.beginPath();
      ctx.rect(rx - 4, roadTop - 22, barrierW, 14);
      ctx.clip();
      for (let sx = -12; sx < barrierW + 12; sx += 6) {
        ctx.fillStyle = (Math.floor(sx / 6) % 2 === 0) ? '#ef4444' : '#ffffff';
        ctx.beginPath();
        ctx.moveTo(rx - 4 + sx, roadTop - 8);
        ctx.lineTo(rx - 4 + sx + 6, roadTop - 8);
        ctx.lineTo(rx - 4 + sx + 12, roadTop - 22);
        ctx.lineTo(rx - 4 + sx + 6, roadTop - 22);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      // Red reflector caps
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(rx - 4, roadTop - 28, 7, 3);
      ctx.fillRect(rx + 3, roadTop - 28, 7, 3);
    }

    // 4. Small man in black suit cheering after the finish line
    const manWx = finishLineWx + 30;
    const manX = manWx - cam;
    if (manX > -30 && manX < W + 30) {
      const footY = roadTop + 24; // Standing on asphalt surface
      // Shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
      ctx.beginPath();
      ctx.ellipse(manX, footY + 1, 9, 3, 0, 0, 6.28);
      ctx.fill();
      // Legs (black trousers)
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(manX - 5, footY - 14, 4, 14);
      ctx.fillRect(manX + 1, footY - 14, 4, 14);
      // Torso / Suit jacket (black)
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(manX - 7, footY - 30, 14, 17);
      // White shirt collar & red tie
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(manX - 3, footY - 30);
      ctx.lineTo(manX + 3, footY - 30);
      ctx.lineTo(manX, footY - 22);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#dc2626';
      ctx.fillRect(manX - 1, footY - 28, 2, 8);
      // Arms cheering up
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(manX - 9, footY - 36, 3, 16);
      ctx.fillRect(manX + 6, footY - 36, 3, 16);
      // Head
      ctx.fillStyle = '#fbcfe8';
      ctx.beginPath();
      ctx.arc(manX, footY - 36, 5.5, 0, 6.28);
      ctx.fill();
      // Black hair
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(manX, footY - 38, 5.5, 3.14, 6.28);
      ctx.fill();
      // Sunglasses
      ctx.fillStyle = '#000000';
      ctx.fillRect(manX - 4, footY - 37, 8, 2.5);
    }
    ctx.restore();
  }
}

// Thin studded rails with rivets, end caps and soft shadow for high contrast on bright sky
function drawWall(s, x) {
  const cfg = curConfig;
  const w = s.w + 1;
  const top = (s.curTop !== undefined) ? s.curTop : s.top;
  const bot = (s.curBot !== undefined) ? s.curBot : s.bot;
  drawRailSegment(x, top - 28, w, true, cfg);
  drawRailSegment(x, bot + 18, w, false, cfg);
}

function drawRailSegment(x, y, w, isCeiling, cfg) {
  ctx.save();
  // Soft shadow so rails stand out clearly against bright sky picture
  ctx.shadowColor = 'rgba(15, 23, 42, 0.45)';
  ctx.shadowBlur = 6;
  ctx.shadowOffsetY = isCeiling ? -2 : 3;

  const railGrad = ctx.createLinearGradient(0, y, 0, y + 10);
  railGrad.addColorStop(0, '#ffffff');
  railGrad.addColorStop(0.25, cfg.railColor || '#64748b');
  railGrad.addColorStop(0.8, cfg.railColor || '#64748b');
  railGrad.addColorStop(1, '#0f172a');
  ctx.fillStyle = railGrad;
  ctx.fillRect(x, y, w, 10);

  ctx.shadowColor = 'transparent';

  // Highlight and dark outlines
  ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
  ctx.fillRect(x, y, w, 1.5);
  ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
  ctx.fillRect(x, y + 8.5, w, 1.5);

  ctx.fillStyle = '#0f172a';
  ctx.fillRect(x - 1, y - 1, 3, 12);
  ctx.fillRect(x + w - 2, y - 1, 3, 12);

  const centerY = y + 5;
  const startRivet = Math.floor(x / 16) * 16;
  for (let rx = startRivet; rx <= x + w + 16; rx += 16) {
    if (rx < x + 3 || rx > x + w - 3) continue;
    ctx.fillStyle = '#0f172a';
    ctx.beginPath(); ctx.arc(rx, centerY, 2.2, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(rx - 0.6, centerY - 0.6, 1, 0, 6.28); ctx.fill();
  }
  ctx.restore();
}

function drawVerticalRailConnector(x, y1, y2, cfg) {
  const minY = Math.min(y1, y2);
  const maxY = Math.max(y1, y2) + 10;
  const h = maxY - minY;
  if (h <= 10) return;

  ctx.save();
  ctx.shadowColor = 'rgba(15, 23, 42, 0.45)';
  ctx.shadowBlur = 6;
  ctx.shadowOffsetX = 1;
  ctx.shadowOffsetY = 1;

  const railGrad = ctx.createLinearGradient(x - 5, 0, x + 5, 0);
  railGrad.addColorStop(0, '#ffffff');
  railGrad.addColorStop(0.25, cfg.railColor || '#64748b');
  railGrad.addColorStop(0.8, cfg.railColor || '#64748b');
  railGrad.addColorStop(1, '#0f172a');
  ctx.fillStyle = railGrad;
  ctx.fillRect(x - 5, minY, 10, h);

  ctx.shadowColor = 'transparent';

  // Highlight and dark outlines
  ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
  ctx.fillRect(x - 5, minY, 1.5, h);
  ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
  ctx.fillRect(x + 3.5, minY, 1.5, h);

  // End caps
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(x - 6, minY - 1, 12, 3);
  ctx.fillRect(x - 6, maxY - 2, 12, 3);

  // Rivets spaced every 16px along the vertical connector
  const centerX = x;
  const startRivetY = Math.floor(minY / 16) * 16;
  for (let ry = startRivetY; ry <= maxY + 16; ry += 16) {
    if (ry < minY + 4 || ry > maxY - 4) continue;
    ctx.fillStyle = '#0f172a';
    ctx.beginPath(); ctx.arc(centerX, ry, 2.2, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(centerX - 0.6, ry - 0.6, 1, 0, 6.28); ctx.fill();
  }
  ctx.restore();
}

function drawSpike(x, baseY, isTop, sp) {
  if (!sp || !sp.h || sp.h <= 0) return;
  const key = `${sp.size}_${isTop ? 'top' : 'bot'}`;
  const spr = spikeCanvases[key];
  if (spr) {
    ctx.save();
    // Soft shadow behind spike so it pops from bright sky picture
    ctx.shadowColor = 'rgba(15, 23, 42, 0.35)';
    ctx.shadowBlur = 4;
    ctx.shadowOffsetY = isTop ? 2 : -2;
    if (isTop) {
      ctx.drawImage(spr, x + 6 - 18, baseY - 2);
    } else {
      ctx.drawImage(spr, x + 6 - 18, baseY - 46);
    }
    ctx.restore();
  }
}

// High-performance sports car wheel with realistic rubber tyre, stationary brake caliper & rotating chrome twin-spoke alloy rim
function drawSportsWheel(cx, cy, r, angle) {
  ctx.save();
  ctx.translate(cx, cy);

  // 1. Solid Tyre (Deep matte black rubber with realistic sidewall contour)
  ctx.fillStyle = '#0f1115';
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  // Tyre outer edge definition
  ctx.strokeStyle = '#090a0d';
  ctx.lineWidth = Math.max(1, r * 0.05);
  ctx.beginPath();
  ctx.arc(0, 0, r - ctx.lineWidth / 2, 0, Math.PI * 2);
  ctx.stroke();

  // Subtle tyre sidewall highlight band
  ctx.strokeStyle = '#262a33';
  ctx.lineWidth = Math.max(1, r * 0.08);
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.88, 0, Math.PI * 2);
  ctx.stroke();

  // Inner tyre bead line
  ctx.strokeStyle = '#090a0d';
  ctx.lineWidth = Math.max(0.8, r * 0.04);
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.77, 0, Math.PI * 2);
  ctx.stroke();

  // 2. Wheel Cavity / Rim Barrel (Dark interior background behind spokes)
  ctx.fillStyle = '#14161a';
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.73, 0, Math.PI * 2);
  ctx.fill();

  // 3. Stationary Brake Assembly (Realistic: Caliper and Rotor do NOT spin with wheel)
  // Brake disc rotor (brushed steel)
  ctx.fillStyle = '#64748b';
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.56, 0, Math.PI * 2);
  ctx.fill();

  // Brake rotor groove ring
  ctx.strokeStyle = '#475569';
  ctx.lineWidth = Math.max(0.6, r * 0.035);
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.44, 0, Math.PI * 2);
  ctx.stroke();

  // High-performance Red Sports Brake Caliper (stationary at top quadrant)
  ctx.save();
  ctx.rotate(-0.58);
  ctx.fillStyle = '#dc2626';
  ctx.beginPath();
  const calW = r * 0.22;
  const calH = r * 0.38;
  const calX = r * 0.36;
  const calY = -calH / 2;
  if (ctx.roundRect) {
    ctx.roundRect(calX, calY, calW, calH, r * 0.05);
  } else {
    ctx.rect(calX, calY, calW, calH);
  }
  ctx.fill();
  // Caliper highlight bolt
  ctx.fillStyle = '#f8fafc';
  ctx.beginPath();
  ctx.arc(calX + calW / 2, 0, Math.max(0.8, r * 0.035), 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 4. Rotating Alloy Rim Lip & Spokes
  ctx.save();
  ctx.rotate(angle);

  // Outer chrome rim lip
  ctx.strokeStyle = '#f1f5f9';
  ctx.lineWidth = Math.max(1.2, r * 0.065);
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.71, 0, Math.PI * 2);
  ctx.stroke();

  // Inner chrome bevel
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = Math.max(0.8, r * 0.03);
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.67, 0, Math.PI * 2);
  ctx.stroke();

  // 5 Twin-Spoke High Performance Alloy Wheels (10 blades)
  const numPairs = 5;
  const innerR = r * 0.19;
  const outerR = r * 0.67;
  const spokeWidth = Math.max(1.2, r * 0.055);
  const splitOffset = 0.13;

  ctx.lineWidth = spokeWidth;
  ctx.lineCap = 'round';

  for (let i = 0; i < numPairs; i++) {
    const baseAng = (i * Math.PI * 2) / numPairs;

    for (const sign of [-1, 1]) {
      const spkAng = baseAng + sign * splitOffset;
      const cosA = Math.cos(spkAng);
      const sinA = Math.sin(spkAng);

      // Shaded metallic side
      ctx.strokeStyle = '#64748b';
      ctx.beginPath();
      ctx.moveTo(cosA * innerR + sign * 0.4, sinA * innerR);
      ctx.lineTo(cosA * outerR + sign * 0.4, sinA * outerR);
      ctx.stroke();

      // Bright polished chrome face
      ctx.strokeStyle = '#f8fafc';
      ctx.beginPath();
      ctx.moveTo(cosA * innerR, sinA * innerR);
      ctx.lineTo(cosA * outerR, sinA * outerR);
      ctx.stroke();
    }
  }

  // 5. Central Wheel Hub & Lug Nuts
  // Chrome outer hub
  ctx.fillStyle = '#cbd5e1';
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.22, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#475569';
  ctx.lineWidth = Math.max(0.6, r * 0.03);
  ctx.stroke();

  // Center cap badge
  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.13, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#f8fafc';
  ctx.beginPath();
  ctx.arc(0, 0, Math.max(0.7, r * 0.04), 0, Math.PI * 2);
  ctx.fill();

  // 5 Chrome Lug Nuts
  ctx.fillStyle = '#f8fafc';
  for (let l = 0; l < 5; l++) {
    const lugAng = (l * Math.PI * 2) / 5 + 0.31;
    const lx = Math.cos(lugAng) * (r * 0.175);
    const ly = Math.sin(lugAng) * (r * 0.175);
    ctx.beginPath();
    ctx.arc(lx, ly, Math.max(0.6, r * 0.026), 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore(); // Restore wheel rotation
  ctx.restore(); // Restore wheel translation
}
