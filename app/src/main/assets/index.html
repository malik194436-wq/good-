<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sky Car</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@700&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@700&display=swap');
:root{--bg:#f0f3f8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1c22;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1c22;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block;aspect-ratio:9/16;height:auto;width:min(100%,calc((100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * 9 / 16));touch-action:none}
</style>
</head>
<body>
<canvas id="c" width="360" height="640"></canvas>
<script>
(()=>{
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), W = 360, H = 640;
const rnd = (a, b) => a + Math.random() * (b - a);

// ==========================================
// TUNING CONSTANTS (Scale, Speed, Physics)
// ==========================================
// 1. Car Scale & Position
const CAR_SCALE = 2.0;
const CAR_X = 140;
const CX = CAR_X; // alias for backwards compatibility

// Hitbox dimensions scaled by CAR_SCALE (car length ~160 px, ~44% screen width)
const HITBOX_HALF_W = 26 * CAR_SCALE;
const HITBOX_TOP_OFFSET = 9 * CAR_SCALE;
const HITBOX_BOT_OFFSET = 11 * CAR_SCALE;

// 2. Vertical movement constants (gentle, floaty movement)
const LIFT_ACCEL = 360;
const GRAVITY = 240;
const MAX_UP_SPEED = 120;
const MAX_DOWN_SPEED = 110;

// 3. Scroll speed constants
const START_SPEED = 100;
const MAX_SPEED = 220;
const SPEED_DISTANCE_DIVISOR = 150;

// 4. Level & Platform Layout constants
const ROAD_TOP = 400; // Platform top surface at y = 400
const CAR_REST_Y = ROAD_TOP + 24 - 16 * CAR_SCALE; // Center y at rest on road (385.6 px, wheels touch asphalt)
const START_ROAD_START = -50, START_ROAD_END = 470; // 520 px long
const LEVEL_LENGTH = 1000;
const TUNNEL_START_X = 650;
const TUNNEL_END_X = TUNNEL_START_X + LEVEL_LENGTH; // 1650
const FINISH_OPEN_GAP = 300;
const FINISH_ROAD_X = TUNNEL_END_X + FINISH_OPEN_GAP; // 1950
const FINISH_ROAD_LEN = 520;
const FINISH_ROAD_END = FINISH_ROAD_X + FINISH_ROAD_LEN; // 2470

const RETRY_FROM_LEVEL_START = true;

// Deterministic PRNG using integer hashing and Mulberry32
function hashInt(n) {
  n = ((n >> 16) ^ n) * 0x45d9f3b;
  n = ((n >> 16) ^ n) * 0x45d9f3b;
  n = (n >> 16) ^ n;
  return n >>> 0;
}

function mulberry32(a) {
  return function() {
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Lists for Level Name Generation (Adjective + Noun, >= 30 words each)
const ADJECTIVES = [
  'Amber', 'Radiant', 'Crystal', 'Velvet', 'Azure', 'Solar', 'Golden', 'Emerald',
  'Mystic', 'Cobalt', 'Silver', 'Crimson', 'Lunar', 'Opal', 'Coral', 'Jade',
  'Neon', 'Zephyr', 'Apex', 'Prism', 'Astral', 'Twilight', 'Aurora', 'Echo',
  'Frost', 'Zenith', 'Horizon', 'Mirage', 'Stellar', 'Nova', 'Ruby', 'Topaz',
  'Quartz', 'Sapphire', 'Copper', 'Chrome', 'Falcon', 'Pulse', 'Vortex', 'Quantum',
  'Dynamo', 'Aero', 'Celestial', 'Prismatic', 'Obsidian'
];

const NOUNS = [
  'Harbor', 'Citadel', 'Valley', 'Canyon', 'Peak', 'Sanctuary', 'Spire', 'Ridge',
  'Oasis', 'Bastion', 'Plateau', 'Haven', 'Atoll', 'Bay', 'Passage', 'Terrace',
  'Ascent', 'Summit', 'Dune', 'Glade', 'Lagoon', 'Vault', 'Gateway', 'Heights',
  'Cavern', 'Outpost', 'Station', 'Skyline', 'Overlook', 'Enclave', 'Domain', 'Realm',
  'Bluff', 'Shore', 'Reef', 'Matrix', 'Crucible', 'Meridian', 'Sector', 'Nexus',
  'Pinnacle', 'Sanctum', 'Wilds', 'Crest', 'Archway'
];

const BG_LAYER_TYPES = [
  'clouds', 'rolling hills', 'mountains', 'city skyline', 'floating islands',
  'sun rays', 'waves', 'forest silhouettes', 'balloons', 'windmills',
  'geometric shapes', 'stars and moon'
];

const PARTICLE_TYPES = ['dust', 'petals', 'snow', 'bubbles', 'sparkles', 'leaves'];

const SHAPE_TYPES = [
  'cone', 'needle', 'fat stud', 'double-cone', 'faceted crystal',
  'curved thorn', 'fork', 'saw tooth', 'bullet', 'flame-shaped'
];

const RAIL_STYLES = ['rivets', 'bolts', 'small gears', 'chain links', 'dots'];
const GLOSS_STYLES = ['metal', 'glass', 'matte'];

// Generate procedural visual config for any level
function generateLevelConfig(level, prev) {
  // Levels 1, 2, 3 use classic themes from video
  if (level === 1) {
    return {
      level: 1,
      name: 'Steel Foundry',
      H: 215,
      bgTop: 'hsl(35, 36%, 94%)',
      bgBot: 'hsl(15, 30%, 87%)',
      bgLayers: ['clouds', 'city skyline'],
      particleType: 'dust',
      spikeColor: { h: 215, s: 15, l: 65 }, // steel silver
      shapeType: 'cone',
      width: 12,
      heightRatio: 2.0,
      tipSharpness: 'medium',
      collarRing: true,
      bodyCurve: 'straight',
      bend: 0,
      facets: 0,
      railStyle: 'rivets',
      railColor: '#7a828e',
      glossStyle: 'metal',
      accentColor: '#5a6270',
      glowColor: '#7a828e'
    };
  }
  if (level === 2) {
    return {
      level: 2,
      name: 'Toxic Jungle',
      H: 135,
      bgTop: 'hsl(315, 35%, 95%)',
      bgBot: 'hsl(295, 30%, 88%)',
      bgLayers: ['rolling hills', 'waves'],
      particleType: 'petals',
      spikeColor: { h: 135, s: 80, l: 46 }, // glossy green
      shapeType: 'cone',
      width: 12,
      heightRatio: 2.2,
      tipSharpness: 'sharp',
      collarRing: true,
      bodyCurve: 'straight',
      bend: 0,
      facets: 0,
      railStyle: 'bolts',
      railColor: '#2b6e38',
      glossStyle: 'metal',
      accentColor: 'hsl(135, 80%, 45%)',
      glowColor: 'hsl(135, 85%, 45%)'
    };
  }
  if (level === 3) {
    return {
      level: 3,
      name: 'Molten Caldera',
      H: 355,
      bgTop: 'hsl(175, 38%, 94%)',
      bgBot: 'hsl(155, 32%, 87%)',
      bgLayers: ['mountains', 'sun rays'],
      particleType: 'sparkles',
      spikeColor: { h: 355, s: 85, l: 48 }, // glossy red
      shapeType: 'cone',
      width: 12,
      heightRatio: 2.4,
      tipSharpness: 'sharp',
      collarRing: true,
      bodyCurve: 'straight',
      bend: 0,
      facets: 0,
      railStyle: 'rivets',
      railColor: '#8a2020',
      glossStyle: 'metal',
      accentColor: 'hsl(355, 80%, 50%)',
      glowColor: 'hsl(355, 85%, 45%)'
    };
  }

  // Levels >= 4: procedurally generated from seed, guaranteed to differ from previous level
  for (let salt = 0; salt < 60; salt++) {
    const seed = hashInt(level * 10007 + salt * 9973);
    const rng = mulberry32(seed);
    const pick = arr => arr[Math.floor(rng() * arr.length)];
    const range = (a, b) => a + rng() * (b - a);

    let H = Math.round((level * 137.508 + salt * 43) % 360);
    if (H < 0) H += 360;

    let hueDiff = prev ? Math.abs(H - prev.H) : 90;
    if (hueDiff > 180) hueDiff = 360 - hueDiff;
    if (hueDiff < 45 && salt < 50) continue;

    const satTop = Math.round(range(30, 45));
    const litTop = Math.round(range(92, 96));
    const satBot = Math.round(range(25, 40));
    const litBot = Math.round(range(84, 90));

    const bgTop = `hsl(${(H + 180) % 360}, ${satTop}%, ${litTop}%)`;
    const bgBot = `hsl(${(H + 160) % 360}, ${satBot}%, ${litBot}%)`;

    // 2 or 3 soft parallax layers
    const numLayers = rng() > 0.4 ? 3 : 2;
    const bgLayers = [];
    const pool = [...BG_LAYER_TYPES];
    for (let k = 0; k < numLayers; k++) {
      const idx = Math.floor(rng() * pool.length);
      bgLayers.push(pool.splice(idx, 1)[0]);
    }

    const particleType = pick(PARTICLE_TYPES);
    const shapeType = pick(SHAPE_TYPES);
    const width = Math.round(range(9, 16));
    const heightRatio = +(range(1.4, 3.2)).toFixed(2);
    const tipSharpness = pick(['sharp', 'medium', 'rounded']);
    const collarRing = rng() > 0.4;
    const bodyCurve = pick(['straight', 'bulged', 'concave']);
    const bend = +(range(-0.4, 0.4)).toFixed(2);
    const facets = pick([0, 3, 4, 6]);
    const railStyle = pick(RAIL_STYLES);
    const glossStyle = pick(GLOSS_STYLES);

    const spikeSat = Math.round(range(70, 90));
    const spikeLit = Math.round(range(42, 55));
    const spikeColor = { h: H, s: spikeSat, l: spikeLit };

    const railHue = H;
    const railSat = Math.round(range(15, 35));
    const railLit = Math.round(range(45, 65));
    const railColor = `hsl(${railHue}, ${railSat}%, ${railLit}%)`;

    const adj = pick(ADJECTIVES);
    const noun = pick(NOUNS);
    const name = `${adj} ${noun}`;

    const cfg = {
      level,
      name,
      H,
      bgTop,
      bgBot,
      bgLayers,
      particleType,
      spikeColor,
      shapeType,
      width,
      heightRatio,
      tipSharpness,
      collarRing,
      bodyCurve,
      bend,
      facets,
      railStyle,
      railColor,
      glossStyle,
      accentColor: `hsl(${H}, 80%, 50%)`,
      glowColor: `hsl(${H}, 85%, 45%)`
    };

    if (prev) {
      let diffs = 0;
      if (cfg.shapeType !== prev.shapeType) diffs++;
      if (Math.abs(cfg.width - prev.width) >= 2) diffs++;
      if (Math.abs(cfg.heightRatio - prev.heightRatio) >= 0.3) diffs++;
      if (cfg.railStyle !== prev.railStyle) diffs++;
      if (cfg.glossStyle !== prev.glossStyle) diffs++;
      if (cfg.particleType !== prev.particleType) diffs++;
      if (cfg.bgLayers[0] !== prev.bgLayers[0]) diffs++;

      if (diffs < 3 && salt < 50) continue;
    }

    return cfg;
  }
}

// Config cache: deterministic across retries
const levelConfigCache = new Map();
function getLevelConfig(level) {
  if (levelConfigCache.has(level)) return levelConfigCache.get(level);
  const prev = level > 1 ? getLevelConfig(level - 1) : null;
  const cfg = generateLevelConfig(level, prev);
  levelConfigCache.set(level, cfg);
  return cfg;
}

// Offscreen Canvases for fast pre-rendered rendering (60 FPS on mobile)
let curConfig = getLevelConfig(1);
let spikeCanvases = {};
let bgGradientCanvas = null;
let parallaxCanvases = [];

function renderSpikeToCanvas(canvas, isTop, h, cfg) {
  const sCtx = canvas.getContext('2d');
  sCtx.clearRect(0, 0, canvas.width, canvas.height);

  const cx = 18;
  const baseY = isTop ? 2 : 46;
  const dir = isTop ? 1 : -1;
  const tipY = baseY + dir * h;
  const w = Math.min(16, Math.max(9, cfg.width));
  const bendOffset = (cfg.bend || 0) * (h * 0.22);
  const tipX = cx + bendOffset;

  const H = cfg.spikeColor.h, S = cfg.spikeColor.s, L = cfg.spikeColor.l;
  const colBase = `hsl(${H}, ${S}%, ${L}%)`;
  const colLight = cfg.glossStyle === 'glass'
    ? `hsla(${H}, ${Math.min(100, S + 10)}%, ${Math.min(95, L + 28)}%, 0.75)`
    : `hsl(${H}, ${Math.max(10, S - 20)}%, ${Math.min(95, L + (cfg.glossStyle === 'metal' ? 30 : 15))}%)`;
  const colDark = `hsl(${H}, ${Math.min(100, S + 10)}%, ${Math.max(14, L - 20)}%)`;
  const outlineColor = 'rgba(25, 30, 42, 0.95)';

  sCtx.save();

  // 1. Draw shape silhouette and 3D shading
  const shape = cfg.shapeType;
  if (shape === 'needle') {
    const nw = w * 0.65;
    // Left facet
    sCtx.fillStyle = colLight;
    sCtx.beginPath();
    sCtx.moveTo(cx - nw / 2, baseY);
    sCtx.lineTo(tipX, tipY);
    sCtx.lineTo(cx, baseY);
    sCtx.closePath();
    sCtx.fill();
    // Right facet
    sCtx.fillStyle = colDark;
    sCtx.beginPath();
    sCtx.moveTo(cx, baseY);
    sCtx.lineTo(tipX, tipY);
    sCtx.lineTo(cx + nw / 2, baseY);
    sCtx.closePath();
    sCtx.fill();
    // Outline
    sCtx.strokeStyle = outlineColor;
    sCtx.lineWidth = 1;
    sCtx.beginPath();
    sCtx.moveTo(cx - nw / 2, baseY);
    sCtx.lineTo(tipX, tipY);
    sCtx.lineTo(cx + nw / 2, baseY);
    sCtx.stroke();

  } else if (shape === 'fat stud') {
    const fw = w * 1.25;
    const midY = baseY + dir * h * 0.45;
    // Base block
    sCtx.fillStyle = colBase;
    sCtx.beginPath();
    sCtx.moveTo(cx - fw / 2, baseY);
    sCtx.lineTo(cx - fw * 0.38, midY);
    sCtx.lineTo(tipX, tipY);
    sCtx.lineTo(cx + fw * 0.38, midY);
    sCtx.lineTo(cx + fw / 2, baseY);
    sCtx.closePath();
    sCtx.fill();
    // Left facet highlight
    sCtx.fillStyle = colLight;
    sCtx.beginPath();
    sCtx.moveTo(cx - fw / 2, baseY);
    sCtx.lineTo(cx - fw * 0.38, midY);
    sCtx.lineTo(tipX, tipY);
    sCtx.lineTo(cx, baseY);
    sCtx.closePath();
    sCtx.fill();
    // Right facet shadow
    sCtx.fillStyle = colDark;
    sCtx.beginPath();
    sCtx.moveTo(cx, baseY);
    sCtx.lineTo(tipX, tipY);
    sCtx.lineTo(cx + fw * 0.38, midY);
    sCtx.lineTo(cx + fw / 2, baseY);
    sCtx.closePath();
    sCtx.fill();
    // Outline
    sCtx.strokeStyle = outlineColor;
    sCtx.lineWidth = 1;
    sCtx.stroke();

  } else if (shape === 'double-cone') {
    const midY = baseY + dir * h * 0.4;
    const mw = w * 1.15;
    sCtx.fillStyle = colLight;
    sCtx.beginPath();
    sCtx.moveTo(cx - w / 2, baseY);
    sCtx.lineTo(cx - mw / 2, midY);
    sCtx.lineTo(tipX, tipY);
    sCtx.lineTo(cx, baseY);
    sCtx.closePath();
    sCtx.fill();
    sCtx.fillStyle = colDark;
    sCtx.beginPath();
    sCtx.moveTo(cx, baseY);
    sCtx.lineTo(tipX, tipY);
    sCtx.lineTo(cx + mw / 2, midY);
    sCtx.lineTo(cx + w / 2, baseY);
    sCtx.closePath();
    sCtx.fill();
    sCtx.strokeStyle = outlineColor;
    sCtx.lineWidth = 1;
    sCtx.beginPath();
    sCtx.moveTo(cx - w / 2, baseY);
    sCtx.lineTo(cx - mw / 2, midY);
    sCtx.lineTo(tipX, tipY);
    sCtx.lineTo(cx + mw / 2, midY);
    sCtx.lineTo(cx + w / 2, baseY);
    sCtx.stroke();

  } else if (shape === 'faceted crystal') {
    const midY = baseY + dir * h * 0.55;
    // Left facet
    sCtx.fillStyle = colLight;
    sCtx.beginPath();
    sCtx.moveTo(cx - w / 2, baseY);
    sCtx.lineTo(cx - w * 0.3, midY);
    sCtx.lineTo(tipX, tipY);
    sCtx.lineTo(cx, baseY + dir * h * 0.35);
    sCtx.closePath();
    sCtx.fill();
    // Right facet
    sCtx.fillStyle = colDark;
    sCtx.beginPath();
    sCtx.moveTo(cx, baseY + dir * h * 0.35);
    sCtx.lineTo(tipX, tipY);
    sCtx.lineTo(cx + w * 0.3, midY);
    sCtx.lineTo(cx + w / 2, baseY);
    sCtx.closePath();
    sCtx.fill();
    // Bottom facet
    sCtx.fillStyle = colBase;
    sCtx.beginPath();
    sCtx.moveTo(cx - w / 2, baseY);
    sCtx.lineTo(cx, baseY + dir * h * 0.35);
    sCtx.lineTo(cx + w / 2, baseY);
    sCtx.closePath();
    sCtx.fill();
    // Facet lines
    sCtx.strokeStyle = outlineColor;
    sCtx.lineWidth = 1;
    sCtx.beginPath();
    sCtx.moveTo(cx - w / 2, baseY);
    sCtx.lineTo(cx - w * 0.3, midY);
    sCtx.lineTo(tipX, tipY);
    sCtx.lineTo(cx + w * 0.3, midY);
    sCtx.lineTo(cx + w / 2, baseY);
    sCtx.moveTo(cx, baseY + dir * h * 0.35);
    sCtx.lineTo(tipX, tipY);
    sCtx.moveTo(cx - w / 2, baseY);
    sCtx.lineTo(cx, baseY + dir * h * 0.35);
    sCtx.lineTo(cx + w / 2, baseY);
    sCtx.stroke();

  } else if (shape === 'curved thorn') {
    const bendSign = cfg.bend >= 0 ? 1 : -1;
    const curveOff = bendSign * 6;
    sCtx.fillStyle = colBase;
    sCtx.beginPath();
    sCtx.moveTo(cx - w / 2, baseY);
    sCtx.quadraticCurveTo(cx - w * 0.2 + curveOff, baseY + dir * h * 0.5, tipX, tipY);
    sCtx.quadraticCurveTo(cx + w * 0.4 + curveOff, baseY + dir * h * 0.5, cx + w / 2, baseY);
    sCtx.closePath();
    sCtx.fill();
    // Inner highlight ridge
    sCtx.strokeStyle = colLight;
    sCtx.lineWidth = 1.8;
    sCtx.beginPath();
    sCtx.moveTo(cx - w * 0.2, baseY);
    sCtx.quadraticCurveTo(cx + curveOff * 0.5, baseY + dir * h * 0.5, tipX, tipY);
    sCtx.stroke();
    // Outline
    sCtx.strokeStyle = outlineColor;
    sCtx.lineWidth = 1;
    sCtx.beginPath();
    sCtx.moveTo(cx - w / 2, baseY);
    sCtx.quadraticCurveTo(cx - w * 0.2 + curveOff, baseY + dir * h * 0.5, tipX, tipY);
    sCtx.quadraticCurveTo(cx + w * 0.4 + curveOff, baseY + dir * h * 0.5, cx + w / 2, baseY);
    sCtx.stroke();

  } else if (shape === 'fork') {
    const forkBaseY = baseY + dir * h * 0.35;
    // Solid base
    sCtx.fillStyle = colBase;
    sCtx.fillRect(cx - w / 2, isTop ? baseY : forkBaseY, w, Math.abs(forkBaseY - baseY));
    // 2 Prongs
    sCtx.fillStyle = colLight;
    sCtx.beginPath();
    sCtx.moveTo(cx - w * 0.45, forkBaseY);
    sCtx.lineTo(cx - w * 0.25, tipY);
    sCtx.lineTo(cx - w * 0.05, forkBaseY);
    sCtx.closePath();
    sCtx.fill();
    sCtx.fillStyle = colDark;
    sCtx.beginPath();
    sCtx.moveTo(cx + w * 0.05, forkBaseY);
    sCtx.lineTo(cx + w * 0.25, tipY);
    sCtx.lineTo(cx + w * 0.45, forkBaseY);
    sCtx.closePath();
    sCtx.fill();
    // Outline
    sCtx.strokeStyle = outlineColor;
    sCtx.lineWidth = 1;
    sCtx.beginPath();
    sCtx.moveTo(cx - w / 2, baseY);
    sCtx.lineTo(cx - w / 2, forkBaseY);
    sCtx.lineTo(cx - w * 0.25, tipY);
    sCtx.lineTo(cx, forkBaseY + dir * 2);
    sCtx.lineTo(cx + w * 0.25, tipY);
    sCtx.lineTo(cx + w / 2, forkBaseY);
    sCtx.lineTo(cx + w / 2, baseY);
    sCtx.stroke();

  } else if (shape === 'saw tooth') {
    // Asymmetric saw tooth / shark fin
    sCtx.fillStyle = colLight;
    sCtx.beginPath();
    sCtx.moveTo(cx - w * 0.4, baseY);
    sCtx.lineTo(tipX, tipY);
    sCtx.lineTo(cx, baseY);
    sCtx.closePath();
    sCtx.fill();
    sCtx.fillStyle = colDark;
    sCtx.beginPath();
    sCtx.moveTo(cx, baseY);
    sCtx.lineTo(tipX, tipY);
    sCtx.quadraticCurveTo(cx + w * 0.3, baseY + dir * h * 0.4, cx + w * 0.45, baseY);
    sCtx.closePath();
    sCtx.fill();
    sCtx.strokeStyle = outlineColor;
    sCtx.lineWidth = 1;
    sCtx.beginPath();
    sCtx.moveTo(cx - w * 0.4, baseY);
    sCtx.lineTo(tipX, tipY);
    sCtx.quadraticCurveTo(cx + w * 0.3, baseY + dir * h * 0.4, cx + w * 0.45, baseY);
    sCtx.stroke();

  } else if (shape === 'bullet') {
    const domeBaseY = baseY + dir * h * 0.55;
    sCtx.fillStyle = colLight;
    sCtx.beginPath();
    sCtx.moveTo(cx - w / 2, baseY);
    sCtx.lineTo(cx - w / 2, domeBaseY);
    sCtx.quadraticCurveTo(cx - w * 0.2, tipY, tipX, tipY);
    sCtx.lineTo(cx, tipY);
    sCtx.lineTo(cx, baseY);
    sCtx.closePath();
    sCtx.fill();
    sCtx.fillStyle = colDark;
    sCtx.beginPath();
    sCtx.moveTo(cx, baseY);
    sCtx.lineTo(cx, tipY);
    sCtx.quadraticCurveTo(cx + w * 0.2, tipY, cx + w / 2, domeBaseY);
    sCtx.lineTo(cx + w / 2, baseY);
    sCtx.closePath();
    sCtx.fill();
    sCtx.strokeStyle = outlineColor;
    sCtx.lineWidth = 1;
    sCtx.beginPath();
    sCtx.moveTo(cx - w / 2, baseY);
    sCtx.lineTo(cx - w / 2, domeBaseY);
    sCtx.quadraticCurveTo(cx - w * 0.2, tipY, tipX, tipY);
    sCtx.quadraticCurveTo(cx + w * 0.2, tipY, cx + w / 2, domeBaseY);
    sCtx.lineTo(cx + w / 2, baseY);
    sCtx.stroke();

  } else if (shape === 'flame-shaped') {
    sCtx.fillStyle = colBase;
    sCtx.beginPath();
    sCtx.moveTo(cx - w / 2, baseY);
    sCtx.quadraticCurveTo(cx - w * 0.4, baseY + dir * h * 0.35, cx - w * 0.15, baseY + dir * h * 0.65);
    sCtx.lineTo(tipX, tipY);
    sCtx.quadraticCurveTo(cx + w * 0.35, baseY + dir * h * 0.5, cx + w / 2, baseY);
    sCtx.closePath();
    sCtx.fill();
    // Inner core
    sCtx.fillStyle = colLight;
    sCtx.beginPath();
    sCtx.moveTo(cx - w * 0.2, baseY);
    sCtx.lineTo(tipX, tipY);
    sCtx.lineTo(cx + w * 0.1, baseY);
    sCtx.closePath();
    sCtx.fill();
    sCtx.strokeStyle = outlineColor;
    sCtx.lineWidth = 1;
    sCtx.stroke();

  } else {
    // Default: classic 3D cone stud
    sCtx.fillStyle = colLight;
    sCtx.beginPath();
    sCtx.moveTo(cx - w / 2, baseY);
    sCtx.lineTo(tipX, tipY);
    sCtx.lineTo(cx, baseY);
    sCtx.closePath();
    sCtx.fill();
    sCtx.fillStyle = colDark;
    sCtx.beginPath();
    sCtx.moveTo(cx, baseY);
    sCtx.lineTo(tipX, tipY);
    sCtx.lineTo(cx + w / 2, baseY);
    sCtx.closePath();
    sCtx.fill();
    sCtx.strokeStyle = outlineColor;
    sCtx.lineWidth = 1;
    sCtx.beginPath();
    sCtx.moveTo(cx - w / 2, baseY);
    sCtx.lineTo(tipX, tipY);
    sCtx.lineTo(cx + w / 2, baseY);
    sCtx.stroke();
  }

  // 2. Collar ring if enabled
  if (cfg.collarRing) {
    const crH = 3;
    const crY = isTop ? baseY : baseY - crH;
    sCtx.fillStyle = colBase;
    sCtx.fillRect(cx - (w + 4) / 2, crY, w + 4, crH);
    sCtx.fillStyle = 'rgba(255, 255, 255, 0.65)';
    sCtx.fillRect(cx - (w + 4) / 2, crY, w + 4, 1);
    sCtx.fillStyle = 'rgba(0, 0, 0, 0.45)';
    sCtx.fillRect(cx - (w + 4) / 2, crY + crH - 1, w + 4, 1);
    sCtx.strokeStyle = outlineColor;
    sCtx.lineWidth = 0.8;
    sCtx.strokeRect(cx - (w + 4) / 2, crY, w + 4, crH);
  }

  // 3. Gloss highlights
  if (cfg.glossStyle === 'metal') {
    sCtx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
    sCtx.lineWidth = 1.1;
    sCtx.beginPath();
    sCtx.moveTo(cx - w * 0.25, baseY + dir * 3);
    sCtx.lineTo(tipX - 1, tipY - dir * 2);
    sCtx.stroke();
  } else if (cfg.glossStyle === 'glass') {
    sCtx.fillStyle = 'rgba(255, 255, 255, 0.6)';
    sCtx.beginPath();
    sCtx.arc(tipX, tipY - dir * 3, Math.min(2.5, h * 0.14), 0, 6.28);
    sCtx.fill();
  }

  // 4. Tip specular dot
  sCtx.fillStyle = '#ffffff';
  sCtx.beginPath();
  sCtx.arc(tipX, tipY - dir * 1.5, (h > 20 ? 1.4 : 1.0), 0, 6.28);
  sCtx.fill();

  sCtx.restore();
}

function drawParallaxArt(pCtx, layerType, cfg, layerIdx) {
  const H_BASE = 640;
  const HUE = cfg.H;
  const pastelFill = `hsla(${HUE}, 28%, ${Math.max(68, 86 - layerIdx * 7)}%, ${0.45 + layerIdx * 0.15})`;
  const pastelStroke = `hsla(${HUE}, 35%, 60%, 0.4)`;

  pCtx.save();

  if (layerType === 'clouds') {
    pCtx.fillStyle = `hsla(${HUE}, 20%, 97%, 0.65)`;
    // Repeat cloud clusters every 360 px
    for (const shift of [0, 360]) {
      const cx1 = 60 + shift, cy1 = 120;
      pCtx.beginPath();
      pCtx.arc(cx1, cy1, 32, 0, 6.28);
      pCtx.arc(cx1 + 28, cy1 - 10, 24, 0, 6.28);
      pCtx.arc(cx1 + 52, cy1 + 2, 28, 0, 6.28);
      pCtx.fill();

      const cx2 = 230 + shift, cy2 = 180;
      pCtx.beginPath();
      pCtx.arc(cx2, cy2, 28, 0, 6.28);
      pCtx.arc(cx2 + 25, cy2 - 8, 22, 0, 6.28);
      pCtx.arc(cx2 + 48, cy2 + 4, 25, 0, 6.28);
      pCtx.fill();
    }

  } else if (layerType === 'rolling hills') {
    pCtx.fillStyle = pastelFill;
    pCtx.beginPath();
    pCtx.moveTo(0, H_BASE);
    for (let x = 0; x <= 720; x += 20) {
      const y = H_BASE * 0.68 + Math.sin(x * 0.015) * 35 + Math.cos(x * 0.008) * 20;
      pCtx.lineTo(x, y);
    }
    pCtx.lineTo(720, H_BASE);
    pCtx.closePath();
    pCtx.fill();

  } else if (layerType === 'mountains') {
    for (const shift of [0, 360]) {
      const peaks = [
        [30 + shift, H_BASE * 0.72, 80],
        [140 + shift, H_BASE * 0.62, 110],
        [270 + shift, H_BASE * 0.68, 95]
      ];
      for (const [px, py, pw] of peaks) {
        // Light slope
        pCtx.fillStyle = `hsla(${HUE}, 30%, 86%, 0.55)`;
        pCtx.beginPath();
        pCtx.moveTo(px, py - pw * 0.9);
        pCtx.lineTo(px - pw / 2, py + pw * 0.4);
        pCtx.lineTo(px, py + pw * 0.4);
        pCtx.closePath();
        pCtx.fill();
        // Shadow slope
        pCtx.fillStyle = `hsla(${HUE}, 30%, 76%, 0.55)`;
        pCtx.beginPath();
        pCtx.moveTo(px, py - pw * 0.9);
        pCtx.lineTo(px + pw / 2, py + pw * 0.4);
        pCtx.lineTo(px, py + pw * 0.4);
        pCtx.closePath();
        pCtx.fill();
      }
    }

  } else if (layerType === 'city skyline') {
    pCtx.fillStyle = pastelFill;
    for (const shift of [0, 360]) {
      const buildings = [
        [15 + shift, 160, 32],
        [55 + shift, 220, 26],
        [90 + shift, 190, 38],
        [135 + shift, 250, 30],
        [175 + shift, 175, 28],
        [210 + shift, 230, 35],
        [255 + shift, 185, 42],
        [305 + shift, 210, 30]
      ];
      for (const [bx, bh, bw] of buildings) {
        pCtx.fillRect(bx, H_BASE - bh, bw, bh);
        // Soft window dots
        pCtx.fillStyle = `hsla(${HUE}, 40%, 96%, 0.4)`;
        for (let wy = H_BASE - bh + 14; wy < H_BASE - 30; wy += 18) {
          pCtx.fillRect(bx + 6, wy, 3, 4);
          pCtx.fillRect(bx + bw - 9, wy, 3, 4);
        }
        pCtx.fillStyle = pastelFill;
      }
    }

  } else if (layerType === 'floating islands') {
    pCtx.fillStyle = pastelFill;
    for (const shift of [0, 360]) {
      const islands = [
        [80 + shift, 220, 60, 24],
        [250 + shift, 170, 75, 28]
      ];
      for (const [ix, iy, iw, ih] of islands) {
        pCtx.beginPath();
        pCtx.moveTo(ix - iw / 2, iy);
        pCtx.lineTo(ix + iw / 2, iy);
        pCtx.lineTo(ix, iy + ih);
        pCtx.closePath();
        pCtx.fill();
        // Foliage cap
        pCtx.fillStyle = `hsla(${HUE}, 40%, 82%, 0.65)`;
        pCtx.beginPath();
        pCtx.ellipse(ix, iy, iw / 2 + 4, 7, 0, 0, 6.28);
        pCtx.fill();
        pCtx.fillStyle = pastelFill;
      }
    }

  } else if (layerType === 'sun rays') {
    pCtx.fillStyle = `hsla(${HUE}, 45%, 92%, 0.07)`;
    for (let r = -200; r < 900; r += 120) {
      pCtx.beginPath();
      pCtx.moveTo(r, 0);
      pCtx.lineTo(r + 60, 0);
      pCtx.lineTo(r - 100, H_BASE);
      pCtx.lineTo(r - 160, H_BASE);
      pCtx.closePath();
      pCtx.fill();
    }

  } else if (layerType === 'waves') {
    pCtx.strokeStyle = pastelStroke;
    pCtx.lineWidth = 3;
    for (let row = 0; row < 3; row++) {
      const baseY = H_BASE * 0.7 + row * 45;
      pCtx.beginPath();
      for (let x = 0; x <= 720; x += 15) {
        const y = baseY + Math.sin(x * 0.02 + row * 1.5) * 12;
        if (x === 0) pCtx.moveTo(x, y); else pCtx.lineTo(x, y);
      }
      pCtx.stroke();
    }

  } else if (layerType === 'forest silhouettes') {
    pCtx.fillStyle = pastelFill;
    for (const shift of [0, 360]) {
      for (let tx = 20 + shift; tx < 360 + shift; tx += 40) {
        const ty = H_BASE * 0.72;
        pCtx.beginPath();
        pCtx.moveTo(tx, ty - 45);
        pCtx.lineTo(tx - 16, ty);
        pCtx.lineTo(tx + 16, ty);
        pCtx.closePath();
        pCtx.fill();
        pCtx.fillRect(tx - 2.5, ty, 5, 20);
      }
    }

  } else if (layerType === 'balloons') {
    for (const shift of [0, 360]) {
      const balloons = [
        [90 + shift, 140, 16],
        [280 + shift, 180, 20]
      ];
      for (const [bx, by, br] of balloons) {
        pCtx.fillStyle = `hsla(${HUE + 40}, 65%, 85%, 0.65)`;
        pCtx.beginPath();
        pCtx.arc(bx, by, br, 0, 6.28);
        pCtx.fill();
        // Basket
        pCtx.fillStyle = `hsla(${HUE}, 30%, 60%, 0.5)`;
        pCtx.fillRect(bx - 3, by + br + 4, 6, 5);
      }
    }

  } else if (layerType === 'windmills') {
    pCtx.fillStyle = pastelFill;
    pCtx.strokeStyle = pastelFill;
    pCtx.lineWidth = 1.5;
    for (const shift of [0, 360]) {
      for (const wx of [120 + shift, 290 + shift]) {
        const wy = H_BASE * 0.75;
        // Tower
        pCtx.beginPath();
        pCtx.moveTo(wx - 4, wy);
        pCtx.lineTo(wx - 2, wy - 55);
        pCtx.lineTo(wx + 2, wy - 55);
        pCtx.lineTo(wx + 4, wy);
        pCtx.closePath();
        pCtx.fill();
        // 4 blades
        for (let a = 0; a < 4; a++) {
          const ang = (a * Math.PI) / 2 + 0.4;
          pCtx.beginPath();
          pCtx.moveTo(wx, wy - 55);
          pCtx.lineTo(wx + Math.cos(ang) * 22, wy - 55 + Math.sin(ang) * 22);
          pCtx.stroke();
        }
      }
    }

  } else if (layerType === 'geometric shapes') {
    pCtx.strokeStyle = pastelStroke;
    pCtx.lineWidth = 2;
    for (const shift of [0, 360]) {
      // Floating hexagons & circles
      pCtx.beginPath();
      pCtx.arc(80 + shift, 150, 18, 0, 6.28);
      pCtx.stroke();

      pCtx.strokeRect(260 + shift, 190, 22, 22);
      pCtx.beginPath();
      pCtx.arc(190 + shift, 240, 14, 0, 6.28);
      pCtx.stroke();
    }

  } else if (layerType === 'stars and moon') {
    pCtx.fillStyle = `hsla(${HUE}, 40%, 95%, 0.75)`;
    // Crescent moon
    for (const shift of [0, 360]) {
      const mx = 290 + shift, my = 100;
      pCtx.beginPath();
      pCtx.arc(mx, my, 18, 0, 6.28);
      pCtx.fill();
      pCtx.fillStyle = `hsl(${(HUE + 180) % 360}, 35%, 94%)`;
      pCtx.beginPath();
      pCtx.arc(mx + 6, my - 3, 15, 0, 6.28);
      pCtx.fill();

      // Delicate 4-point stars
      pCtx.fillStyle = `hsla(${HUE}, 50%, 96%, 0.7)`;
      for (const [sx, sy] of [[50 + shift, 90], [130 + shift, 140], [210 + shift, 80], [330 + shift, 160]]) {
        pCtx.fillRect(sx - 1, sy - 4, 2, 8);
        pCtx.fillRect(sx - 4, sy - 1, 8, 2);
      }
    }
  }

  pCtx.restore();
}

function prerenderLevelAssets(cfg) {
  curConfig = cfg;

  // 1. Pre-render 6 spike sprites: 3 sizes x 2 directions
  const sizes = { small: 12, medium: 22, big: 36 };
  for (const sKey in sizes) {
    const h = sizes[sKey];
    for (const dir of ['top', 'bot']) {
      const key = `${sKey}_${dir}`;
      if (!spikeCanvases[key]) {
        spikeCanvases[key] = document.createElement('canvas');
        spikeCanvases[key].width = 36;
        spikeCanvases[key].height = 48;
      }
      renderSpikeToCanvas(spikeCanvases[key], dir === 'top', h, cfg);
    }
  }

  // 2. Pre-render pastel background gradient (360 x 640)
  if (!bgGradientCanvas) {
    bgGradientCanvas = document.createElement('canvas');
    bgGradientCanvas.width = W;
    bgGradientCanvas.height = H;
  }
  const bgCtx = bgGradientCanvas.getContext('2d');
  const grad = bgCtx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, cfg.bgTop);
  grad.addColorStop(1, cfg.bgBot);
  bgCtx.fillStyle = grad;
  bgCtx.fillRect(0, 0, W, H);

  // 3. Pre-render Parallax Layers (720 x 640 for seamless horizontal scrolling)
  parallaxCanvases = [];
  const layers = cfg.bgLayers || ['clouds', 'rolling hills'];
  for (let idx = 0; idx < layers.length; idx++) {
    const pCanv = document.createElement('canvas');
    pCanv.width = 720;
    pCanv.height = H;
    const pCtx = pCanv.getContext('2d');
    drawParallaxArt(pCtx, layers[idx], cfg, idx);
    parallaxCanvases.push(pCanv);
  }

  // 4. Re-initialize atmospheric drifting particles according to chosen particleType
  initAtmosphereParticles(cfg.particleType, cfg.H);
}

// Game State: 'loading', 'ready', 'play', 'level_complete', 'transition', 'dead'
let curLevel = 1;
let cam = 0, vy = 0, cy = CAR_REST_Y, hold = false;
let segs = [], nextX = 0, lastC = H / 2, parts = [], deadAt = 0, last = 0;
let best = 0;
let wheelRot = 0;

// Next Level Transition & Title Card state

try { best = +localStorage.getItem('skycarBest') || 0 } catch(e) {}

function getDifficultyDistance() {
  const distInTunnel = Math.max(0, Math.min(LEVEL_LENGTH, (cam + CAR_X) - TUNNEL_START_X));
  return (curLevel - 1) * LEVEL_LENGTH + distInTunnel;
}

const speed = () => Math.min(MAX_SPEED, START_SPEED + getDifficultyDistance() / SPEED_DISTANCE_DIVISOR);

function roundRect(ctx, x, y, w, h, r) {
  if (w < 2 * r) r = w / 2;
  if (h < 2 * r) r = h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function pickClusterSize(d, levelRng) {
  const pBig = Math.min(0.45, 0.15 + d / 35000);
  const r = levelRng();
  if (r < pBig) return 'big';
  const pMed = 0.55;
  if (r < pBig + (1 - pBig) * pMed) return 'medium';
  return 'small';
}

function makeSpikes(len, d, top, bot, noSpikes = false, levelRng) {
  const count = Math.ceil(len / 12);
  const heights = { small: 12, medium: 22, big: 36 };
  function gen() {
    const list = [];
    let i = 0;
    while (i < count) {
      const cLen = Math.min(count - i, Math.floor(2 + levelRng() * 4));
      const size = pickClusterSize(d, levelRng);
      const h = noSpikes ? 0 : heights[size];
      for (let k = 0; k < cLen; k++) list.push({ h, size });
      i += cLen;
    }
    return list;
  }
  const topSpikes = gen();
  const botSpikes = gen();
  const maxSpikeSum = (bot - top + 36) - 140; // Clearance gap between spike tips is never below 140 px
  for (let i = 0; i < count; i++) {
    if (topSpikes[i].h + botSpikes[i].h > maxSpikeSum) {
      if (topSpikes[i].h >= botSpikes[i].h) {
        if (22 + botSpikes[i].h <= maxSpikeSum) { topSpikes[i].h = 22; topSpikes[i].size = 'medium'; }
        else { topSpikes[i].h = 12; topSpikes[i].size = 'small'; }
      } else {
        if (topSpikes[i].h + 22 <= maxSpikeSum) { botSpikes[i].h = 22; botSpikes[i].size = 'medium'; }
        else { botSpikes[i].h = 12; botSpikes[i].size = 'small'; }
      }
    }
  }
  return { topSpikes, botSpikes };
}

let levelPRNG = mulberry32(1);

function addSeg(isOpen = false, forceLen) {
  const segDistInTunnel = Math.max(0, Math.min(LEVEL_LENGTH, nextX - TUNNEL_START_X));
  const d = (curLevel - 1) * LEVEL_LENGTH + segDistInTunnel;
  const curSpd = Math.min(MAX_SPEED, START_SPEED + d / SPEED_DISTANCE_DIVISOR);
  const gap = isOpen ? 400 : Math.max(140, 250 - d / 100);
  let len = forceLen || Math.max(240, 320 - d / 120);
  if (!isOpen && nextX + len > TUNNEL_END_X) {
    len = Math.max(60, TUNNEL_END_X - nextX);
  }
  const maxShift = isOpen ? 20 : Math.min(70, 0.6 * MAX_UP_SPEED * (len / curSpd));
  let c = isOpen ? H / 2 : (lastC + (levelPRNG() * 2 - 1) * maxShift);
  c = Math.max(gap / 2 + 50, Math.min(H - gap / 2 - 50, c));
  lastC = c;
  const top = isOpen ? -300 : (c - gap / 2);
  const bot = isOpen ? (H + 300) : (c + gap / 2);
  const { topSpikes, botSpikes } = makeSpikes(len, d, top, bot, isOpen, levelPRNG);
  segs.push({ x: nextX, w: len, top, bot, topSpikes, botSpikes, isOpen });
  nextX += len;
}

function startLevel(lvl) {
  curLevel = lvl;
  cam = 0;
  vy = 0;
  cy = CAR_REST_Y;
  lastC = H / 2;
  parts = [];
  stopping = false;
  stopTimer = 0;
  levelCompleteTimer = 0;
  confettis = [];

  // Seeded level setup
  const cfg = getLevelConfig(lvl);
  prerenderLevelAssets(cfg);

  levelPRNG = mulberry32(hashInt(lvl * 55555 + 12345));

  // 1. Initial open section covering start road platform (-50 to 470) and gap up to TUNNEL_START_X (650)
  const initW = TUNNEL_START_X - START_ROAD_START;
  const { topSpikes, botSpikes } = makeSpikes(initW, (curLevel - 1) * LEVEL_LENGTH, -300, H + 300, true, levelPRNG);
  segs = [{ x: START_ROAD_START, w: initW, top: -300, bot: H + 300, topSpikes, botSpikes, isOpen: true }];
  nextX = TUNNEL_START_X;

  // 2. Tunnel segments from TUNNEL_START_X (650) to TUNNEL_END_X (1650)
  while (nextX < TUNNEL_END_X) {
    addSeg(false);
  }

  // 3. Post-tunnel open section covering finish road platform and beyond
  const postW = (FINISH_ROAD_END + 500) - TUNNEL_END_X;
  const endSpikes = makeSpikes(postW, curLevel * LEVEL_LENGTH, -300, H + 300, true, levelPRNG);
  segs.push({ x: TUNNEL_END_X, w: postW, top: -300, bot: H + 300, topSpikes: endSpikes.topSpikes, botSpikes: endSpikes.botSpikes, isOpen: true });
  nextX = TUNNEL_END_X + postW;
}

function resetGame() {
  curLevel = 1;
  cam = 0;
  startLevel(1);
}

function initConfetti() {
  confettis = [];
  const colors = ['#2ebd4a', '#ffd84d', '#38bdf8', '#ff4d6d', '#a78bfa', '#f37021', '#fb923c'];
  for (let i = 0; i < 75; i++) {
    confettis.push({
      x: rnd(10, W - 10),
      y: rnd(-80, H * 0.45),
      vx: rnd(-35, 35),
      vy: rnd(65, 160),
      size: rnd(4, 7),
      w: rnd(5, 9),
      rot: rnd(0, 6.28),
      vRot: rnd(-4, 4),
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }
}

function updateConfetti(dt) {
  for (const c of confettis) {
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    c.rot += c.vRot * dt;
    if (c.y > H + 20) {
      c.y = rnd(-20, -5);
      c.x = rnd(10, W - 10);
      c.vy = rnd(65, 160);
    }
  }
}

function drawConfetti() {
  for (const c of confettis) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.w / 2, -c.size / 2, c.w * Math.abs(Math.cos(c.rot)), c.size);
    ctx.restore();
  }
}

function die() {
  st = 'dead';
  deadAt = performance.now();
  hold = false;
  const tunnelDist = Math.max(0, Math.min(LEVEL_LENGTH, (cam + CAR_X) - TUNNEL_START_X));
  const progress = tunnelDist / LEVEL_LENGTH;
  const curScore = Math.floor(progress * 100);
  const currentTotal = 100 * (curLevel - 1) + curScore;
  if (currentTotal > best) {
    best = currentTotal;
    try { localStorage.setItem('skycarBest', best); } catch (e) {}
  }
}

// Small man in black suit standing near end of platform
function drawMan(x, feetY) {
  if (x < -30 || x > W + 30) return;
  ctx.save();
  ctx.fillStyle = '#0a0a0c';
  ctx.fillRect(x - 5, feetY - 3, 5, 3);
  ctx.fillRect(x + 1, feetY - 3, 5, 3);

  ctx.fillStyle = '#18191c';
  ctx.fillRect(x - 4.5, feetY - 14, 4, 11);
  ctx.fillRect(x + 1.5, feetY - 14, 4, 11);

  ctx.fillStyle = '#151619';
  ctx.fillRect(x - 6, feetY - 26, 13, 12);

  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(x - 2, feetY - 26);
  ctx.lineTo(x + 3, feetY - 26);
  ctx.lineTo(x + 0.5, feetY - 20);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#c8202a';
  ctx.beginPath();
  ctx.moveTo(x, feetY - 25);
  ctx.lineTo(x + 1, feetY - 25);
  ctx.lineTo(x + 1.2, feetY - 19);
  ctx.lineTo(x + 0.5, feetY - 17.5);
  ctx.lineTo(x - 0.2, feetY - 19);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#18191c';
  ctx.fillRect(x - 8, feetY - 25, 2.5, 11);
  ctx.fillRect(x + 6.5, feetY - 25, 2.5, 11);
  ctx.fillStyle = '#f5cba7';
  ctx.fillRect(x - 8, feetY - 14, 2.5, 2.5);
  ctx.fillRect(x + 6.5, feetY - 14, 2.5, 2.5);

  ctx.fillStyle = '#f5cba7';
  ctx.beginPath();
  ctx.arc(x + 0.5, feetY - 29, 4, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#101014';
  ctx.beginPath();
  ctx.arc(x + 0.5, feetY - 30.5, 4.2, Math.PI, Math.PI * 2);
  ctx.fill();
  ctx.fillRect(x - 3.7, feetY - 31, 2, 3);

  ctx.fillStyle = '#050507';
  ctx.fillRect(x - 2.5, feetY - 30, 6, 2);
  ctx.restore();
}

// Draw thick 3-layer bridge platform (Asphalt Top, Red Deck Edge, Steel Truss) with optional flags and lights for finish platform
function drawRoadPlatform(startX, endX, roadTop, isFinish = false) {
  const w = endX - startX;
  if (w <= 0) return;
  const x = startX - cam;
  if (x + w < -60 || x > W + 60) return;

  const roadBottom = roadTop + 57;

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x - 20, roadTop - 2);
  ctx.lineTo(x + w, roadTop - 2);
  ctx.lineTo(x + w - 12, roadBottom + 2);
  ctx.lineTo(x - 20, roadBottom + 2);
  ctx.closePath();
  ctx.clip();

  // 1. ASPHALT TOP (28 px tall)
  ctx.fillStyle = '#26282c';
  ctx.fillRect(x, roadTop, w, 28);
  ctx.fillStyle = '#c8202a';
  ctx.fillRect(x, roadTop, w, 2);

  // White dashed lane markings
  ctx.fillStyle = '#e9e9e9';
  const startDash = Math.floor(startX / 48) * 48;
  for (let wx = startDash; wx < endX + 48; wx += 48) {
    const dx = wx - cam;
    ctx.fillRect(dx, roadTop + 14, 22, 4);
  }

  // 2. RED DECK EDGE (7 px tall)
  ctx.fillStyle = '#e0262f';
  ctx.fillRect(x, roadTop + 28, w, 7);
  ctx.fillStyle = '#ff6b6b';
  ctx.fillRect(x, roadTop + 28, w, 1);
  ctx.fillStyle = '#8f1218';
  ctx.fillRect(x, roadTop + 34, w, 1);

  // 3. STEEL TRUSS (22 px tall)
  ctx.fillStyle = '#1d1f23';
  ctx.fillRect(x, roadTop + 35, w, 22);
  ctx.fillStyle = '#c8202a';
  ctx.fillRect(x, roadTop + 35, w, 2);
  ctx.fillRect(x, roadTop + 55, w, 2);

  ctx.strokeStyle = '#4a4e55';
  ctx.lineWidth = 2;
  ctx.beginPath();
  const startTruss = Math.floor(startX / 40) * 40;
  for (let wx = startTruss; wx < endX + 40; wx += 40) {
    const p1 = wx - cam, p2 = wx + 40 - cam;
    ctx.moveTo(p1, roadTop + 37); ctx.lineTo(p2, roadTop + 55);
    ctx.moveTo(p2, roadTop + 37); ctx.lineTo(p1, roadTop + 55);
  }
  ctx.stroke();

  for (let wx = startTruss; wx <= endX + 40; wx += 40) {
    const px = wx - cam;
    ctx.fillStyle = '#3a3d43';
    ctx.fillRect(px - 3, roadTop + 35, 6, 22);
    ctx.fillStyle = '#656b76';
    ctx.fillRect(px - 3, roadTop + 35, 6, 2.5);
    ctx.fillRect(px - 3, roadTop + 54.5, 6, 2.5);
  }

  ctx.restore();

  ctx.save();
  ctx.strokeStyle = '#3a3d43';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(x + w, roadTop);
  ctx.lineTo(x + w - 12, roadBottom);
  ctx.stroke();

  ctx.fillStyle = '#c8202a';
  ctx.fillRect(x + w - 2, roadTop, 2, 2);
  ctx.fillStyle = '#e0262f';
  ctx.fillRect(x + w - 6, roadTop + 28, 3, 7);
  ctx.fillStyle = '#c8202a';
  ctx.fillRect(x + w - 13, roadTop + 55, 3, 2);
  ctx.restore();

  if (isFinish) {
    ctx.save();
    const cfg = curConfig || { H: 200, accentColor: '#38bdf8' };
    const accent = cfg.accentColor || `hsl(${cfg.H}, 80%, 50%)`;
    const lightCol = `hsl(${cfg.H}, 90%, 70%)`;

    const postPositions = [startX + 80, startX + 220, startX + 360, startX + 460];
    for (const wx of postPositions) {
      if (wx >= startX && wx <= endX) {
        const px = wx - cam;
        if (px > -30 && px < W + 30) {
          ctx.fillStyle = '#4a4e55';
          ctx.fillRect(px - 1.5, roadTop - 42, 3, 42);

          ctx.shadowColor = lightCol;
          ctx.shadowBlur = 8;
          ctx.fillStyle = lightCol;
          ctx.beginPath();
          ctx.arc(px, roadTop - 42, 3.5, 0, 6.28);
          ctx.fill();
          ctx.shadowBlur = 0;

          ctx.fillStyle = accent;
          ctx.beginPath();
          ctx.moveTo(px + 1.5, roadTop - 38);
          ctx.lineTo(px + 22, roadTop - 30);
          ctx.lineTo(px + 1.5, roadTop - 22);
          ctx.closePath();
          ctx.fill();
        }
      }
    }
    ctx.restore();
  }
}

function step(dt) {
  const sp = speed();

  // Background atmospheric particles drift
  for (const ap of atmoParts) {
    ap.phase += dt * 1.5;
    ap.rot += ap.vRot * dt;
    ap.x += ap.vx * dt - sp * 0.12 * dt;
    ap.y += ap.vy * dt + Math.sin(ap.phase) * 6 * dt;

    if (ap.x < -15) ap.x += W + 30;
    if (ap.x > W + 15) ap.x -= W + 30;
    if (ap.y < -15) ap.y += H + 30;
    if (ap.y > H + 15) ap.y -= H + 30;
  }

  if (st === 'loading') {
    try {
      loadingTimer += dt;
      loadingWheelRot += dt * 14;

      for (const sl of speedLines) {
        sl.x -= sl.speed * dt;
        if (sl.x < -140) {
          sl.x = rnd(60, 140);
          sl.y = rnd(-35, 30);
          sl.len = rnd(35, 75);
          sl.speed = rnd(240, 420);
          sl.alpha = rnd(0.25, 0.6);
        }
      }

      if (loadingTimer >= 2.5) {
        loadingFade += dt / 0.4;
        if (loadingFade >= 1 || loadingTimer >= 3.2) {
          st = 'ready';
        }
      }

      if (loadingTimer > 3.5) st = 'ready';
    } catch(err) {
      st = 'ready';
    }
    return;
  }

  if (st === 'ready') {
    cy = CAR_REST_Y;
    vy = 0;
    cam = 0;
  } else if (st === 'transition') {
    transitionTimer += dt;

    if (transitionTimer >= 0.25 && curLevel !== nextLevelTarget) {
      startLevel(nextLevelTarget);
      hold = false;
    }

    if (transitionTimer >= 0.25) {
      const sp = speed();
      cam += sp * dt;
      cy = CAR_REST_Y;
      vy = 0;
      wheelRot += sp * dt * (0.16 / CAR_SCALE);
      if (Math.random() < 0.35) {
        parts.push({
          x: CAR_X - 22 * CAR_SCALE,
          y: cy + 15 * CAR_SCALE,
          vx: rnd(-50, -20),
          vy: rnd(-8, -2),
          l: 0,
          m: rnd(0.2, 0.35),
          isSmoke: true
        });
      }
    }

    if (transitionTimer >= TITLE_CARD_DURATION) {
      st = 'play';
      hold = false;
    }
  } else if (st === 'play') {
    const wx = cam + CAR_X;

    if (wx >= FINISH_ROAD_X + 40 && !stopping) {
      stopping = true;
      stopTimer = 0;
    }

    let ease = 1;
    if (stopping) {
      stopTimer += dt;
      ease = Math.max(0, 1 - stopTimer / 1.5);
      if (stopTimer >= 1.5) {
        st = 'level_complete';
        stopping = false;
        hold = false;
        vy = 0;
        cy = CAR_REST_Y;
        levelCompleteTimer = 0;
        initConfetti();
      }
    }

    const effectiveSp = sp * ease;
    cam += effectiveSp * dt;

    // Flight physics: gentle, floaty movement
    // Holding: vy -= LIFT_ACCEL * dt. Not holding: vy += GRAVITY * dt. Clamp vy between -MAX_UP_SPEED and +MAX_DOWN_SPEED.
    if (hold) vy -= LIFT_ACCEL * dt;
    else vy += GRAVITY * dt;
    vy = Math.max(-MAX_UP_SPEED, Math.min(MAX_DOWN_SPEED, vy));
    cy += vy * dt;

    // Road floor physics (keep wheels resting on the asphalt)
    const onStartPlatform = (wx >= START_ROAD_START && wx <= START_ROAD_END);
    const onFinishPlatform = (wx >= FINISH_ROAD_X && wx <= FINISH_ROAD_END);
    const onRoadPlatform = onStartPlatform || onFinishPlatform;

    if (onRoadPlatform) {
      if (!hold && cy >= CAR_REST_Y) {
        cy = CAR_REST_Y;
        vy = 0;
      } else if (cy > CAR_REST_Y) {
        cy = CAR_REST_Y;
        if (vy > 0) vy = 0;
      }
    }

    if (cy < 16) { cy = 16; vy = 0; }
    if (cy > H - 16) { cy = H - 16; vy = 0; }

    if (onRoadPlatform && cy >= CAR_REST_Y - 0.5 && effectiveSp > 0) {
      wheelRot += effectiveSp * dt * (0.16 / CAR_SCALE);
      if (Math.random() < 0.35) {
        parts.push({
          x: CAR_X - 22 * CAR_SCALE,
          y: cy + 15 * CAR_SCALE,
          vx: rnd(-50, -20),
          vy: rnd(-8, -2),
          l: 0,
          m: rnd(0.2, 0.35),
          isSmoke: true
        });
      }
    } else if (effectiveSp > 0) {
      wheelRot += effectiveSp * dt * (0.1 / CAR_SCALE);
    }

    // Vertical wheel thruster smoke (scaled by CAR_SCALE, under the wheels)
    if (hold && st === 'play') {
      for (const ox of [-20 * CAR_SCALE, 21 * CAR_SCALE]) {
        parts.push({
          x: CAR_X + ox,
          y: cy + 14 * CAR_SCALE,
          vx: rnd(-3, 3) - effectiveSp * 0.15,
          vy: rnd(140, 230),
          l: 0,
          m: rnd(0.32, 0.52),
          size: rnd(3.5, 6.5) * (CAR_SCALE * 0.6),
          isSmoke: true
        });
      }
    }

    if (nextX < cam + W + 400) addSeg(true, 400);
    while (segs.length && segs[0].x + segs[0].w < cam - 100) segs.shift();

    // Collision check against spikes and thin rails (scaled hitbox by CAR_SCALE)
    for (const s of segs) {
      if (wx + HITBOX_HALF_W > s.x && wx - HITBOX_HALF_W < s.x + s.w && !s.isOpen) {
        if (cy - HITBOX_TOP_OFFSET < s.top - 18 || cy + HITBOX_BOT_OFFSET > s.bot + 18) { die(); break; }
        let hit = false;
        const count = s.topSpikes.length;
        for (let i = 0; i < count; i++) {
          const spX = s.x + i * 12;
          if (wx + HITBOX_HALF_W > spX && wx - HITBOX_HALF_W < spX + 12) {
            const topTip = (s.top - 18) + s.topSpikes[i].h;
            const botTip = (s.bot + 18) - s.botSpikes[i].h;
            if ((cy - HITBOX_TOP_OFFSET) < topTip - 6 || (cy + HITBOX_BOT_OFFSET) > botTip + 6) {
              hit = true;
              break;
            }
          }
        }
        if (hit) { die(); break; }
      }
    }
  } else if (st === 'level_complete') {
    levelCompleteTimer += dt;
    cy = CAR_REST_Y;
    vy = 0;
    updateConfetti(dt);
  }

  for (const p of parts) { p.l += dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  parts = parts.filter(p => p.l < p.m);
}

// 1993 McLaren F1 supercar body rendering with outline for contrast
function renderCarBody(drawWheelAngle = wheelRot, withOutline = true) {
  // Carbon fiber splitter & diffuser
  ctx.fillStyle = '#141518';
  ctx.fillRect(-33, 6, 68, 4);
  ctx.fillRect(32, 6, 6, 3);
  ctx.fillRect(-35, 6, 5, 4);

  // Papaya Orange aerodynamic body
  const bodyGrad = ctx.createLinearGradient(0, -12, 0, 8);
  bodyGrad.addColorStop(0, '#ff8d24');
  bodyGrad.addColorStop(0.5, '#f37021');
  bodyGrad.addColorStop(1, '#c85008');
  ctx.fillStyle = bodyGrad;

  ctx.beginPath();
  ctx.moveTo(37, 7);
  ctx.lineTo(35, 2);
  ctx.lineTo(26, -2);
  ctx.lineTo(12, -6);
  ctx.lineTo(-2, -10.5);
  ctx.lineTo(-14, -10.5);
  ctx.lineTo(-24, -6.5);
  ctx.lineTo(-33, -3);
  ctx.lineTo(-34, 7);
  ctx.closePath();
  ctx.fill();
  if (withOutline) {
    ctx.strokeStyle = '#181a1e';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Roof Air Scoop
  ctx.fillStyle = '#16181c';
  ctx.beginPath();
  ctx.moveTo(-4, -10.5);
  ctx.lineTo(-2, -13.5);
  ctx.lineTo(-13, -13.5);
  ctx.lineTo(-15, -10.5);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#ff7700';
  ctx.fillRect(-3, -13, 2, 2);
  if (withOutline) {
    ctx.strokeStyle = '#181a1e';
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }

  // Cockpit canopy and side windows
  ctx.fillStyle = '#111317';
  ctx.beginPath();
  ctx.moveTo(-1, -9.5);
  ctx.lineTo(10, -5.5);
  ctx.lineTo(12, -2.5);
  ctx.lineTo(-12, -2.5);
  ctx.lineTo(-18, -6);
  ctx.closePath();
  ctx.fill();
  if (withOutline) {
    ctx.strokeStyle = '#181a1e';
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(8, -5);
  ctx.lineTo(-1, -8.5);
  ctx.lineTo(-14, -6);
  ctx.stroke();

  // Scalloped Side Intake
  ctx.fillStyle = '#9e3c06';
  ctx.beginPath();
  ctx.moveTo(-7, 2);
  ctx.lineTo(12, 2);
  ctx.lineTo(4, 5);
  ctx.lineTo(-10, 5);
  ctx.closePath();
  ctx.fill();

  // Glass headlights
  ctx.fillStyle = '#ffeaa7';
  ctx.beginPath();
  ctx.moveTo(27, -1);
  ctx.lineTo(33, 2);
  ctx.lineTo(28, 2);
  ctx.closePath();
  ctx.fill();

  // Tail lights
  ctx.fillStyle = '#ff2424';
  ctx.fillRect(-34, 0, 2, 3);
  ctx.fillRect(-34, 4, 2, 2);
  ctx.fillStyle = '#c5c9d0';
  ctx.fillRect(-36, 5, 2, 2.5);

  // Carbon rear wing
  ctx.fillStyle = '#16181c';
  ctx.fillRect(-31, -8, 2, 6);
  ctx.fillRect(-34, -9, 8, 2.5);

  // 5-Spoke Wheels
  for (const wx of [-20, 21]) {
    ctx.save();
    ctx.translate(wx, 8);
    ctx.rotate(drawWheelAngle);

    ctx.fillStyle = '#121316';
    ctx.beginPath(); ctx.arc(0, 0, 7.5, 0, 6.28); ctx.fill();
    if (withOutline) {
      ctx.strokeStyle = '#181a1e';
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }

    ctx.fillStyle = '#6c727f';
    ctx.beginPath(); ctx.arc(0, 0, 5, 0, 6.28); ctx.fill();

    ctx.strokeStyle = '#f0f2f5';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let a = 0; a < 5; a++) {
      const ang = (a * Math.PI * 2) / 5;
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(ang) * 4.5, Math.sin(ang) * 4.5);
    }
    ctx.stroke();

    ctx.fillStyle = '#121316';
    ctx.beginPath(); ctx.arc(0, 0, 1.8, 0, 6.28); ctx.fill();
    ctx.restore();
  }
}

// In-game Sky Car with soft shadow and crisp outline for light pastel background
function car(drawX = CAR_X) {
  // Soft dark shadow under the car
  ctx.save();
  ctx.fillStyle = 'rgba(25, 30, 42, 0.28)';
  ctx.beginPath();
  ctx.ellipse(drawX, cy + 12 * CAR_SCALE, 34 * CAR_SCALE, 5 * CAR_SCALE, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(drawX, cy);
  ctx.rotate(Math.max(-.14, Math.min(.14, vy / 400)));
  ctx.scale(CAR_SCALE, CAR_SCALE);
  renderCarBody(wheelRot, true);
  ctx.restore();
}

// Start-up Loading Screen (white background, big car, orange progress bar)
function drawLoadingScreen() {
  try {
    const bgGrad = ctx.createRadialGradient(W / 2, H * 0.44, 25, W / 2, H * 0.44, W * 0.85);
    bgGrad.addColorStop(0, '#ffffff');
    bgGrad.addColorStop(0.55, '#f4f6fa');
    bgGrad.addColorStop(1, '#e3e7f0');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    const carCenterX = W / 2;
    const bounceY = Math.sin(loadingTimer * 4.5) * 4.5;
    const carCenterY = H * 0.38 + bounceY;
    const carScale = (W * 0.60) / 72;

    ctx.save();
    for (const sl of speedLines) {
      ctx.strokeStyle = 'rgba(165, 175, 192, ' + sl.alpha + ')';
      ctx.lineWidth = sl.w;
      ctx.beginPath();
      const lx = carCenterX - 35 + sl.x;
      const ly = carCenterY + sl.y;
      ctx.moveTo(lx, ly);
      ctx.lineTo(lx - sl.len, ly);
      ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    const shadowW = W * 0.32;
    const shadowH = 11;
    const shadowGrad = ctx.createRadialGradient(carCenterX, carCenterY + 45, 5, carCenterX, carCenterY + 45, shadowW);
    shadowGrad.addColorStop(0, 'rgba(50, 60, 75, 0.28)');
    shadowGrad.addColorStop(0.5, 'rgba(80, 90, 110, 0.12)');
    shadowGrad.addColorStop(1, 'rgba(120, 130, 150, 0)');
    ctx.fillStyle = shadowGrad;
    ctx.beginPath();
    ctx.ellipse(carCenterX, carCenterY + 45, shadowW, shadowH, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(carCenterX, carCenterY);
    ctx.scale(carScale, carScale);
    renderCarBody(loadingWheelRot, true);
    ctx.restore();

    const nameY = H * 0.54;
    ctx.save();
    ctx.font = '900 32px "Orbitron", "Rajdhani", "Impact", system-ui, sans-serif';
    const textSky = 'SKY ';
    const textCar = 'CAR';
    const wSky = ctx.measureText(textSky).width;
    const wCar = ctx.measureText(textCar).width;
    const startX = W / 2 - (wSky + wCar) / 2;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#1c2028';
    ctx.fillText(textSky, startX, nameY);
    ctx.fillStyle = '#f37021';
    ctx.fillText(textCar, startX + wSky, nameY);

    ctx.font = '600 13px system-ui, -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#6e7687';
    ctx.fillText('Loading...', W / 2, nameY + 24);
    ctx.restore();

    const barW = W * 0.70;
    const barH = 10;
    const barX = W / 2 - barW / 2;
    const barY = H * 0.74;

    const progress = Math.min(1, Math.max(0, loadingTimer / 2.5));
    const pct = Math.min(100, Math.floor(progress * 100));

    ctx.save();
    ctx.font = '700 13px "Orbitron", "Rajdhani", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#495262';
    ctx.fillText(pct + '%', W / 2, barY - 10);

    ctx.fillStyle = '#e2e6ee';
    roundRect(ctx, barX, barY, barW, barH, 5);
    ctx.fill();

    const fillW = barW * progress;
    if (fillW > 0) {
      const fillGrad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
      fillGrad.addColorStop(0, '#ff9029');
      fillGrad.addColorStop(1, '#f37021');
      ctx.fillStyle = fillGrad;
      roundRect(ctx, barX, barY, fillW, barH, 5);
      ctx.fill();
    }
    ctx.restore();

  } catch (err) {
    st = 'ready';
  }
}

// High-contrast text drawing: dark gray text (#1f242d) with thin white outline for light pastel background
function tx(s, x, y, size, align, col, withStroke = true) {
  ctx.font = '700 ' + size + 'px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  ctx.textAlign = align;
  if (withStroke) {
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = Math.max(2.5, size / 6);
    ctx.lineJoin = 'round';
    ctx.miterLimit = 2;
    ctx.strokeText(s, x, y);
  }
  ctx.fillStyle = col || '#1f242d';
  ctx.fillText(s, x, y);
}

// Clean light background with pre-rendered parallax layers
function drawBackground() {
  try {
    if (bgGradientCanvas) {
      ctx.drawImage(bgGradientCanvas, 0, 0);
    } else {
      ctx.fillStyle = '#f0f4f9';
      ctx.fillRect(0, 0, W, H);
    }

    // Parallax layers (scrolling smoothly and looping every 360 px)
    if (parallaxCanvases.length > 0) {
      const p0 = (cam * 0.08) % 360;
      ctx.drawImage(parallaxCanvases[0], -p0, 0);
    }
    if (parallaxCanvases.length > 1) {
      const p1 = (cam * 0.20) % 360;
      ctx.drawImage(parallaxCanvases[1], -p1, 0);
    }
    if (parallaxCanvases.length > 2) {
      const p2 = (cam * 0.35) % 360;
      ctx.drawImage(parallaxCanvases[2], -p2, 0);
    }

    // Slow light particles
    drawAtmosphereParticles();

  } catch (err) {
    ctx.fillStyle = '#f0f4f9';
    ctx.fillRect(0, 0, W, H);
  }
}

function drawAtmosphereParticles() {
  ctx.save();
  const type = curConfig.particleType || 'dust';
  for (const ap of atmoParts) {
    ctx.globalAlpha = ap.alpha || 0.6;
    if (type === 'petals') {
      ctx.save();
      ctx.translate(ap.x, ap.y);
      ctx.rotate(ap.rot);
      ctx.fillStyle = `hsla(${curConfig.H}, 75%, 72%, 0.7)`;
      ctx.beginPath();
      ctx.ellipse(0, 0, ap.size * 1.4, ap.size * 0.8, 0, 0, 6.28);
      ctx.fill();
      ctx.restore();
    } else if (type === 'snow') {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(ap.x, ap.y, ap.size * 0.65, 0, 6.28);
      ctx.fill();
    } else if (type === 'bubbles') {
      ctx.strokeStyle = `hsla(${curConfig.H}, 60%, 75%, 0.75)`;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(ap.x, ap.y, ap.size * 1.1, 0, 6.28);
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(ap.x - ap.size * 0.3, ap.y - ap.size * 0.3, ap.size * 0.35, 0, 6.28);
      ctx.fill();
    } else if (type === 'sparkles') {
      ctx.fillStyle = `hsla(${curConfig.H}, 80%, 70%, 0.8)`;
      ctx.save();
      ctx.translate(ap.x, ap.y);
      ctx.rotate(ap.rot);
      const sp = ap.size * 1.1;
      ctx.fillRect(-sp, -0.8, sp * 2, 1.6);
      ctx.fillRect(-0.8, -sp, 1.6, sp * 2);
      ctx.restore();
    } else if (type === 'leaves') {
      ctx.save();
      ctx.translate(ap.x, ap.y);
      ctx.rotate(ap.rot);
      ctx.fillStyle = `hsla(${curConfig.H}, 45%, 65%, 0.75)`;
      ctx.beginPath();
      ctx.moveTo(0, -ap.size * 1.3);
      ctx.quadraticCurveTo(ap.size, 0, 0, ap.size * 1.3);
      ctx.quadraticCurveTo(-ap.size, 0, 0, -ap.size * 1.3);
      ctx.fill();
      ctx.restore();
    } else {
      // Dust / light specks
      ctx.fillStyle = `hsla(${curConfig.H}, 40%, 75%, 0.7)`;
      ctx.beginPath();
      ctx.arc(ap.x, ap.y, ap.size * 0.7, 0, 6.28);
      ctx.fill();
    }
  }
  ctx.restore();
}

// Thin rails (about 10 px tall) with rivets and end caps; background shows beyond rail
function drawWall(s, x) {
  try {
    const cfg = curConfig;
    const w = s.w + 1;

    // 1. Top Rail: 10 px tall along [s.top - 28, s.top - 18]
    const topY = s.top - 28;
    drawRailSegment(x, topY, w, true, cfg);

    // 2. Bottom Rail: 10 px tall along [s.bot + 18, s.bot + 28]
    const botY = s.bot + 18;
    drawRailSegment(x, botY, w, false, cfg);

  } catch (err) {
    ctx.fillStyle = '#7a828e';
    ctx.fillRect(x, s.top - 28, s.w + 1, 10);
    ctx.fillRect(x, s.bot + 18, s.w + 1, 10);
  }
}

function drawRailSegment(x, y, w, isCeiling, cfg) {
  // Rail body gradient
  const railGrad = ctx.createLinearGradient(0, y, 0, y + 10);
  railGrad.addColorStop(0, '#ffffff');
  railGrad.addColorStop(0.2, cfg.railColor || '#7a828e');
  railGrad.addColorStop(0.8, cfg.railColor || '#7a828e');
  railGrad.addColorStop(1, '#1b2028');
  ctx.fillStyle = railGrad;
  ctx.fillRect(x, y, w, 10);

  // Top/bottom edge outlines
  ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
  ctx.fillRect(x, y, w, 1);
  ctx.fillStyle = 'rgba(20, 24, 32, 0.85)';
  ctx.fillRect(x, y + 9, w, 1);

  // Metal end caps at each end of the rail segment
  ctx.fillStyle = '#222834';
  ctx.fillRect(x - 1, y - 1, 3, 12);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(x - 1, y - 1, 1, 12);

  ctx.fillStyle = '#222834';
  ctx.fillRect(x + w - 2, y - 1, 3, 12);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
  ctx.fillRect(x + w - 2, y - 1, 1, 12);

  // Ornamentation along the rail
  const centerY = y + 5;
  const style = cfg.railStyle || 'rivets';
  const startRivet = Math.floor(x / 16) * 16;

  if (style === 'rivets' || style === 'dots') {
    for (let rx = startRivet; rx <= x + w + 16; rx += 16) {
      if (rx < x + 3 || rx > x + w - 3) continue;
      ctx.fillStyle = '#1e242d';
      ctx.beginPath(); ctx.arc(rx, centerY, 2.2, 0, 6.28); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(rx - 0.6, centerY - 0.6, 1, 0, 6.28); ctx.fill();
    }
  } else if (style === 'bolts') {
    for (let rx = startRivet; rx <= x + w + 18; rx += 18) {
      if (rx < x + 4 || rx > x + w - 4) continue;
      ctx.fillStyle = '#1e242d';
      ctx.fillRect(rx - 2.5, centerY - 2.5, 5, 5);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(rx - 2, centerY - 2, 2, 2);
    }
  } else if (style === 'small gears') {
    for (let rx = startRivet; rx <= x + w + 14; rx += 14) {
      if (rx < x + 3 || rx > x + w - 3) continue;
      ctx.fillStyle = '#1e242d';
      ctx.beginPath(); ctx.arc(rx, centerY, 2.8, 0, 6.28); ctx.fill();
      ctx.fillStyle = cfg.railColor || '#7a828e';
      ctx.beginPath(); ctx.arc(rx, centerY, 1.4, 0, 6.28); ctx.fill();
    }
  } else if (style === 'chain links') {
    ctx.strokeStyle = '#1e242d';
    ctx.lineWidth = 1.3;
    for (let rx = startRivet; rx <= x + w + 14; rx += 12) {
      if (rx < x + 3 || rx > x + w - 3) continue;
      ctx.strokeRect(rx - 4, centerY - 2, 8, 4);
    }
  }
}

// Blit pre-rendered 3D glossy stud sprites
function drawSpike(x, baseY, isTop, sp) {
  try {
    if (!sp || !sp.h || sp.h <= 0) return;
    const key = `${sp.size}_${isTop ? 'top' : 'bot'}`;
    const spr = spikeCanvases[key];
    if (spr) {
      if (isTop) {
        ctx.drawImage(spr, x + 6 - 18, baseY - 2);
      } else {
        ctx.drawImage(spr, x + 6 - 18, baseY - 46);
      }
    }
  } catch (err) {}
}

function draw() {
  if (st === 'loading') {
    if (loadingFade > 0) {
      drawGameContent();
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - loadingFade);
      drawLoadingScreen();
      ctx.restore();
    } else {
      drawLoadingScreen();
    }
    return;
  }
  drawGameContent();
}

function drawGameContent() {
  const cfg = curConfig;

  // 1. Clean light background
  drawBackground();

  // 2. Starting Road Platform (-50 to 470)
  try {
    drawRoadPlatform(START_ROAD_START, START_ROAD_END, ROAD_TOP);
  } catch (e) {}

  // 3. Finish Road Platform (1950 to 2470) with flags and lights
  try {
    drawRoadPlatform(FINISH_ROAD_X, FINISH_ROAD_END, ROAD_TOP, true);
  } catch (e) {}

  // 4. Man in black suit standing near end of finish platform
  try {
    drawMan(FINISH_ROAD_X + 430 - cam, ROAD_TOP + 24);
  } catch (e) {}

  // 5. Tunnel rails & 3D studs
  try {
    for (const s of segs) {
      const x = s.x - cam;
      if (!s.isOpen) drawWall(s, x);

      if (s.topSpikes) {
        const count = s.topSpikes.length;
        for (let i = 0; i < count; i++) {
          drawSpike(x + i * 12, s.top - 18, true, s.topSpikes[i]);
        }
      }
      if (s.botSpikes) {
        const count = s.botSpikes.length;
        for (let i = 0; i < count; i++) {
          drawSpike(x + i * 12, s.bot + 18, false, s.botSpikes[i]);
        }
      }
    }
  } catch (e) {}

  // 6. Sky Car (McLaren F1 supercar) with soft shadow and crisp dark outline
  try {
    car(CAR_X);
  } catch (e) {
    ctx.save();
    ctx.fillStyle = '#f37021';
    ctx.fillRect(CAR_X - 25 * CAR_SCALE, cy - 8 * CAR_SCALE, 50 * CAR_SCALE, 16 * CAR_SCALE);
    ctx.restore();
  }

  // 7. Vertical wheel thruster smoke and road dust
  try {
    for (const p of parts) {
      const k = 1 - p.l / p.m;
      ctx.globalAlpha = 0.75 * k;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(p.x, p.y, (p.size || 4) * (1 + 0.4 * (1 - k)), 0, 6.28);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  } catch (e) {
    ctx.globalAlpha = 1;
  }

  // 8. Confetti during Level Complete
  try {
    drawConfetti();
  } catch (e) {}

  // 9. HUD and UI screens (high contrast dark gray text with white outline)
  try {
    const tunnelDist = Math.max(0, Math.min(LEVEL_LENGTH, (cam + CAR_X) - TUNNEL_START_X));
    const progress = tunnelDist / LEVEL_LENGTH;
    const curScore = Math.floor(progress * 100);
    const currentTotal = 100 * (curLevel - 1) + curScore;
    if (currentTotal > best) { best = currentTotal; try { localStorage.setItem('skycarBest', best); } catch (e) {} }

    if (st === 'play') {
      const bx = 16, by = 24, bw = W - 32, bh = 8;

      // Level and Name
      tx('Level ' + curLevel + ': ' + cfg.name, W / 2, 18, 13, 'center', '#1f242d');

      // Progress bar track
      ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.strokeStyle = '#1f242d';
      ctx.lineWidth = 1.5;
      roundRect(ctx, bx, by, bw, bh, 4);
      ctx.fill();
      ctx.stroke();

      // Progress bar fill: hsl(H, 80%, 50%)
      const fillW = Math.max(0, bw * progress);
      if (fillW > 0) {
        ctx.fillStyle = `hsl(${cfg.H}, 80%, 50%)`;
        roundRect(ctx, bx, by, fillW, bh, 4);
        ctx.fill();
      }

      // Scores
      tx(curScore + ' / 100', 16, 66, 24, 'left');
      tx('Score ' + currentTotal + '  |  Best ' + best, W - 16, 64, 13, 'right', '#1f242d');

    } else if (st === 'transition') {
      if (transitionTimer < 0.25) {
        const fadeOut = Math.min(1, transitionTimer / 0.25);
        ctx.fillStyle = 'rgba(0, 0, 0, ' + fadeOut + ')';
        ctx.fillRect(0, 0, W, H);
      } else {
        if (transitionTimer < 0.5) {
          const fadeIn = Math.max(0, 1 - (transitionTimer - 0.25) / 0.25);
          ctx.fillStyle = 'rgba(0, 0, 0, ' + fadeIn + ')';
          ctx.fillRect(0, 0, W, H);
        }

        // Title Card showing Level Name
        let cardAlpha = 1;
        if (transitionTimer < 0.45) {
          cardAlpha = Math.min(1, Math.max(0, (transitionTimer - 0.25) / 0.2));
        } else if (transitionTimer > 1.5) {
          cardAlpha = Math.min(1, Math.max(0, 1 - (transitionTimer - 1.5) / 0.25));
        }

        ctx.save();
        ctx.globalAlpha = cardAlpha;
        const cardW = 310, cardH = 104, cardY = 210;
        ctx.shadowColor = 'rgba(0, 0, 0, 0.18)';
        ctx.shadowBlur = 18;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
        roundRect(ctx, W / 2 - cardW / 2, cardY, cardW, cardH, 16);
        ctx.fill();
        ctx.strokeStyle = `hsl(${cfg.H}, 80%, 45%)`;
        ctx.lineWidth = 2.5;
        ctx.stroke();

        tx('LEVEL ' + curLevel + ': ' + cfg.name.toUpperCase(), W / 2, cardY + 44, 18, 'center', `hsl(${cfg.H}, 80%, 35%)`, false);
        tx('Drive on road, tap to lift off!', W / 2, cardY + 76, 14, 'center', '#1f242d', false);
        ctx.restore();

        const bx = 16, by = 24, bw = W - 32, bh = 8;
        tx('Level ' + curLevel + ': ' + cfg.name, W / 2, 18, 13, 'center', '#1f242d');
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.strokeStyle = '#1f242d';
        ctx.lineWidth = 1.5;
        roundRect(ctx, bx, by, bw, bh, 4);
        ctx.fill();
        ctx.stroke();

        tx('0 / 100', 16, 66, 24, 'left');
        const startScore = 100 * (curLevel - 1);
        tx('Score ' + startScore + '  |  Best ' + best, W - 16, 64, 13, 'right', '#1f242d');
      }

    } else if (st === 'level_complete') {
      ctx.fillStyle = 'rgba(15, 20, 28, 0.35)';
      ctx.fillRect(0, 0, W, H);

      const bannerY = 150;
      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.15)';
      ctx.shadowBlur = 18;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.96)';
      roundRect(ctx, W / 2 - 140, bannerY, 280, 86, 16);
      ctx.fill();
      ctx.strokeStyle = '#2ebd4a';
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.restore();

      tx('Level ' + curLevel + ' Complete!', W / 2, bannerY + 36, 23, 'center', '#2ebd4a', false);
      tx('Score: ' + (100 * curLevel), W / 2, bannerY + 66, 17, 'center', '#1f242d', false);

      const btnActive = levelCompleteTimer >= 0.8;
      const pulse = btnActive ? (1 + 0.04 * Math.sin((levelCompleteTimer - 0.8) * 8)) : 1;
      const btnW = 240 * pulse;
      const btnH = 54 * pulse;
      const btnX = W / 2 - btnW / 2;
      const btnY = 380 - (btnH - 54) / 2;

      ctx.save();
      if (btnActive) {
        ctx.shadowColor = 'rgba(46, 189, 74, 0.35)';
        ctx.shadowBlur = 14;
        ctx.fillStyle = '#2ebd4a';
        ctx.strokeStyle = '#249c3c';
      } else {
        ctx.fillStyle = '#e2e6ee';
        ctx.strokeStyle = '#cbd2de';
      }
      roundRect(ctx, btnX, btnY, btnW, btnH, 27 * pulse);
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();

      const nextLvl = curLevel + 1;
      if (btnActive) {
        tx('Tap for Level ' + nextLvl, W / 2, btnY + btnH / 2 + 6, 19 * pulse, 'center', '#ffffff', false);
      } else {
        tx('Level ' + nextLvl + ' Ready...', W / 2, btnY + btnH / 2 + 5, 16, 'center', '#6e7687', false);
      }

    } else if (st === 'ready') {
      ctx.fillStyle = 'rgba(15, 20, 28, 0.3)';
      ctx.fillRect(0, 0, W, H);

      tx('Sky Car', W / 2, 170, 48, 'center', '#1f242d');
      tx('LEVEL ' + curLevel + ': ' + cfg.name.toUpperCase(), W / 2, 220, 16, 'center', `hsl(${cfg.H}, 80%, 35%)`);
      tx('Drive on road, then launch into spikes!', W / 2, 250, 14, 'center', '#1f242d');

      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.15)';
      ctx.shadowBlur = 14;
      ctx.fillStyle = '#f37021';
      roundRect(ctx, W / 2 - 115, 440, 230, 52, 26);
      ctx.fill();
      ctx.strokeStyle = '#c85008';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();

      tx('TAP TO START', W / 2, 472, 18, 'center', '#ffffff', false);

    } else if (st === 'dead') {
      ctx.fillStyle = 'rgba(15, 20, 28, 0.55)';
      ctx.fillRect(0, 0, W, H);

      const cardY = 175;
      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
      ctx.shadowBlur = 18;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.96)';
      roundRect(ctx, W / 2 - 140, cardY, 280, 165, 16);
      ctx.fill();
      ctx.strokeStyle = '#e0262f';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();

      tx('Crashed', W / 2, cardY + 40, 36, 'center', '#e0262f', false);
      tx('Level ' + curLevel + ': ' + curScore + ' / 100', W / 2, cardY + 76, 18, 'center', '#1f242d', false);
      tx('Total Score: ' + currentTotal, W / 2, cardY + 104, 15, 'center', '#4b5563', false);
      tx('Best Score: ' + best, W / 2, cardY + 130, 15, 'center', '#f37021', false);

      const retryText = RETRY_FROM_LEVEL_START ? ('RETRY LEVEL ' + curLevel) : 'RETRY LEVEL 1';
      ctx.save();
      ctx.shadowColor = 'rgba(243, 112, 33, 0.35)';
      ctx.shadowBlur = 14;
      ctx.fillStyle = '#f37021';
      roundRect(ctx, W / 2 - 115, 390, 230, 52, 26);
      ctx.fill();
      ctx.strokeStyle = '#c85008';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();

      tx(retryText, W / 2, 422, 17, 'center', '#ffffff', false);
    }
  } catch (e) {}
}

function loop(t) {
  const dt = Math.min(.033, (t - last) / 1000 || 0);
  last = t;
  step(dt);
  draw();
  requestAnimationFrame(loop);
}

function press() {
  if (st === 'loading') return;
  if (st === 'ready') {
    st = 'play';
    hold = true;
  } else if (st === 'level_complete') {
    if (levelCompleteTimer >= 0.8) {
      nextLevelTarget = curLevel + 1;
      st = 'transition';
      transitionTimer = 0;
      hold = false;
    }
  } else if (st === 'transition') {
    if (transitionTimer >= 0.5) {
      st = 'play';
      hold = true;
    }
  } else if (st === 'dead') {
    if (performance.now() - deadAt < 400) return;
    if (RETRY_FROM_LEVEL_START) {
      startLevel(curLevel);
    } else {
      startLevel(1);
    }
    st = 'ready';
    hold = false;
  } else if (st === 'play') {
    hold = true;
  }
}

const rel = () => { hold = false; };
addEventListener('pointerdown', e => { e.preventDefault(); press(); });
addEventListener('pointerup', rel);
addEventListener('pointercancel', rel);
addEventListener('blur', rel);
document.addEventListener('visibilitychange', rel);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) press(); } });
addEventListener('keyup', e => { if (e.code === 'Space') rel(); });
addEventListener('contextmenu', e => e.preventDefault());

resetGame();
step(0);
draw();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
